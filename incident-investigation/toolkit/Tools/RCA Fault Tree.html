<style>
/* Layout: investigation workbench. Brand bar with File menu, tabs, tree canvas with an inspector rail.

  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;

  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;

<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
    async del(k) { try { const d = await db(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async keys(prefix) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res((q.result || []).filter(k => typeof k === 'string' && (!prefix || k.startsWith(prefix)))); q.onerror = () => res([]); }); } catch (e) { return []; } }
  };

  /* ---------- files ---------- */
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function pickWithInput(accept) {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.style.display = 'none';
      i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
      document.body.appendChild(i); i.click();
    });
  }
  async function permission(handle, ask) {
    if (!handle || !handle.queryPermission) return 'denied';
    try {
      let s = await handle.queryPermission({ mode: 'readwrite' });
      if (s !== 'granted' && ask) s = await handle.requestPermission({ mode: 'readwrite' });
      return s;
    } catch (e) { return 'denied'; }
  }
  /* opts: {tool, ext, label, mime} e.g. {tool:'tripod', ext:'.tripod.json', label:'Tripod Beta case'} */
  function FileLink(opts) {
    const types = [{ description: opts.label, accept: { [opts.mime || 'application/json']: [opts.ext.slice(opts.ext.lastIndexOf('.'))] } }];
    const key = id => 'handle:' + opts.tool + ':' + id;
    return {
      supported: hasFSA,
      /* Ask where to save; returns {handle, name} or null when cancelled. */
      async saveAs(id, suggested, text) {
        if (!hasFSA) { download(suggested, text, opts.mime || 'application/json'); return { handle: null, name: suggested, downloaded: true }; }
        let h;
        try { h = await window.showSaveFilePicker({ suggestedName: suggested, types, id: 'iikit-cases' }); }
        catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
        await this.write(h, text);
        await KitStore.set(key(id), h);
        return { handle: h, name: h.name };
      },
      async write(h, text) { const w = await h.createWritable(); await w.write(text); await w.close(); },
      /* Open a file; returns {handle|null, name, text} or null. */
      async open() {
        if (hasFSA) {
          let hs;
          try { hs = await window.showOpenFilePicker({ types, multiple: false, id: 'iikit-cases' }); }
          catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
          const f = await hs[0].getFile();
          return { handle: hs[0], name: f.name, text: await f.text(), modified: f.lastModified };
        }
        const f = await pickWithInput(opts.ext + ',.json,application/json');
        return f ? { handle: null, name: f.name, text: await f.text(), modified: f.lastModified } : null;
      },
      async link(id, h) { if (h) await KitStore.set(key(id), h); },
      async unlink(id) { await KitStore.del(key(id)); },
      async handleFor(id) { return await KitStore.get(key(id)); },
      permission,
      download: (name, text) => download(name, text, opts.mime || 'application/json')
    };
  }

  /* ---------- registry of investigations on this computer ---------- */
  const RK = 'iikit.registry';
  const KitRegistry = {
    list() { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } },
    upsert(entry) {
      try {
        const L = this.list().filter(x => !(x.tool === entry.tool && x.id === entry.id));
        L.push(Object.assign({ seenAt: new Date().toISOString() }, entry));
        localStorage.setItem(RK, JSON.stringify(L.slice(-500)));
      } catch (e) {}
    },
    remove(tool, id) { try { localStorage.setItem(RK, JSON.stringify(this.list().filter(x => !(x.tool === tool && x.id === id)))); } catch (e) {} }
  };
  /* action summary helper: items [{status, due}] with open statuses */
  function actionStats(items, isOpen, dueOf) {
    const today = new Date().toISOString().slice(0, 10);
    let open = 0, overdue = 0; const dues = [];
    (items || []).forEach(a => { if (isOpen(a)) { open++; const d = dueOf(a); if (d) dues.push(String(d).slice(0, 10)); if (d && d < today) overdue++; } });
    return { total: (items || []).length, open, overdue, dues };
  }

  /* ---------- dashboard -> tool hand-off ---------- */
  const KitHandoff = {
    async put(tool, handle, name) { return KitStore.set('handoff:' + tool, { handle, name, at: Date.now() }); },
    async take(tool) { const v = await KitStore.get('handoff:' + tool); await KitStore.del('handoff:' + tool); return v && Date.now() - v.at < 10 * 60000 ? v : null; }
  };

  return { VERSION, hasFSA, hasDirPicker, KitStore, FileLink, KitRegistry, KitHandoff, actionStats, download, pickWithInput, permission };
})();
if (typeof module !== 'undefined') module.exports = KIT;
</script>
<script>/* RCA Fault Tree — generic reliability data library.
   Typical screening values from published generic sources. They are starting points for ranking RCA hypotheses,
   NOT design data: every value can be edited per event, overridden for the case on the Data library tab, or
   replaced with site data. Sources (short names used in `ref`):
     CCPS-LOPA   CCPS, Layer of Protection Analysis: Simplified Process Risk Assessment (2001) and
                 Guidelines for Initiating Events and Independent Protection Layers in LOPA (2015)
     IEC61511    IEC 61511-1 SIL bands (PFDavg upper bound of the band used)
     THERP       Swain & Guttmann, NUREG/CR-1278 Handbook of Human Reliability Analysis (1983)
     HEART       Williams, HEART generic task types (nominal human unreliability, 5th–95th bounds)
     GENERIC     Typical generic per-demand failure probabilities quoted in CCPS CPQRA / process-industry
                 reliability handbooks (order-of-magnitude screening values)
   unit 'p' = probability per demand / per occasion; 'f' = frequency per year. */
var RCALIB = (function () {
  const L = [];
  const add = (src, id, name, value, unit, range, ref, note) => L.push({ src, id, name, value, unit, range: range || '', ref, note: note || '' });

  /* ---- Independent protection layers / safeguards: PFD ---- */
  const I = (id, n, v, r, ref, note) => add('ipl', id, n, v, 'p', r, ref || 'CCPS-LOPA', note);
  I('ipl-bpcs', 'BPCS control loop acting as a safeguard (not the initiator)', 0.1, '0.1 (max credit)', 'CCPS-LOPA / IEC61511', 'Max credit for BPCS per IEC 61511');
  I('ipl-op10', 'Operator response to alarm, ≥10 min available, trained, procedure', 0.1, '0.1–1', 'CCPS-LOPA', 'Only if alarm independent of the initiator');
  I('ipl-op-short', 'Operator response to alarm, <10 min or complex diagnosis', 1, '1 (no credit)', 'CCPS-LOPA');
  I('ipl-sil1', 'Safety instrumented function, SIL 1', 0.1, '0.1–0.01', 'IEC61511');
  I('ipl-sil2', 'Safety instrumented function, SIL 2', 0.01, '0.01–0.001', 'IEC61511');
  I('ipl-sil3', 'Safety instrumented function, SIL 3', 0.001, '0.001–0.0001', 'IEC61511');
  I('ipl-prv', 'Pressure relief valve (clean service)', 0.01, '0.1–0.00001', 'CCPS-LOPA', 'Fouling, plugging or polymerising service: use 0.1');
  I('ipl-rd', 'Rupture disc', 0.01, '0.1–0.00001', 'CCPS-LOPA');
  I('ipl-bund', 'Dike / bund (secondary containment)', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-drain', 'Underground drainage / spill collection system', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-vent', 'Open vent (no valve)', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-fireproof', 'Fireproofing / passive fire protection', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-blast', 'Blast wall / bunker', 0.001, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-arrester', 'Flame or detonation arrester', 0.01, '0.1–0.001', 'CCPS-LOPA');
  I('ipl-check', 'Check valve, single (reverse flow)', 0.1, '1–0.1', 'CCPS-LOPA', 'Many companies give no IPL credit (PFD 1)');
  I('ipl-vacbrk', 'Vacuum breaker', 0.01, '0.1–0.01', 'CCPS-LOPA');
  I('ipl-ro', 'Restriction orifice (limits flow)', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-deluge', 'Automatic deluge / sprinkler system', 0.1, '0.1–0.01', 'CCPS-LOPA');
  I('ipl-gasdet', 'Gas detection with automatic action', 0.1, '1–0.1', 'CCPS-LOPA');
  I('ipl-interlock', 'Hard-wired mechanical / electrical interlock', 0.01, '0.1–0.001', 'CCPS-LOPA');

  /* ---- Human error probabilities ---- */
  const H = (id, n, v, r, ref, note) => add('hep', id, n, v, 'p', r, ref, note);
  H('hep-heartA', 'HEART A: totally unfamiliar task, performed at speed, no idea of consequences', 0.55, '0.35–0.97', 'HEART');
  H('hep-heartB', 'HEART B: shift or restore system to a new state at one attempt, no supervision or procedure', 0.26, '0.14–0.42', 'HEART');
  H('hep-heartC', 'HEART C: complex task needing high understanding and skill', 0.16, '0.12–0.28', 'HEART');
  H('hep-heartD', 'HEART D: fairly simple task performed rapidly or given scant attention', 0.09, '0.06–0.13', 'HEART');
  H('hep-heartE', 'HEART E: routine, highly practised, rapid task, low skill', 0.02, '0.007–0.045', 'HEART');
  H('hep-heartF', 'HEART F: restore or shift system following procedure, with some checking', 0.003, '0.0008–0.007', 'HEART');
  H('hep-heartG', 'HEART G: completely familiar, well-designed, highly practised routine task', 0.0004, '0.00008–0.009', 'HEART');
  H('hep-heartH', 'HEART H: respond correctly to command when an automated supervisory system is in place', 0.00002, '0.000006–0.0009', 'HEART');
  H('hep-omit-check', 'Omit a step from a written procedure that has check-off', 0.001, '0.0005–0.005', 'THERP');
  H('hep-omit-nocheck', 'Omit a step from a written procedure, no check-off', 0.003, '0.001–0.01', 'THERP');
  H('hep-omit-long', 'Omit a step from a long list (>10 items), no check-off', 0.01, '0.003–0.03', 'THERP');
  H('hep-wrong-ctrl', 'Select wrong control from a group of similar-looking controls', 0.003, '0.001–0.01', 'THERP');
  H('hep-wrong-ctrl-clear', 'Select wrong control, controls well delineated / labelled', 0.001, '0.0005–0.005', 'THERP');
  H('hep-read-meter', 'Misread an analogue meter / gauge', 0.003, '0.001–0.01', 'THERP');
  H('hep-checker', 'Second-person check fails to detect the error', 0.1, '0.05–0.5', 'THERP');
  H('hep-alarm-single', 'Fail to respond to a single clear alarm, low workload', 0.001, '0.0001–0.01', 'THERP');
  H('hep-alarm-flood', 'Fail to respond to an alarm, high workload / many alarms', 0.1, '0.05–0.5', 'THERP');
  H('hep-isolation', 'Isolation error: wrong valve or breaker isolated', 0.003, '0.001–0.01', 'THERP');
  H('hep-verbal', 'Error in recalling or passing on a verbal instruction (several items)', 0.003, '0.001–0.01', 'THERP');
  H('hep-restore', 'Fail to restore equipment (bypass, valve, guard) after maintenance', 0.003, '0.001–0.01', 'HEART F / THERP');

  /* ---- Equipment failure on demand ---- */
  const E = (id, n, v, r, note) => add('equip', id, n, v, 'p', r, 'GENERIC', note);
  E('eq-pump-start', 'Pump fails to start on demand', 0.003, '0.001–0.01');
  E('eq-firepump', 'Diesel fire pump fails to start', 0.01, '0.003–0.03');
  E('eq-edg', 'Emergency generator fails to start', 0.03, '0.01–0.1');
  E('eq-mov', 'Motor-operated valve fails to open / close on demand', 0.003, '0.001–0.01');
  E('eq-aov', 'Air-operated valve fails to operate on demand', 0.002, '0.001–0.01');
  E('eq-sov', 'Solenoid valve fails to operate on demand', 0.001, '0.0005–0.005');
  E('eq-manual-valve', 'Manual valve fails to operate (stuck)', 0.001, '0.0001–0.005');
  E('eq-checkv', 'Check valve fails to close (reverse flow)', 0.001, '0.0001–0.01');
  E('eq-prv', 'Relief valve fails to open at set pressure', 0.003, '0.001–0.01');
  E('eq-lswitch', 'Level / pressure switch fails on demand (annual test)', 0.01, '0.003–0.05', 'Longer test intervals scale the value up');
  E('eq-ltx', 'Transmitter fails, reading frozen or wrong (annual test)', 0.01, '0.003–0.05');
  E('eq-gasdet', 'Gas detector fails to detect (annual test)', 0.05, '0.01–0.1');
  E('eq-alarm', 'Alarm horn / beacon fails on demand', 0.01, '0.001–0.03');
  E('eq-relay', 'Relay fails to operate', 0.0001, '0.00003–0.001');
  E('eq-breaker', 'Circuit breaker fails to open on demand', 0.003, '0.001–0.01');
  E('eq-ups', 'UPS / battery fails to supply on demand', 0.01, '0.003–0.03');
  E('eq-hose', 'Flexible transfer hose ruptures (per transfer)', 0.0001, '0.00001–0.001');
  E('eq-sling', 'Lifting sling / wire rope fails under rated load (per lift, inspected)', 0.00001, '0.000001–0.0001');
  E('eq-hoistbrake', 'Hoist brake fails to hold on demand', 0.0001, '0.00003–0.001');
  E('eq-harness', 'Fall-arrest harness / lanyard fails on arrest', 0.0001, '0.00001–0.001');
  E('eq-guard-interlock', 'Machine guard interlock fails to stop machine on opening', 0.001, '0.0001–0.01');

  /* ---- Initiating event frequencies (/yr) ---- */
  const F = (id, n, v, r, note) => add('freq', id, n, v, 'f', r, 'CCPS-LOPA', note);
  F('ie-bpcs', 'BPCS instrument loop failure', 0.1, '1–0.1');
  F('ie-regulator', 'Pressure regulator failure', 0.1, '1–0.1');
  F('ie-pumpseal', 'Pump seal failure (leak)', 0.1, '1–0.01');
  F('ie-hose', 'Loading / unloading hose failure', 0.1, '1–0.01');
  F('ie-gasket', 'Gasket / packing blow-out', 0.01, '0.1–0.001');
  F('ie-pipe-leak', 'Piping leak (10 % section), 100 m', 0.001, '0.001–0.0001');
  F('ie-pipe-rupture', 'Piping full-bore rupture, 100 m', 0.00001, '0.00001–0.000001');
  F('ie-atmtank', 'Atmospheric tank catastrophic failure', 0.001, '0.001–0.0001');
  F('ie-vessel', 'Pressure vessel residual failure', 0.000001, '0.00001–0.0000001');
  F('ie-cw', 'Loss of cooling water', 0.1, '1–0.1');
  F('ie-power', 'Loss of power supply', 0.1, '1–0.1');
  F('ie-spurious-prv', 'Relief valve opens spuriously', 0.01, '0.1–0.001');
  F('ie-thirdparty', 'Third-party impact (vehicle, excavation)', 0.01, '0.1–0.001');
  F('ie-lightning', 'Lightning strike', 0.001, '0.001–0.0001');
  F('ie-extfire', 'Large external fire', 0.01, '0.1–0.001');
  F('ie-turbine', 'Turbine / diesel overspeed with casing breach', 0.0001, '0.001–0.00001');

  const SOURCES = [
    { k: 'none', name: 'Not quantified', unit: '' },
    { k: 'manual', name: 'Manual value', unit: '' },
    { k: 'ipl', name: 'Safeguard / IPL PFD', unit: 'p' },
    { k: 'hep', name: 'Human error probability', unit: 'p' },
    { k: 'equip', name: 'Equipment failure on demand', unit: 'p' },
    { k: 'freq', name: 'Initiating event frequency', unit: 'f' },
    { k: 'site', name: 'Site data (custom library item)', unit: '' }
  ];
  const REFS = {
    'CCPS-LOPA': 'CCPS, Layer of Protection Analysis (2001); Guidelines for Initiating Events and IPLs in LOPA (2015)',
    IEC61511: 'IEC 61511-1, safety instrumented systems for the process industry sector (SIL bands)',
    THERP: 'Swain & Guttmann, NUREG/CR-1278 Handbook of Human Reliability Analysis (1983)',
    HEART: 'Williams, HEART – Human Error Assessment and Reduction Technique (generic task types)',
    GENERIC: 'Typical generic process-industry per-demand failure values (CCPS CPQRA and reliability handbooks)'
  };
  return { ITEMS: L, SOURCES, REFS };
})();
if (typeof module !== 'undefined') module.exports = RCALIB;
</script>
<script>/* RCA Fault Tree — engine: evaluation (probability / frequency), evidence conditioning, minimal cut sets,
   consistency checks, tidy top-down layout and SVG drawing. Pure functions; no DOM.
   Case: { meta, root, nodes:{id: node}, actions:[], libOverrides:{itemId: value}, customLib:[items] }
   Node: { id, code, kind:'gate'|'basic'|'undeveloped'|'house', label, gate:'OR'|'AND'|'INHIBIT'|'VOTE', k, children:[ids],
           status:'confirmed'|'likely'|'unverified'|'ruledout', evidence, test, testOwner, testDue, cause, category, why, notes, collapsed,
           prob:{ src, item, value, unit, note } } */
var RCAE = (function () {
  const LIB = (typeof RCALIB !== 'undefined') ? RCALIB : require('./library.js');
  const STATUS = {
    confirmed: { name: 'Confirmed', col: '#1f7a45', soft: '#e3f3e9' },
    likely: { name: 'Likely', col: '#a86200', soft: '#fff1d9' },
    unverified: { name: 'Unverified', col: '#64707e', soft: '#eef1f4' },
    ruledout: { name: 'Ruled out', col: '#b42318', soft: '#f6e3e1' }
  };
  const GATES = { OR: 'OR – any input causes it', AND: 'AND – all inputs needed', INHIBIT: 'INHIBIT – input plus enabling condition', VOTE: 'VOTE – k of n inputs' };
  const KINDS = { gate: 'Intermediate event (gate)', basic: 'Basic event', undeveloped: 'Undeveloped event', house: 'Condition / house event' };
  const CAUSE = { '': 'Not classified', causal: 'Causal factor', root: 'Root cause', contributing: 'Contributing factor' };
  const CATEGORIES = ['Equipment / hardware', 'Human performance', 'Procedures', 'Design / engineering', 'Maintenance', 'Training / competence', 'Organisation / management', 'Communication', 'Work environment', 'External'];

  const isGate = n => n && n.kind === 'gate';
  const kids = (c, n) => ((n && n.children) || []).map(id => c.nodes[id]).filter(Boolean);

  /* ---------- library lookup ---------- */
  function libItem(c, id) {
    if (!id) return null;
    const custom = (c.customLib || []).find(x => x.id === id);
    const base = custom || LIB.ITEMS.find(x => x.id === id);
    if (!base) return null;
    const ov = c.libOverrides && c.libOverrides[id] != null ? +c.libOverrides[id] : null;
    return Object.assign({}, base, { def: base.value, value: ov != null ? ov : base.value, overridden: ov != null });
  }
  function unitOf(c, n) {
    if (!n) return 'p';
    if (isGate(n)) {
      const ks = kids(c, n);
      if (n.gate === 'OR') return ks.length && ks.every(k => unitOf(c, k) === 'f') ? 'f' : (ks.some(k => unitOf(c, k) === 'f') ? 'mixed' : 'p');
      return ks.some(k => { const u = unitOf(c, k); return u === 'f' || u === 'mixed'; }) ? 'f' : 'p';
    }
    const p = n.prob || {};
    if (p.src === 'freq') return 'f';
    if ((p.src === 'manual' || p.src === 'site') && p.unit === 'f') return 'f';
    if (p.src === 'site') { const it = libItem(c, p.item); if (it && it.unit === 'f') return 'f'; }
    return 'p';
  }
  /* The event's own (prior) value, before evidence: NaN when not quantified. */
  function rawValue(c, n) {
    const p = n.prob || {};
    if (n.kind === 'house' && (!p.src || p.src === 'none')) return 1;
    if (!p.src || p.src === 'none') return NaN;
    const v = p.value;
    if (v === '' || v == null || isNaN(+v)) return NaN;
    return +v;
  }

  /* ---------- evaluation ----------
     mode 'prior'    : every event at its own value (what was likely before the investigation)
     mode 'evidence' : ruled out = 0, confirmed probability events = 1, the rest at their value
     force           : {id: value} overrides (used for conditioning). Returns {v, u, err[]} for the node. */
  function evaluate(c, mode, force) {
    const memo = {}, errs = [];
    const val = id => {
      if (memo[id]) return memo[id];
      const n = c.nodes[id]; if (!n) return { v: NaN, u: 'p' };
      const u = unitOf(c, n);
      let r;
      if (force && force[id] != null) r = { v: force[id], u };
      else if (mode === 'evidence' && n.status === 'ruledout') r = { v: 0, u };
      else if (!isGate(n)) {
        if (mode === 'evidence' && n.status === 'confirmed' && u === 'p') r = { v: 1, u };
        else r = { v: rawValue(c, n), u };
      } else {
        const ks = kids(c, n).map(k => val(k.id));
        if (!ks.length) r = { v: NaN, u };
        else if (n.gate === 'OR') {
          const nz = ks.filter(k => k.v !== 0);
          const hasF = nz.some(k => k.u === 'f'), hasP = nz.some(k => k.u === 'p');
          if (hasF && hasP) { errs.push({ id, code: 'U1' }); r = { v: NaN, u: 'mixed' }; }
          else if (hasF) r = { v: nz.some(k => isNaN(k.v)) ? NaN : nz.reduce((a, k) => a + k.v, 0), u: 'f' };
          else if (nz.some(k => k.v >= 1)) r = { v: 1, u: 'p' };
          else r = { v: nz.some(k => isNaN(k.v)) ? NaN : 1 - nz.reduce((a, k) => a * (1 - k.v), 1), u: 'p' };
        } else if (n.gate === 'VOTE') {
          const k = Math.max(1, Math.min(ks.length, +n.k || 2));
          if (ks.some(x => x.u === 'f')) { errs.push({ id, code: 'U3' }); r = { v: NaN, u: 'p' }; }
          else if (ks.some(x => isNaN(x.v))) r = { v: NaN, u: 'p' };
          else { // P(at least k of n)
            let dp = [1]; ks.forEach(x => { const nd = new Array(dp.length + 1).fill(0); dp.forEach((pv, j) => { nd[j] += pv * (1 - x.v); nd[j + 1] += pv * x.v; }); dp = nd; });
            r = { v: dp.slice(k).reduce((a, b) => a + b, 0), u: 'p' };
          }
        } else { // AND, INHIBIT
          if (ks.some(x => x.v === 0)) r = { v: 0, u };
          else {
            const nf = ks.filter(x => x.u === 'f').length;
            if (nf > 1) { errs.push({ id, code: 'U2' }); r = { v: NaN, u: 'f' }; }
            else r = { v: ks.some(x => isNaN(x.v)) ? NaN : ks.reduce((a, x) => a * x.v, 1), u: nf ? 'f' : 'p' };
          }
        }
      }
      memo[id] = r; return r;
    };
    const top = val(c.root);
    return { top, val, errs, memo };
  }

  /* Posterior share for every unresolved node: how likely it is that it contributed, given the top event and the
     evidence so far. Probability nodes: P(X | top) = p(X) * V(top | X=1) / V(top). Frequency nodes (initiators):
     share of the top frequency, (V(top) - V(top | X=0)) / V(top). */
  function posteriors(c) {
    const base = evaluate(c, 'evidence'), V = base.top.v, out = {};
    if (!(V > 0) || isNaN(V)) return { base, out, ok: false };
    const prior = evaluate(c, 'prior');
    walk(c).forEach(({ n }) => {
      if (n.id === c.root || n.status === 'ruledout') return;
      if (n.status === 'confirmed' && unitOf(c, n) === 'p') { out[n.id] = 1; return; }
      const u = unitOf(c, n);
      if (u === 'f') { const v0 = evaluate(c, 'evidence', { [n.id]: 0 }).top.v; out[n.id] = isNaN(v0) ? NaN : (V - v0) / V; }
      else {
        const p = isGate(n) ? evaluate(c, 'evidence').val(n.id).v : rawValue(c, n);
        const pv = n.status === 'confirmed' ? 1 : (isGate(n) ? p : prior.val(n.id).v);
        const vt = evaluate(c, 'evidence', { [n.id]: 1 }).top.v;
        out[n.id] = (isNaN(pv) || isNaN(vt)) ? NaN : Math.min(1, pv * vt / V);
      }
    });
    return { base, out, ok: true };
  }

  /* ---------- traversal ---------- */
  function walk(c, opts) {
    const out = [], seen = {};
    const go = (id, depth, parent) => {
      const n = c.nodes[id]; if (!n || seen[id]) return; seen[id] = 1;
      out.push({ n, depth, parent });
      if (isGate(n) && !(opts && opts.visibleOnly && n.collapsed)) (n.children || []).forEach(k => go(k, depth + 1, id));
    };
    go(c.root, 0, null);
    return out;
  }
  function parentOf(c, id) { for (const k in c.nodes) { const n = c.nodes[k]; if ((n.children || []).indexOf(id) >= 0) return n; } return null; }
  function descendants(c, id) { const out = []; const go = i => { const n = c.nodes[i]; if (!n) return; (n.children || []).forEach(k => { out.push(k); go(k); }); }; go(id); return out; }

  /* ---------- minimal cut sets ---------- */
  function cutSets(c, opts) {
    opts = opts || {}; const LIMIT = opts.limit || 4000; let truncated = false;
    const excl = n => opts.excludeRuledOut && n.status === 'ruledout';
    const cs = id => {
      const n = c.nodes[id]; if (!n || excl(n)) return [];
      if (!isGate(n)) return [[id]];
      const ks = kids(c, n).map(k => cs(k.id));
      if (n.gate === 'OR') return [].concat(...ks);
      const product = lists => lists.reduce((acc, L) => { const o = []; acc.forEach(a => L.forEach(b => { if (o.length < LIMIT) o.push(a.concat(b)); else truncated = true; })); return o; }, [[]]);
      if (n.gate === 'VOTE') {
        const k = Math.max(1, Math.min(ks.length, +n.k || 2)), out = [];
        const comb = (start, chosen) => { if (chosen.length === k) { out.push(...product(chosen)); return; } for (let i = start; i < ks.length; i++) comb(i + 1, chosen.concat([ks[i]])); };
        comb(0, []); return out;
      }
      return product(ks);
    };
    let sets = cs(c.root).map(s => Array.from(new Set(s)).sort());
    sets.sort((a, b) => a.length - b.length);
    const min = [];
    sets.forEach(s => { if (!min.some(m => m.every(x => s.indexOf(x) >= 0))) min.push(s); });
    return { sets: min, truncated };
  }
  function rankCutSets(c) {
    const { sets, truncated } = cutSets(c, { excludeRuledOut: true });
    const pri = evaluate(c, 'prior'), evd = evaluate(c, 'evidence');
    const prod = (s, E) => { let v = 1, nf = 0; s.forEach(id => { const r = E.val(id); if (r.u === 'f') nf++; v *= r.v; }); return { v: nf > 1 ? NaN : v, u: nf ? 'f' : 'p' }; };
    const rows = sets.map(s => {
      const st = s.map(id => c.nodes[id].status);
      const status = st.every(x => x === 'confirmed') ? 'confirmed' : st.every(x => x === 'confirmed' || x === 'likely') ? 'likely' : 'open';
      return { ids: s, status, prior: prod(s, pri), evid: prod(s, evd) };
    });
    const tot = rows.reduce((a, r) => a + (isNaN(r.evid.v) ? 0 : r.evid.v), 0);
    rows.forEach(r => { r.share = tot > 0 && !isNaN(r.evid.v) ? r.evid.v / tot : NaN; });
    const order = { confirmed: 0, likely: 1, open: 2 };
    rows.sort((a, b) => order[a.status] - order[b.status] || (isNaN(b.evid.v) ? -1 : isNaN(a.evid.v) ? 1 : b.evid.v - a.evid.v) || a.ids.length - b.ids.length);
    const all = cutSets(c, {}).sets.length;
    return { rows, truncated, eliminated: all - sets.length };
  }

  /* ---------- checks ---------- */
  function check(c) {
    const I = [], add = (sev, code, id, msg) => I.push({ sev, code, ids: id ? [].concat(id) : [], msg });
    const nm = n => (n.code ? n.code + ' ' : '') + '“' + ((n.label || '').trim() || 'no description') + '”';
    const root = c.nodes[c.root];
    if (!root) { add('error', 'T0', null, 'The tree has no top event.'); return I; }
    if (!isGate(root) || !(root.children || []).length) add('error', 'T1', root.id, 'Develop the top event: add the causes (gates and events) that could have produced it.');
    if (root.status !== 'confirmed') add('tip', 'T2', root.id, 'The top event is the incident that happened. Mark it Confirmed and record the evidence.');
    const E = evaluate(c, 'evidence');
    E.errs.forEach(e => {
      const n = c.nodes[e.id];

<script>/* RCA Fault Tree — user guide (shown on the User guide tab). */
var RCAGUIDE = `
<span class="eyebrow">User guide</span><h1>RCA Fault Tree</h1>
<p>A cause-and-effect fault tree for <b>root cause analysis</b>. The top event is the incident that happened. Below it you set out every way it could have happened, test each branch against the evidence, and keep the branches that survive. Probabilities are optional. When you enter them, they rank the hypotheses that are still open, so you know what to test first.</p>
<p>It is not a risk-assessment tool: it does not ask whether a design is good enough. For quantitative design studies (PFDavg, SIL, test intervals) use the Fault Tree and PFD Calculator in the Process Safety Analysis Toolkit.</p>

<h2>1. Quick start</h2>
<ul>
<li><b>File ▸ New fault tree</b>, then describe the incident on the <b>Incident</b> tab.</li>
<li>On the <b>Fault tree</b> tab, select the top event and add its causes with <b>+ Gate</b> (an intermediate event that you develop further) or <b>+ Basic event</b> (a cause you do not break down).</li>
<li>Choose the gate logic: <b>OR</b> if any one input is enough, <b>AND</b> if all inputs were needed together.</li>
<li>For each element set the <b>hypothesis status</b> and record the <b>evidence</b>. Plan a <b>test</b> for those still open.</li>
<li>Optionally give events a probability, from the data library or as a manual value.</li>
<li>Classify the confirmed causes (root cause, causal factor, contributing factor), add <b>Actions</b>, and produce the <b>Report</b>.</li>
<li><b>File ▸ Save as</b> links a file in the <code>My cases</code> folder on the stick. After that, every change is written to the file.</li>
</ul>

<h2>2. Symbols</h2>
<ul>
<li><b>Box</b>: the description of every event. The coloured stripe on the left is the hypothesis status.</li>
<li><b>OR gate</b> (curved shield): the output occurs if any input occurs.</li>
<li><b>AND gate</b> (flat-bottomed dome): the output occurs only if all inputs occur together.</li>
<li><b>INHIBIT gate</b> (hexagon): the output occurs if the input occurs while an enabling condition is present. Show the condition as a condition (house) event.</li>
<li><b>VOTE gate</b> (shield with k/n): the output occurs if at least k of the n inputs occur.</li>
<li><b>Basic event</b> (circle): a cause that is not developed further.</li>
<li><b>Undeveloped event</b> (diamond): a cause not developed, for lack of information or because it is outside the scope.</li>
<li><b>Condition / house event</b> (house): a condition that was or was not present (for example, a single operator on shift). Its value is usually 1 (present) or 0 (absent).</li>
<li><b>Triangle</b>: a collapsed branch. Select the gate and choose Expand branch.</li>
</ul>

<h2>3. Hypothesis status</h2>
<ul>
<li><b>Confirmed</b>: the evidence shows it happened.</li>
<li><b>Likely</b>: the evidence points to it but is not conclusive yet.</li>
<li><b>Unverified</b>: still to be tested.</li>
<li><b>Ruled out</b>: the evidence shows it did not happen. The branch is drawn dashed and struck through, and it drops out of the causal combinations.</li>
</ul>
<p>The consistency check (Results tab) flags contradictions. Examples: a confirmed gate whose causes are all ruled out (the real cause is missing from the tree), a confirmed AND gate with a ruled-out input, or a confirmed cause under a ruled-out branch.</p>

<h2>4. Probabilities and the data library</h2>
<p>Each event chooses its own source, so one tree can mix failure types:</p>
<ul>
<li><b>Safeguard / IPL PFD</b>: typical probability of failure on demand of protection layers (CCPS LOPA, IEC 61511 SIL bands).</li>
<li><b>Human error probability</b>: THERP and HEART generic task values.</li>
<li><b>Equipment failure on demand</b>: generic per-demand values for pumps, valves, switches, transmitters, lifting gear and so on.</li>
<li><b>Initiating event frequency</b>: typical frequencies per year (CCPS LOPA).</li>
<li><b>Manual value</b>: your own probability or frequency.</li>
<li><b>Site data</b>: custom items you add on the Data library tab (for example from CMMS history).</li>
</ul>
<p>Picking a library item fills in its value. You can then <b>edit the value for that event</b> (for example, scale a switch PFD up because its proof test was 18 months overdue). The panel then shows the event as edited, and you should record why in the value note. <b>Use library value</b> puts it back. On the Data library tab you can also override an item for the whole case; events that use it and were not edited individually follow the new value.</p>
<p>Units: probability (0 to 1) or frequency (per year). An OR gate must combine inputs of the same unit. An AND gate may have at most one frequency input; the result is then a frequency (frequency × probabilities).</p>

<h2>5. How the numbers are calculated</h2>
<ul>
<li>OR: 1 − Π(1 − p<sub>i</sub>) for probabilities; Σ f<sub>i</sub> for frequencies.</li>
<li>AND / INHIBIT: Π p<sub>i</sub>, or f × Π p<sub>i</sub> with one frequency input.</li>
<li>VOTE k of n: probability that at least k of the n inputs occur.</li>
<li>The tree is evaluated exactly. Each element appears once, so the branches are independent.</li>
<li><b>Before evidence</b>: every hypothesis at its screening value, giving how likely the incident path was before the investigation.</li>
<li><b>Given evidence</b>: ruled-out causes count as 0 and confirmed probability causes as 1.</li>
<li><b>Given the incident</b>, for each open hypothesis X: P(X contributed | top event and evidence) = p(X) × P(top | X occurred) / P(top). For a frequency (initiating) event it is that event's share of the top frequency. This is the ranking on the Results tab and the percentage shown on the tree.</li>
<li><b>Credible causal combinations</b> are the minimal cut sets of the tree with ruled-out causes removed. Each is a set of causes that together are enough to produce the top event. They are sorted by status (all confirmed first) and then by likelihood.</li>
</ul>
<p>If an open branch has an event without a value, the percentages that depend on it show “needs values”. The qualitative analysis still works.</p>

<h2>6. Saving on the USB stick</h2>
<ul>
<li>The tool keeps your work in the browser of the computer you are using. That copy does not travel with the stick.</li>
<li><b>File ▸ Save as</b> (Chrome or Edge) links a file in <code>My cases</code>. Every later change is written to it, and the header shows “Saved to …”.</li>
<li>On another computer, open the tool from the stick and use <b>File ▸ Open file</b>. If the header shows <b>Reconnect file</b>, click it: the browser asks for permission again after a restart.</li>
<li>Firefox and Safari cannot link files. Use <b>Download backup copy</b> and open it again later.</li>
<li>The START HERE dashboard lists the cases in <code>My cases</code> and those kept only in this browser.</li>
</ul>

<h2>7. Limitations</h2>
<ul>
<li>Library values are generic, order-of-magnitude screening values. Use them to rank hypotheses, not as design data. Replace them with site data where you have it.</li>
<li>Elements cannot be shared between branches (each appears once). If the same cause acts in two places, model the dependency explicitly, for example with a common condition event.</li>
<li>Probability never confirms a cause. A low percentage is not evidence that something did not happen; only evidence rules a cause out.</li>
</ul>
`;
if (typeof module !== 'undefined') module.exports = RCAGUIDE;
</script>

function svgToPng(svg) {
  return new Promise((res, rej) => {
    const m = svg.match(/width="(\d+)" height="(\d+)"/), w = +m[1], h = +m[2], k = Math.min(2, 9000 / w, 9000 / h), img = new Image();
    img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k); const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? b.arrayBuffer().then(ab => res({ blob: b, bytes: new Uint8Array(ab), w: cv.width, h: cv.height })) : rej(new Error('png')), 'image/png'); } catch (e) { rej(e); } };
    img.onerror = () => rej(new Error('svg')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

  if (k === 'value') { const num = v.trim() === '' ? null : +v.replace(',', '.'); n.prob.value = (num == null || isNaN(num)) ? (v.trim() === '' ? null : n.prob.value) : num; const it = E.libItem(S.c, n.prob.item); n.prob.edited = !!it && n.prob.value != null && +n.prob.value !== it.value; return live ? 'tree' : 'full'; }
  if (k === 'unit') { n.prob.unit = v; return 'full'; }
  if (k === 'pnote') { n.prob.note = v; return 'none'; }
  if (k === 'k') { n.k = Math.max(1, parseInt(v, 10) || 1); return 'full'; }

}
document.addEventListener('input', ev => {

  if (t.dataset.af && t.tagName !== 'SELECT') { S.c.actions[+tr.dataset.ai][t.dataset.af] = t.value; changed(); return; }

});
document.addEventListener('change', ev => {

  if (t.dataset.meta) { S.c.meta[t.dataset.meta] = t.value; changed(); return; }
  const tr = t.closest('tr');
  if (t.dataset.hf) { node(tr.dataset.nid)[t.dataset.hf] = t.value; changed(); if (t.dataset.hf === 'status') render(); return; }
  if (t.dataset.af) { S.c.actions[+tr.dataset.ai][t.dataset.af] = t.value; changed(); if (t.dataset.af === 'target') render(); return; }
  if (t.dataset.lib) { setOverride(t.dataset.lib, t.value.trim() === '' ? null : t.value.replace(',', '.')); render(); return; }
  if (t.dataset.cl) { const it = S.c.customLib[+tr.dataset.ci]; if (t.dataset.cl === 'unit') { it.unit = t.value; changed(); } return; }
});
document.addEventListener('keydown', ev => {

});
window.addEventListener('pagehide', () => { if (S.c) LS.set('rcaft.case.' + S.c.id, S.c); });
window.TBRCA = { S, E, X, load, newCase, exampleCase, addChild, removeBranch, issues: () => issues(), post: () => post(), render, setOverride, fileText };

(async function boot() {
