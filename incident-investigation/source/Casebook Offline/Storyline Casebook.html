      PH('Where the line was held or tied on the bank','Close to the bank','Mid-range','Anchor point, ground conditions, footing for the attendant'),
      PH('Distance from the boat\'s last position to the nearest bank (with a person or pole for scale)','From the bank','Mid-range','The swim distance the workers misjudged'),
      PH('The boat as recovered, all four sides','Around the boat on land','Overview','General condition'),
      PH('Boat details: capacity plate, hull damage or leaks, rope attachment, oars','Close up','Detail with scale','Fitness for use'),
      PH('Rope or line used, laid out full length with a tape','On a clean surface','Detail with scale','Length, type and condition'),
      PH('Where the boat was stored before the event','Behind the pump station','Mid-range','How accessible and uncontrolled it was'),
      PH('Clothing, boots and PPE of the workers','On a neutral background','Detail with scale','Type and weight of clothing; any buoyancy'),
      PH('Location of the nearest life-saving equipment (or its absence) at the dam','At the dam access points','Mid-range','Shows no ring buoy or throw line at the dam'),
      PH('Signs and access control at the dam (warnings, fences, gates)','At each access point','Mid-range','Whether access to the water was controlled'),
      PH('Weather station or wind indicator, and the sky and water surface conditions on the day after','At the weather station; across the dam','Mid-range','Supports the wind and current account')
    ],
    tests: [
      TS('There was no early warning of the inflow from the upper catchment','Assumption','Weather service and upstream gauge data; control room log; any flood warning sent','event:d1'),
      TS('The control room noticed the rising level only when the pumps were already flooding','Assumption','SCADA level and alarm log; control room interview; occurrence book (EV-001)','event:d3'),
      TS('The request to the contractor was a one-off decision in the emergency','Conclusion','Engineering manager and contractor owner interviews; phone records','event:d4'),
      TS('Contractors are routinely asked to do work outside their scope because the contractor process is slow','Assumption','Records of out-of-scope jobs; contractor management procedure and approval times; interviews with other contractors'),
      TS('The boat had not been used or inspected for years','Assumption','Stores and asset records; boat condition; interviews'),
      TS('The current and wind pushed the boat faster than the shore attendant could hold it','Assumption','Wind data; spillway flow; rope condition and anchor; Worker C interview; phone photos (EV-003)','event:d6'),
      TS('The workers left the boat because they feared going over the spillway','Assumption','Worker B and Worker C accounts; position of the boat when found; any video','event:d7'),
      TS('The swim distance to the bank was 15 to 20 m','Open question','Survey of the boat position and the bank'),
      TS('Their clothing and boots hampered swimming','Assumption','Clothing and boots recovered; post-mortem; expert opinion'),
      TS('Worker A could not swim; none of them had water-safety, rescue or first-aid training','Assumption','Training records; Worker B, contractor and family interviews','event:d9'),
      TS('How Worker B reached the bank (swam, held on to the boat, was pulled out?)','Open question','Worker B and Worker C interviews; recovery team','event:d8'),
      TS('No risk assessment, permit or job plan was made for the task','Conclusion','Permit office and SHE records; interviews'),
      TS('No life jackets, ring buoys or throw lines were available at the dam','Conclusion','Site inspection; stores records; emergency team interview')
    ]
  });
  plan.items.forEach((it,i)=>{ it.id = 'pi'+(i+1); });
  plan.photos.forEach((it,i)=>{ it.id = 'pp'+(i+1); });
  plan.tests.forEach((it,i)=>{ it.id = 'pt'+(i+1); });
  c.evidencePlan = [Object.assign({id:'main'}, plan)];
  return c;
}

function showToast(msg, undoFn){
  let el=document.getElementById('toast'); if(el) el.remove();
  el=document.createElement('div'); el.id='toast'; el.className='toast';
  const span=document.createElement('span'); span.textContent=msg; el.appendChild(span);
  if(undoFn){
    const btn=document.createElement('button'); btn.type='button'; btn.className='toast-undo'; btn.textContent='Undo';
    btn.onclick=async()=>{ el.remove(); await undoFn(); };
    el.appendChild(btn);
  }
  document.body.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, undoFn?7000:3200);
}

function describeDbError(e){ if(!e) return 'unknown error'; return (e.code||'error')+(e.message?(' \u2014 '+e.message):''); }

(async function init(){
  window.claude.use('sample').then(s=>{ state.sampleHandle = typeof s==='function' ? s : null; if(state.sampleHandle && state.stage==='evidence' && state.plan.view==='plan' && (state.screen==='case')) safeRerender(); }).catch(()=>{});

  try{ state.downloadsHandle = await window.claude.use('downloads'); }catch(e){ state.downloadsHandle=null; }
  if(state.dbHandle){
    state.connStatus = 'live';
  } else {
    state.connStatus = 'off';
    if(!HAS_CLAUDE_RUNTIME){
      state.connError = {code:'no_runtime', message:'this page was opened outside claude.ai (for example as a local file or from a plain web server), so there is no shared case store here. Open it from its claude.ai link instead.'};
    } else {
      let st = 'unknown';
      try{ const perms = await window.claude.use('permissions'); if(perms) st = await perms.state('db'); }catch(e){}
      state.dbPermState = st;
      const why = st==='denied' ? 'access to the shared case store was declined for this page load'
                : st==='prompt' ? 'access to the shared case store has not been granted yet'
                : st==='unavailable' ? 'the shared case store is not available in this view (the link may be a copy without the data capability, or sharing does not allow it)'
                : 'the shared-data capability did not load (state: '+st+')';
      state.connError = {code:'not_granted', message:why};

})();
async function requestDbAccess(){
  try{
    const perms = await window.claude.use('permissions');
    if(!perms){ toast('Permissions are not available in this view.'); return; }
    const res = await perms.request(['db']);
    if(res && res.db==='granted'){ toast('Access granted \u2014 reloading\u2026'); setTimeout(()=>location.reload(), 600); }
    else if(res && res.db==='denied'){ toast('Access was declined. Reload the page to be asked again.'); }
    else { toast('The shared case store is not available here ('+(res&&res.db?res.db:'unknown')+').'); }
  }catch(e){ toast('Could not request access: '+describeDbError(e)); }
}
function connErrorHTML(){
  if(!state.connError) return '';
  const canAsk = state.connError.code==='not_granted' && ['prompt','denied','unknown'].includes(state.dbPermState);
  return `<div class="mono" style="margin-top:6px;font-size:11.5px;">Error: ${esc(describeDbError(state.connError))}</div>`+
    (canAsk ? `<div style="margin-top:8px;"><button class="btn small primary" type="button" onclick="requestDbAccess()">Grant access to shared data</button> <button class="btn small ghost" type="button" onclick="location.reload()">Reload page</button></div>` : '');
}

/* ---------- case package import ------------------------------------------
   Creates a new case from a JSON case package: { format:'storyline-casebook-
   case', case:{header fields}, evidence:[], events:[], conditions:[], ... }.
   Records keep their ids as document ids so event/condition/ICAM/root-cause
   links survive; evidence keeps its EV-tag in the id field like Stage 2. */
const CASE_HEADER_FIELDS = ['caseTitle','facility','location','incidentType','dateOccurred','timeOccurred','reportedBy','reportedAt','personsInvolved','initialDescription','refinedDescription','actualSeverity','potentialSeverity','immediateActionsTaken','sceneSecured','accessLogStarted','notificationsRequired','status','rootCause'];
async function importCasePackage(file, btn){
  let pkg; try{ pkg = JSON.parse(await file.text()); }catch(e){ toast('That file is not valid JSON.'); return; }
  return importCasePackageData(pkg, btn);
}
async function importCasePackageData(pkg, btn){
  if(!state.dbHandle){ toast('The workspace is not ready yet — reload the page and try again.'); return; }
  if(!pkg || pkg.format!=='storyline-casebook-case' || !pkg.case || typeof pkg.case!=='object'){ toast('That file is not a Storyline Casebook case package.'); return; }
  const label = btn ? btn.innerHTML : ''; if(btn){ btn.disabled = true; btn.textContent = 'Importing…'; }
  let caseId = null;
  try{
    const header = newCaseDefaults();
    CASE_HEADER_FIELDS.forEach(k=>{ if(pkg.case[k]!==undefined) header[k] = pkg.case[k]; });
    header.actualSeverity = Math.min(5, Math.max(1, parseInt(header.actualSeverity,10)||1));
    header.potentialSeverity = Math.min(5, Math.max(1, parseInt(header.potentialSeverity,10)||1));
    if(!CASE_STATUSES.some(s=>s.v===header.status)) header.status = 'open';
    if(pkg.source) header.importedFrom = String(pkg.source).slice(0,200);
    header.createdAt = nowISO(); header.updatedAt = nowISO();
    const ref = await state.dbHandle.collection('cases').add(header); caseId = ref.id;
    const list = n => Array.isArray(pkg[n]) ? pkg[n].filter(r=>r && typeof r==='object') : [];
    const strip = r => { const o = Object.assign({}, r); delete o._docId; delete o.id; return o; };
    const docId = r => (typeof r.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(r.id)) ? r.id : null;
    const writes = [];
    list('evidence').forEach(e=>{ const o = strip(e); if(e.id) o.id = String(e.id); writes.push(()=>caseCol(caseId,'evidence').add(o)); });
    list('events').forEach((e,i)=>{ const o = strip(e); o.lane = o.lane||0; o.order = typeof o.order==='number' ? o.order : i; o.mergeTo = o.mergeTo||null; o.evidenceIds = o.evidenceIds||[]; const id = docId(e); writes.push(()=> id ? caseCol(caseId,'events').doc(id).set(o) : caseCol(caseId,'events').add(o)); });
    ['conditions','icamFactors','contributingFactors','rootCauses','keyLearnings','correctiveActions'].forEach(n=> list(n).forEach(r=>{ const o = strip(r); const id = docId(r); writes.push(()=> id ? caseCol(caseId,n).doc(id).set(o) : caseCol(caseId,n).add(o)); }));
    ['investigationTeam','involvedPersons'].forEach(n=> list(n).forEach(r=> writes.push(()=>caseCol(caseId,n).add(strip(r)))));
    list('photos').forEach((p,i)=>{ if(typeof p.dataUrl!=='string' || !/^data:image\//.test(p.dataUrl) || p.dataUrl.length>240000) return; const o = strip(p); o.order = typeof o.order==='number' ? o.order : i+1; o.uploadedAt = o.uploadedAt || nowISO(); writes.push(()=>caseCol(caseId,'photos').add(o)); });
    list('evidenceFiles').forEach(f=>{ if(typeof f.dataUrl==='string' && f.dataUrl.length<=240000) writes.push(()=>caseCol(caseId,'evidenceFiles').add(strip(f))); });
    if(pkg.evidencePlan && typeof pkg.evidencePlan==='object' && !Array.isArray(pkg.evidencePlan)){ const pl = CBP.normalise(pkg.evidencePlan); writes.push(()=>caseCol(caseId,'evidencePlan').doc('main').set(pl)); }
    for(let i=0;i<writes.length;i+=8){ await Promise.all(writes.slice(i,i+8).map(w=>w())); if(btn) btn.textContent = `Importing… ${Math.min(writes.length,i+8)}/${writes.length}`; }
    touchCase(caseId);
    toast('Case imported: '+(header.caseTitle||'Untitled Investigation'));
    state.cameFrom='caselist'; openCase(caseId);
  }catch(e){
    toast('Import stopped part-way ('+describeDbError(e)+').'+(caseId?' The partly imported case is in the list; delete it in Admin Mode and try again.':''));
  }finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = label; } }
}

/* ---------- generic delete-with-undo (evidence, events, conditions, ICAM
   factors, contributing factors, root causes, key learnings, actions) ----- */
async function deleteItemWithUndo(caseId, collName, docId, list, label){
  const item = (list||[]).find(x=>x.id===docId);
  const data = item ? Object.assign({}, item) : null;
  if(data) delete data.id;
  await caseCol(caseId, collName).doc(docId).delete().catch(()=>{});
  touchCase(caseId);
  if(data){
    toastUndo(`${label} removed.`, async ()=>{
      await caseCol(caseId, collName).doc(docId).set(data).catch(()=>{});
      touchCase(caseId);
    });
  } else {
    toast(`${label} removed.`);
  }
}

/* ---------- whole-case delete (admin), with undo ------------------------- */
function collSnapshotOnce(ref){
  return new Promise(resolve=>{
    let unsubFn=null, resolved=false;
    unsubFn = ref.onSnapshot(s=>{
      if(resolved) return; resolved=true;
      resolve(s.docs.map(d=>({id:d.id, data:d.data()})));
      Promise.resolve().then(()=>{ if(unsubFn) unsubFn(); });
    });
  });
}
function docSnapshotOnce(ref){
  return new Promise(resolve=>{
    let unsubFn=null, resolved=false;
    unsubFn = ref.onSnapshot(d=>{
      if(resolved) return; resolved=true;
      resolve(d.exists ? d.data() : null);
      Promise.resolve().then(()=>{ if(unsubFn) unsubFn(); });
    });
  });
}
const CASE_SUBCOLLECTIONS = ['evidence','events','conditions','icamFactors','contributingFactors','rootCauses','keyLearnings','correctiveActions','photos','investigationTeam','involvedPersons','evidenceFiles','diagrams','evidencePlan'];
async function fetchCaseFull(id){
  const [caseData, ...subResults] = await Promise.all([
    docSnapshotOnce(caseDoc(id)),
    ...CASE_SUBCOLLECTIONS.map(name=>collSnapshotOnce(caseCol(id,name)))
  ]);
  const subData = {}; CASE_SUBCOLLECTIONS.forEach((name,i)=>{ subData[name]=subResults[i]; });
  return { caseData, subData };
}
async function deleteCase(id){
  if(!state.dbHandle) return;
  try{
    const { caseData, subData } = await fetchCaseFull(id);
    if(!caseData){ toast('Case already removed.'); state.confirmDeleteCase=null; render(); return; }
    await Promise.all(CASE_SUBCOLLECTIONS.flatMap(name => subData[name].map(item => caseCol(id,name).doc(item.id).delete().catch(()=>{}))));
    await caseDoc(id).delete().catch(()=>{});
    if(state.openCase && state.openCase.id===id) closeCase();
    state.confirmDeleteCase = null;
    render();
    toastUndo(`Case "${caseData.caseTitle||'Untitled Investigation'}" deleted.`, async ()=>{
      await caseDoc(id).set(caseData).catch(()=>{});
      await Promise.all(CASE_SUBCOLLECTIONS.flatMap(name => subData[name].map(item => caseCol(id,name).doc(item.id).set(item.data).catch(()=>{}))));
      toast('Case restored.');
    });
  }catch(e){
    toast('Could not delete this case — please try again.');
    state.confirmDeleteCase = null; render();
  }
}

function dateBounds(){
  const days = state.cases.map(c=>c.dateOccurred).filter(Boolean).map(d=>Math.floor(new Date(d+'T00:00:00Z').getTime()/86400000)).filter(n=>!isNaN(n));
  if(!days.length) return null;
  return { min:Math.min(...days), max:Math.max(...days) };
}
function distinctFacilities(){ return Array.from(new Set(state.cases.map(c=>c.facility).filter(Boolean))).sort(); }
function passesFilters(c){
  const f = state.filters;
  const bounds = dateBounds();
  if(bounds && (f.dateFrom!=null || f.dateTo!=null) && c.dateOccurred){
    const day = Math.floor(new Date(c.dateOccurred+'T00:00:00Z').getTime()/86400000);
    if(f.dateFrom!=null && day < f.dateFrom) return false;
    if(f.dateTo!=null && day > f.dateTo) return false;
  }
  const sevLevel = Math.max(c.actualSeverity||1, c.potentialSeverity||1);
  if(sevLevel < f.sevMin || sevLevel > f.sevMax) return false;
  if(f.facility && c.facility !== f.facility) return false;
  if(f.status && c.status !== f.status) return false;
  return true;
}
function filteredCases(){ return state.cases.filter(passesFilters); }
function filtersActiveCount(){
  const f = state.filters;
  return [f.dateFrom!=null || f.dateTo!=null, f.sevMin>1 || f.sevMax<5, !!f.facility, !!f.status].filter(Boolean).length;
}
function onFiltersChanged(){
  if(state.screen==='caselist') render();
  else if(state.screen==='dashboard') loadDashboardData();
}
/* Two overlapping <input type=range> made to behave like one dual-handle
   slider: JS keeps the lower handle from passing the upper one, paints the
   highlighted span between them, and reports the live (lo,hi) pair. */
function wireDualRange(minId, maxId, fillId, minLabelId, maxLabelId, onChange, fmt){
  const minEl=document.getElementById(minId), maxEl=document.getElementById(maxId), fillEl=document.getElementById(fillId);
  if(!minEl||!maxEl) return;
  const minLabel=document.getElementById(minLabelId), maxLabel=document.getElementById(maxLabelId);
  const update = (fire)=>{
    let lo=parseFloat(minEl.value), hi=parseFloat(maxEl.value);
    if(lo>hi){ lo=hi; minEl.value=String(lo); }
    const lower=parseFloat(minEl.min), upper=parseFloat(minEl.max), range=(upper-lower)||1;
    const loPct=100*(lo-lower)/range, hiPct=100*(hi-lower)/range;
    if(fillEl){ fillEl.style.left=loPct+'%'; fillEl.style.width=Math.max(0,hiPct-loPct)+'%'; }
    if(minLabel) minLabel.textContent = fmt(lo);
    if(maxLabel) maxLabel.textContent = fmt(hi);
    if(fire) onChange(lo,hi);
  };
  minEl.oninput = ()=> update(true);
  maxEl.oninput = ()=> update(true);
  update(false);
}

function wireFilterBar(){
  const bounds = dateBounds();
  if(bounds){
    wireDualRange('filt-date-min','filt-date-max','filt-date-fill','filt-date-min-label','filt-date-max-label',
      (lo,hi)=>{ state.filters.dateFrom=Math.round(lo); state.filters.dateTo=Math.round(hi); debounce('filters', onFiltersChanged, 250); },
      d => new Date(d*86400000).toISOString().slice(0,10));
  }
  wireDualRange('filt-sev-min','filt-sev-max','filt-sev-fill','filt-sev-min-label','filt-sev-max-label',
    (lo,hi)=>{ state.filters.sevMin=Math.round(lo); state.filters.sevMax=Math.round(hi); debounce('filters', onFiltersChanged, 250); },
    v => String(Math.round(v)));
  const facSel = document.getElementById('filt-facility'); if(facSel) facSel.onchange = ()=>{ state.filters.facility = facSel.value; onFiltersChanged(); };
  const statSel = document.getElementById('filt-status'); if(statSel) statSel.onchange = ()=>{ state.filters.status = statSel.value; onFiltersChanged(); };
  const reset = document.getElementById('filt-reset'); if(reset) reset.onclick = ()=>{ state.filters = defaultFilters(); onFiltersChanged(); render(); };
}

const DASH_SUBCOLLECTIONS = ['evidence','events','icamFactors','contributingFactors','rootCauses','correctiveActions'];

async function loadDashboardData(){
  if(!state.dbHandle){ state.dashboard=null; if(state.screen==='dashboard') render(); return; }
  state.dashboardLoading = true;
  if(state.screen==='dashboard') render();
  const cases = filteredCases();
  try{
    const results = await Promise.all(cases.map(async c=>{
      const subs={};
      await Promise.all(DASH_SUBCOLLECTIONS.map(async name=>{ subs[name] = await collSnapshotOnce(caseCol(c.id, name)); }));
      return { case:c, subs };
    }));
    state.dashboard = computeDashboardAggregates(results);
  }catch(e){ state.dashboard = null; }
  state.dashboardLoading = false;
  if(state.screen==='dashboard') render();
}

function computeDashboardAggregates(results){
  const d = {
    totalCases: results.length,
    byStatus:{open:0,investigating:0,review:0,closed:0},
    byIncidentType:{}, byFacility:{}, byYear:{},
    sevMatrix: Array.from({length:5},()=>Array(5).fill(0)), // [potential-1][actual-1]
    levelCounts:{1:0,2:0,3:0,4:0},
    icamCategoryCounts:{defences:0,actions:0,conditions:0,organizational:0},
    icamCodeCounts:{},
    totalEvidence:0, totalEvents:0, totalRootCauses:0, totalContributingFactors:0,
    actionsTotal:0,
    actionsByTimeframe:{immediate:0,intermediate:0,longterm:0},
    actionsByHoc:{elimination:0,substitution:0,engineering:0,administrative:0,ppe:0},
    actionsWeak:0, actionsStrong:0,
    fatalityCount:0, highPotentialCount:0,
    cases: []
  };
  results.forEach(({case:c, subs})=>{
    const status = (d.byStatus[c.status]!=null) ? c.status : 'open';
    d.byStatus[status] = (d.byStatus[status]||0)+1;
    const it = c.incidentType || 'Unspecified'; d.byIncidentType[it]=(d.byIncidentType[it]||0)+1;
    const fac = c.facility || 'Unspecified'; d.byFacility[fac]=(d.byFacility[fac]||0)+1;
    const yr = (c.dateOccurred||'').slice(0,4) || 'Unknown'; d.byYear[yr]=(d.byYear[yr]||0)+1;
    const a = Math.min(5,Math.max(1,c.actualSeverity||1)), p = Math.min(5,Math.max(1,c.potentialSeverity||1));
    d.sevMatrix[p-1][a-1]++;
    d.levelCounts[investigationLevel(c)]++;
    if(a===5) d.fatalityCount++;
    if(p===5 && a<5) d.highPotentialCount++;
    d.totalEvidence += subs.evidence.length;
    d.totalEvents += subs.events.length;
    d.totalRootCauses += subs.rootCauses.length;
    d.totalContributingFactors += subs.contributingFactors.length;
    subs.icamFactors.forEach(({data:f})=>{
      if(d.icamCategoryCounts[f.category]!=null) d.icamCategoryCounts[f.category]++;
      if(f.code){
        if(!d.icamCodeCounts[f.code]) d.icamCodeCounts[f.code] = { count:0, cases:new Set(), label:f.codeLabel||icamCodeLabel(f.category,f.code)||f.code, category:f.category };
        d.icamCodeCounts[f.code].count++;
        d.icamCodeCounts[f.code].cases.add(c.id);
      }
    });
    subs.correctiveActions.forEach(({data:act})=>{
      d.actionsTotal++;
      if(d.actionsByTimeframe[act.timeframe]!=null) d.actionsByTimeframe[act.timeframe]++;
      if(d.actionsByHoc[act.hocLevel]!=null) d.actionsByHoc[act.hocLevel]++;
      if(assessStrength(act.action)==='weak') d.actionsWeak++; else d.actionsStrong++;
    });
    d.cases.push(c);
  });
  d.cases.sort((x,y)=> new Date(y.updatedAt||0) - new Date(x.updatedAt||0));
  return d;
}

function riskMatrixHTML(matrix){
  const max = Math.max(1, ...matrix.flat());
  let html = `<div class="risk-matrix"><div></div>`;
  for(let a=1;a<=5;a++) html += `<div class="rm-axis">${a}</div>`;
  for(let p=5;p>=1;p--){
    html += `<div class="rm-axis">${p}</div>`;
    for(let a=1;a<=5;a++){
      const n = matrix[p-1][a-1];
      const pct = n ? Math.round(26 + 64*(n/max)) : 0;
      const bg = n ? `color-mix(in srgb, var(--bad) ${pct}%, var(--surface-2))` : 'var(--surface-2)';
      const fg = n && pct>50 ? '#fff' : 'var(--ink-faint)';
      html += `<div class="rm-cell" style="background:${bg};color:${fg};" title="Potential ${p} × Actual ${a}: ${n} case${n===1?'':'s'}">${n||''}</div>`;
    }
  }
  html += `</div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);margin-top:7px;max-width:340px;"><span>↑ Potential severity</span><span>Actual severity →</span></div>`;
  return html;
}

function wireInitial(){

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
function wireEvidenceFiles(){
  const c = activeCase();
  document.querySelectorAll('[data-toggle-files]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.toggleFiles;
      if(state.expandedFiles.has(id)) state.expandedFiles.delete(id); else state.expandedFiles.add(id);
      const row = document.querySelector('[data-files-row="'+CSS.escape(id)+'"]');
      if(row) row.hidden = !state.expandedFiles.has(id);
    };
  });
  document.querySelectorAll('[data-file-download]').forEach(btn=>{
    btn.onclick = async ()=>{
      const f = ro_list(c,'evidenceFiles').find(x=>x.id===btn.dataset.fileDownload);
      if(!f) return;
      if(!state.downloadsHandle){ toast('Downloads unavailable here.'); return; }
      try{
        const blob = await (await fetch(f.dataUrl)).blob();
        await state.downloadsHandle.save({ filename: f.fileName || ('attachment.'+fileExtLabel(f.fileName).toLowerCase()), data: blob });
        toast('File downloaded.');
      }catch(e){ toast('Download was not completed.'); }
    };
  });
  if(isReadOnly()) return;
  document.querySelectorAll('[data-attach-btn]').forEach(btn=>{
    btn.onclick = ()=>{ const input = document.querySelector('[data-attach-input="'+CSS.escape(btn.dataset.attachBtn)+'"]'); if(input) input.click(); };
  });
  document.querySelectorAll('[data-attach-input]').forEach(input=>{
    input.onchange = async ()=>{
      const file = input.files && input.files[0]; input.value='';
      if(!file) return;
      const evidenceId = input.dataset.attachInput;
      if(file.size > MAX_ATTACHMENT_BYTES){ toast(`"${file.name}" is ${fileSizeLabel(file.size)} — attachments are limited to ${fileSizeLabel(MAX_ATTACHMENT_BYTES)}.`); return; }
      try{
        const dataUrl = await readFileAsDataURL(file);
        await caseCol(c.id,'evidenceFiles').add({ evidenceId, fileName:file.name||'file', mimeType:file.type||'', sizeBytes:file.size, dataUrl, uploadedAt: nowISO() });
        state.expandedFiles.add(evidenceId);
        touchCase(c.id);
      }catch(e){ toast('Could not attach that file.'); }
    };
  });
  document.querySelectorAll('[data-file-del]').forEach(btn=>{
    btn.onclick = ()=> deleteItemWithUndo(c.id, 'evidenceFiles', btn.dataset.fileDel, state.evidenceFiles, 'Attachment');
  });
}

  wirePhotos();
  wireEvidenceFiles();
  if(isReadOnly()) return;

  const add = document.getElementById('add-evidence');

    const description = document.getElementById('ev-desc').value.trim();

    try{ const ref = await caseCol(c.id,'evidence').add(item); await ref.update({id:item.evTag}); touchCase(c.id); }catch(e){ toast('Could not save evidence.'); }

/* A read-only reference / training case as a case package, so a practice copy goes through the normal import. */
function samplePackage(c){
  const clone = v => JSON.parse(JSON.stringify(v));
  const pkg = { format:'storyline-casebook-case', version:1, source:'Training case '+(c.ref||'')+' (practice copy)', case:{} };
  CASE_HEADER_FIELDS.forEach(k=>{ if(c[k]!==undefined) pkg.case[k] = clone(c[k]); });
  pkg.case.caseTitle = String(c.caseTitle||'').replace(/\s*\((Training|Reference) Case[^)]*\)\s*$/,'') + ' (practice copy)';
  pkg.case.status = 'investigating';
  ['evidence','events','conditions','icamFactors','contributingFactors','rootCauses','keyLearnings','correctiveActions','investigationTeam','involvedPersons','photos','evidenceFiles'].forEach(n=>{ pkg[n] = clone(c[n]||[]); });
  const plan = (c.evidencePlan||[]).find(x=>x.id==='main'); if(plan) pkg.evidencePlan = CBP.normalise(plan);
  return pkg;
}
async function copyTrainingCase(id, btn){

function planOf(c){ const d = (ro_list(c,'evidencePlan')||[]).find(x=>x.id==='main'); return CBP.normalise(d); }
function planCtx(c){ return { events:ro_list(c,'events'), conditions:ro_list(c,'conditions'), evidence:ro_list(c,'evidence') }; }
function planRefs(c){ return ro_list(c,'events').map(e=>'event:'+e.id).concat(ro_list(c,'conditions').map(x=>'condition:'+x.id)); }
function planNodeName(c, ref){
  const m = /^(event|condition):(.+)$/.exec(ref||''); if(!m) return '';

  const cd = ro_list(c,'conditions').find(x=>x.id===m[2]); return cd ? `Condition — ${cd.text}` : '(condition removed)';

/* part = {items, photos, tests, notes}; mode replace | add */
function planApply(c, part, mode, source){
  const p = planOf(c);
  if(mode==='add'){
    const seen = new Set(p.items.map(x=>x.item.toLowerCase())), seenP = new Set(p.photos.map(x=>x.subject.toLowerCase())), seenT = new Set(p.tests.map(x=>x.statement.toLowerCase()));
    p.items = p.items.concat(part.items.filter(x=>!seen.has(x.item.toLowerCase())));
    p.photos = p.photos.concat(part.photos.filter(x=>!seenP.has(x.subject.toLowerCase())));
    p.tests = p.tests.concat(part.tests.filter(x=>!seenT.has(x.statement.toLowerCase())));
    if(part.notes && p.notes.indexOf(part.notes)<0) p.notes = (p.notes ? p.notes+' ' : '') + part.notes;
  } else { p.items = part.items; p.photos = part.photos; p.tests = part.tests; p.notes = part.notes||''; }
  p.source = source; p.generatedAt = nowISO();
  planPut(c, p);
  state.plan.ask = null; state.plan.pending = null; state.plan.paste = false; state.plan.filter = 'all'; state.plan.err = '';
  state.plan.msg = `${mode==='add'?'Added to the plan':'Plan ready'}: ${part.items.length} evidence items, ${part.photos.length} photos, ${part.tests.length} statements to test.${source==='Claude'?' Written by Claude: check every line against what you know before you use it.':''}`;
  renderStagePanel();
}
function planOffer(c, part, source){
  if(CBP.hasContent(planOf(c))){ state.plan.pending = {part, source}; state.plan.ask = true; state.plan.msg = ''; state.plan.err = ''; renderStagePanel(); return; }
  planApply(c, part, 'replace', source);
}
const PLAN_FAIL = { rate_limited:'Claude is busy or your usage limit has been reached. Try again later.', invalid_json:"Claude's answer could not be read as a plan. Try again.", refused:'Claude declined this request. Rephrase the account and try again.',
  empty_completion:'Claude returned nothing. Shorten the account and try again.', prompt_too_large:'The account is too long for one request. Shorten it and try again.', session_expired:'Your claude.ai session has expired. Sign in again and try again.' };
async function planRunClaude(c){
  const plan = planOf(c);
  if(!planAI()){ planSetMsg('', 'Claude is not available in this view. Use Build starter plan, or Copy prompt for Claude and paste the answer back.'); return; }
  if(plan.narrative.trim().length < 40){ planSetMsg('', 'Write a few sentences about the incident first: what happened, what you think caused it, and what you are not sure about.'); return; }
  const sample = state.sampleHandle, ctl = new AbortController(), caseId = c.id, input = CBP.prompt(c, plan, planCtx(c));
  Object.assign(state.plan, { busy:true, ctl, ask:null, err:'', msg:'Asking Claude… the first words can take up to a minute or two.' });
  renderStagePanel();
  const opts = { signal:ctl.signal, onText:({text})=>{ planSetMsg('Claude is writing the plan… '+(text.length/1000).toFixed(1)+'k characters'); } };
  try{
    const ans = typeof sample.json==='function' ? await sample.json(input, opts) : CBP.parseText((await sample(input, opts)).text);
    state.plan.busy = false; state.plan.ctl = null;
    const cur = activeCase(); if(!cur || cur.id!==caseId) return;
    let part; try{ part = CBP.fromAnswer(ans, planRefs(cur)); }catch(e){ state.plan.msg=''; state.plan.err = "Claude's answer could not be read as a plan ("+e.message+') Try again.'; renderStagePanel(); return; }
    planOffer(cur, part, 'Claude');
  }catch(e){
    state.plan.busy = false; state.plan.ctl = null;
    const code = e && e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>=0){ state.plan.aiOff = true; state.plan.msg=''; state.plan.err = 'Claude is not available to this page in your account, so it cannot write the plan here. Use Build starter plan, or Copy prompt for Claude and paste the answer back.'; }
    else if(code==='cancelled'){ state.plan.err=''; state.plan.msg='Stopped. Nothing was changed.'; }
    else { state.plan.msg=''; state.plan.err = PLAN_FAIL[code] || 'Something went wrong while asking Claude. Try again.'; }
    const cur = activeCase(); if(cur && cur.id===caseId && state.stage==='evidence') renderStagePanel();
  }
}

function compressImageFile(file, maxDim, targetChars){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.naturalWidth||img.width, h = img.naturalHeight||img.height;
        const scale = Math.min(1, maxDim/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const draw = ()=>{ canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h); };
        draw();
        let quality = 0.82, dataUrl = canvas.toDataURL('image/jpeg', quality), attempts = 0;
        while(dataUrl.length > targetChars && attempts < 12){
          attempts++;
          if(quality > 0.4){ quality -= 0.12; }
          else { w = Math.round(w*0.82); h = Math.round(h*0.82); draw(); quality = 0.6; }
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve({ dataUrl, width:w, height:h });
      };
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

        <span class="chip ${e.status}">${e.status}</span>${(e.evidenceIds||[]).map(id=>`<span class="ev-tag">${esc(id)}</span>`).join('')}
        <button class="iconbtn" data-mv-ev="${e.id}" data-dir="-1" title="Move earlier on this timeline">&larr;</button>
        <button class="iconbtn" data-mv-ev="${e.id}" data-dir="1" title="Move later on this timeline">&rarr;</button>
        <button class="iconbtn" data-mv-lane="${e.id}" data-dir="-1" title="Move to the timeline above" ${lane===0?'disabled':''}>&uarr;</button>
        <button class="iconbtn" data-mv-lane="${e.id}" data-dir="1" title="Move to the timeline below">&darr;</button>
        ${canEditRecords()?`<button class="iconbtn" title="Edit" data-edit-record="event:${esc(e.id)}">&#9998;</button>`:''}
        <button class="iconbtn" data-del-ev="${e.id}" title="Remove">&#10005;</button>
      </div></div><div>${esc(e.text)}</div>
      <div class="field" style="margin:8px 0 0;"><label style="font-size:10.5px;margin-bottom:3px;">Merges into</label><select data-set-merge="${e.id}" style="font-size:11.5px;padding:5px 7px;">${mergeTargetOptions(e.id, e.mergeTo||null)}</select></div>
      </div>`).join('');
    }).join('') : ''}
    ${conditions.length?`<h4 style="font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:14px;">Conditions</h4>`+conditions.map(cd=>`
    <div class="entry-row"><div class="entry-row-head"><span class="idx">${cd.eventId?'linked to: '+esc(((events.find(e=>e.id===cd.eventId))||{text:'(removed event)'}).text.slice(0,34)):'background / organisational'}</span><div class="row-actions"><span class="chip ${cd.status}">${cd.status}</span>${(cd.evidenceIds||[]).map(id=>`<span class="ev-tag">${esc(id)}</span>`).join('')}${canEditRecords()?`<button class="iconbtn" title="Edit" data-edit-record="condition:${esc(cd.id)}">&#9998;</button>`:''}<button class="iconbtn" data-del-cond="${cd.id}" title="Remove">✕</button></div></div><div>${esc(cd.text)}</div></div>`).join(''):''}
  </div>`;
}
function laneEventsSorted(lane){ return state.events.filter(e=>(e.lane||0)===lane).sort((a,b)=>(a.order||0)-(b.order||0)); }
function moveEventOrder(c, id, dir){
  const ev = state.events.find(e=>e.id===id); if(!ev) return;
  const list = laneEventsSorted(ev.lane||0);
  const i = list.findIndex(e=>e.id===id), j = i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=list[i], b=list[j], oa=a.order||0, ob=b.order||0;
  Promise.all([ caseCol(c.id,'events').doc(a.id).update({order:ob}), caseCol(c.id,'events').doc(b.id).update({order:oa}) ]).then(()=>touchCase(c.id)).catch(()=>{});
}
function moveEventLane(c, id, dir){
  const ev = state.events.find(e=>e.id===id); if(!ev) return;
  const newLane = (ev.lane||0)+dir; if(newLane<0) return;
  const destOrder = laneEventsSorted(newLane).length;
  caseCol(c.id,'events').doc(id).update({lane:newLane, order:destOrder}).then(()=>touchCase(c.id)).catch(()=>{});
}
function wireChart(){
  wireDrawio();
  const c = activeCase(); if(isReadOnly()) return;
  const addEv = document.getElementById('add-event');
  if(addEv) addEv.onclick = async ()=>{
    const text = document.getElementById('new-ev-text').value.trim(); if(!text){ toast('Enter an event description first.'); return; }
    const laneSel = document.getElementById('new-ev-lane').value;
    const lane = laneSel==='new' ? Math.max(0,...state.events.map(e=>e.lane||0))+1 : parseInt(laneSel,10);
    state.lastEventLane = lane; // keep the dropdown on this timeline for the next add
    const mergeEl = document.getElementById('new-ev-merge');
    const item = { time:document.getElementById('new-ev-time').value.trim(), text, status:document.getElementById('new-ev-status').value, evidenceIds:pickedEvidence('newev-pick', c), lane, order: laneEventsSorted(lane).length, mergeTo: (mergeEl&&mergeEl.value)||null };
    await caseCol(c.id,'events').add(item).catch(()=>{}); touchCase(c.id);
  };
  const addCond = document.getElementById('add-condition');
  if(addCond) addCond.onclick = async ()=>{
    const text = document.getElementById('new-cond-text').value.trim(); if(!text){ toast('Enter a condition first.'); return; }
    const item = { eventId: document.getElementById('new-cond-event').value || null, text, status:document.getElementById('new-cond-status').value, evidenceIds:pickedEvidence('newcond-pick', c) };
    await caseCol(c.id,'conditions').add(item).catch(()=>{}); touchCase(c.id);
  };
  document.querySelectorAll('[data-del-ev]').forEach(b=>{ b.onclick=()=> deleteItemWithUndo(c.id, 'events', b.dataset.delEv, state.events, 'Event'); });
  document.querySelectorAll('[data-del-cond]').forEach(b=>{ b.onclick=()=> deleteItemWithUndo(c.id, 'conditions', b.dataset.delCond, state.conditions, 'Condition'); });
  document.querySelectorAll('[data-mv-ev]').forEach(b=>{ b.onclick=()=> moveEventOrder(c, b.dataset.mvEv, parseInt(b.dataset.dir,10)); });
  document.querySelectorAll('[data-mv-lane]').forEach(b=>{ b.onclick=()=> moveEventLane(c, b.dataset.mvLane, parseInt(b.dataset.dir,10)); });
  document.querySelectorAll('[data-set-merge]').forEach(sel=>{ sel.onchange=()=>{ caseCol(c.id,'events').doc(sel.dataset.setMerge).update({mergeTo: sel.value||null}).then(()=>touchCase(c.id)).catch(()=>{}); }; });
}
/* Measures the real rendered height a chart node needs at a given width, by
   laying it out (height:auto) in a hidden host, so long text grows the shape
   instead of being clipped, and short text collapses tight instead of
   wasting fixed space. */
function measureNodeHTML(html, width){
  let host = document.getElementById('chart-measure-host');
  if(!host){
    host = document.createElement('div');
    host.id = 'chart-measure-host';
    host.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;top:-9999px;left:-9999px;z-index:-1;';
    document.body.appendChild(host);
  }
  host.style.width = width+'px';
  host.innerHTML = html;
  const el = host.firstElementChild;
  let h = 0;
  if(el){ el.style.height='auto'; h = Math.ceil(el.getBoundingClientRect().height); }
  host.innerHTML = '';
  return h;
}
function evNodeHTML(ev){
  const tags = (ev.evidenceIds||[]).map(id=>`<span class="ev-tag">${esc(id)}</span>`).join('');
  return `<div xmlns="http://www.w3.org/1999/xhtml" class="ev-node ${ev.status}"><span class="ev-time">${esc(ev.time||'—')}</span><span class="ev-text">${esc(ev.text)}</span><span class="ev-tags">${tags}</span></div>`;
}
function condNodeHTML(cd){
  const tags = (cd.evidenceIds||[]).map(id=>`<span class="ev-tag">${esc(id)}</span>`).join('');
  return `<div xmlns="http://www.w3.org/1999/xhtml" class="cond-node ${cd.status}"><span>${esc(cd.text)}</span><span class="ev-tags">${tags}</span></div>`;
}
/* Multi-lane layout: events group into lanes (parallel timelines), each lane
   sorted by `order`. A lane's events chain left-to-right within that lane;
   an event with `mergeTo` set points its arrow at another event instead
   (anywhere — same or a different lane), converging one timeline into
   another instead of continuing its own row. */
function buildChartSVG(events, conditions){
  if(!events.length) return '<p class="empty">No events yet. Add your first event below to begin the storyline.</p>';
  const boxW=172, gapX=36, marginX=18, marginY=30, laneGap=44;
  const condW=146, condGapY=8, condStartGap=22;
  const byId = {}; events.forEach(e=>{ byId[e.id]=e; });
  const linked = {}; events.forEach(e=>{ linked[e.id] = conditions.filter(cd=>cd.eventId===e.id); });

  const evHTML={}, evH={}, condHTML={}, condH={};
  events.forEach(e=>{
    evHTML[e.id] = evNodeHTML(e);
    evH[e.id] = Math.max(48, measureNodeHTML(evHTML[e.id], boxW)+3);
    const list = linked[e.id];
    condHTML[e.id] = list.map(condNodeHTML);
    condH[e.id] = condHTML[e.id].map(html => Math.max(40, measureNodeHTML(html, condW)+3));
  });

  // Column position comes from each event's index within its own lane's
  // sorted array, not the raw `order` field directly — legacy data that
  // predates lanes/order (or has no order set at all) would otherwise
  // default every event to order 0 and stack them all on top of each other.
  const lanes = Array.from(new Set(events.map(e=>e.lane||0))).sort((a,b)=>a-b);
  const laneEvents = {}, colOf = {};
  lanes.forEach(l=>{
    const arr = events.filter(e=>(e.lane||0)===l);
    const hasOrder = arr.some(e=>typeof e.order === 'number');
    const sorted = hasOrder ? arr.slice().sort((a,b)=>(a.order||0)-(b.order||0)) : arr;
    laneEvents[l] = sorted;
    sorted.forEach((e,i)=>{ colOf[e.id] = i; });
  });

  const maxOrder = Math.max(0, ...lanes.map(l=>laneEvents[l].length-1));
  const totalW = marginX*2 + (maxOrder+1)*boxW + maxOrder*gapX;
  const xFor = order => marginX + order*(boxW+gapX);

  const laneBlockH = {}, laneTopY = {};
  let cursorY = marginY;
  lanes.forEach(l=>{
    let maxH = 0;
    laneEvents[l].forEach(e=>{
      const stack = condH[e.id];
      const stackH = stack.length ? stack.reduce((s,h)=>s+h,0)+(stack.length-1)*condGapY : 0;
      maxH = Math.max(maxH, evH[e.id] + (stackH ? condStartGap+stackH : 0));
    });
    laneBlockH[l] = maxH;
    laneTopY[l] = cursorY;
    cursorY += maxH + laneGap;
  });
  const totalH = cursorY - (lanes.length?laneGap:0) + 16;

  let svg = `<svg viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
    <marker id="arrow-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
  </defs>`;
  if(lanes.length>1){ lanes.forEach(l=>{ svg += `<text x="2" y="${laneTopY[l]-11}" style="font:700 9px var(--font-mono,monospace);letter-spacing:.04em;fill:var(--ink-faint);">TIMELINE ${l+1}${l===0?' (MAIN)':''}</text>`; }); }

  // connector arrows (drawn first so nodes sit on top)
  // Anchored at a fixed offset from the top of each box — not the box's
  // dynamic vertical center (y+h/2) — so that boxes of differing
  // auto-fit heights within the same lane still connect with a clean,
  // level line instead of a squiggly zigzag. evH always has a floor of
  // 48px, so 24px is always safely inside every box regardless of how
  // tall it grows to fit its text.
  const anchorOffset = 24;
  lanes.forEach(l=>{
    const list = laneEvents[l];
    list.forEach((e,i)=>{
      const x = xFor(colOf[e.id]), y = laneTopY[l];
      const mergeTarget = e.mergeTo ? byId[e.mergeTo] : null;
      if(mergeTarget){
        const tx = xFor(colOf[mergeTarget.id]), ty = laneTopY[mergeTarget.lane||0];
        svg += `<line x1="${x+boxW}" y1="${y+anchorOffset}" x2="${tx}" y2="${ty+anchorOffset}" style="stroke:var(--accent);stroke-width:2.25;stroke-dasharray:2,4" marker-end="url(#arrow-merge)"/>`;
      } else if(i<list.length-1){
        const next = list[i+1];
        const x2 = xFor(colOf[next.id]);
        svg += `<line x1="${x+boxW}" y1="${y+anchorOffset}" x2="${x2}" y2="${y+anchorOffset}" style="stroke:var(--ink);stroke-width:2.5" marker-end="url(#arrow)"/>`;
      }
    });
  });

  // event nodes + their condition stacks
  events.forEach(e=>{
    const l = e.lane||0, x = xFor(colOf[e.id]), y = laneTopY[l], h = evH[e.id];
    svg += `<foreignObject x="${x}" y="${y}" width="${boxW}" height="${h}">${evHTML[e.id]}</foreignObject>`;
    let curY = y + h + condStartGap, prevBottom = y + h;
    linked[e.id].forEach((cd,j)=>{
      const ch = condH[e.id][j];
      const cx = x + (boxW-condW)/2;
      const cyCenter = curY + ch/2;
      svg += `<line x1="${x+boxW/2}" y1="${prevBottom}" x2="${cx+condW/2}" y2="${cyCenter}" style="stroke:var(--teal);stroke-width:1.75;stroke-dasharray:5,4"/>`;
      svg += `<foreignObject x="${cx}" y="${curY}" width="${condW}" height="${ch}">${condHTML[e.id][j]}</foreignObject>`;
      prevBottom = curY + ch;
      curY = prevBottom + condGapY;
    });
  });
  svg += '</svg>';
  return svg;
}

/* =========================================================================
   DRAW.IO INTERCHANGE for the ECFA+ Storyline
   Export: the storyline (events, conditions, timelines, merges) becomes a
   draw.io diagram saved as an "editable SVG" (.drawio.svg) — a real SVG
   picture with the full mxfile XML embedded in its root `content`
   attribute, exactly the format draw.io's own "Export as SVG — include a
   copy of my diagram" produces. draw.io desktop / app.diagrams.net open it
   directly (File > Open, or drag it in). A "Copy XML" fallback puts the
   bare mxfile XML on the clipboard for Extras > Edit Diagram.
   Import: reads back .drawio / .xml / .svg / .html files saved by draw.io
   (compressed or not), rebuilds events + conditions from the shapes and
   connectors, previews the differences against the live case and, on
   confirmation, writes them to the shared record. If the file carries a
   rendering (an SVG saved from draw.io), that picture is kept and shown in
   place of the auto-generated chart.
   ========================================================================= */
const DRAWIO = {
  boxW:200, condW:180, gapX:60, condGapY:14, condStartGap:44, laneGap:70, marginX:40, marginY:40, bgGapX:24, titleH:34,
  colors:{ ink:'#1B2430', accent:'#C77D2E', accentInk:'#7A4A16', teal:'#2E6E77', tealInk:'#1D4A51', tealSoft:'#DCEBEC', faint:'#8891A0', surface:'#FFFFFF' }
};
const MAX_DIAGRAM_SVG_CHARS = 200*1024;

function xmlAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\r?\n/g,'&#10;'); }
function slugForFile(c){ return (c.caseTitle||'investigation').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'investigation'; }

/* Greedy word wrap on an estimated characters-per-line budget. Used both to
   size draw.io cells and to lay tspans in the exported SVG picture. */
function wrapLines(text, maxChars){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  words.forEach(w=>{
    if(!cur){ cur = w; return; }
    if((cur+' '+w).length <= maxChars) cur += ' '+w; else { lines.push(cur); cur = w; }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/* Geometry shared by the exported diagram and its SVG picture. Same lane /
   column logic as buildChartSVG, but heights are estimated from text length
   (no DOM measurement) so the layout is deterministic. */
function drawioLayout(events, conditions){
  const L = DRAWIO;
  const evCPL = Math.floor((L.boxW-16)/6.1), condCPL = Math.floor((L.condW*0.72)/5.7);
  const linked = {}; events.forEach(e=>{ linked[e.id] = conditions.filter(cd=>cd.eventId===e.id); });
  const bgConds = conditions.filter(cd=>!cd.eventId);
  const evLines = {}, evH = {};
  events.forEach(e=>{ evLines[e.id] = wrapLines(e.text, evCPL); evH[e.id] = Math.max(64, 30 + evLines[e.id].length*14 + ((e.evidenceIds||[]).length?16:0) + 8); });
  const condLines = {}, condH = {};
  conditions.forEach(cd=>{ condLines[cd.id] = wrapLines(cd.text, condCPL); condH[cd.id] = Math.max(64, 30 + condLines[cd.id].length*13 + ((cd.evidenceIds||[]).length?14:0) + 8); });

  const lanes = Array.from(new Set(events.map(e=>e.lane||0))).sort((a,b)=>a-b);
  const laneEvents = {}, colOf = {};
  lanes.forEach(l=>{
    const arr = events.filter(e=>(e.lane||0)===l);
    const hasOrder = arr.some(e=>typeof e.order==='number');
    const sorted = hasOrder ? arr.slice().sort((a,b)=>(a.order||0)-(b.order||0)) : arr;
    laneEvents[l] = sorted; sorted.forEach((e,i)=>{ colOf[e.id]=i; });
  });
  const maxCols = Math.max(1, ...lanes.map(l=>laneEvents[l].length));
  const xFor = col => L.marginX + col*(L.boxW+L.gapX);

  let y = L.marginY + L.titleH + 10;
  const bgPos = {};
  let bgRowH = 0;
  bgConds.forEach((cd,i)=>{ bgPos[cd.id] = { x:L.marginX + i*(L.condW+L.bgGapX), y, w:L.condW, h:condH[cd.id] }; bgRowH = Math.max(bgRowH, condH[cd.id]); });
  if(bgConds.length) y += bgRowH + 40;
  y += 22; // room for the first lane label

  const evPos = {}, condPos = {}, laneTop = {};
  lanes.forEach(l=>{
    laneTop[l] = y; let blockH = 0;
    laneEvents[l].forEach(e=>{
      const x = xFor(colOf[e.id]); evPos[e.id] = { x, y, w:L.boxW, h:evH[e.id], lane:l, col:colOf[e.id] };
      let cy = y + evH[e.id] + L.condStartGap;
      linked[e.id].forEach(cd=>{ condPos[cd.id] = { x: x + (L.boxW-L.condW)/2, y:cy, w:L.condW, h:condH[cd.id] }; cy += condH[cd.id] + L.condGapY; });
      blockH = Math.max(blockH, cy - y - (linked[e.id].length ? L.condGapY : L.condStartGap));
    });
    y += blockH + L.laneGap;
  });
  const totalW = Math.max(L.marginX*2 + maxCols*L.boxW + (maxCols-1)*L.gapX, L.marginX*2 + bgConds.length*(L.condW+L.bgGapX), 480);
  const totalH = y - L.laneGap + L.marginY;
  return { lanes, laneEvents, laneTop, evPos, condPos, bgPos, bgConds, linked, evLines, condLines, totalW, totalH };
}

function evidenceTagsLine(ids){ return (ids||[]).join(' · '); }
function drawioEventLabel(e){
  return `<b>${esc(e.time||'—')}</b><br>${esc(e.text)}` + ((e.evidenceIds||[]).length ? `<br><font style="font-size:9px;" color="${DRAWIO.colors.accentInk}">${esc(evidenceTagsLine(e.evidenceIds))}</font>` : '');
}
function drawioCondLabel(cd){
  return esc(cd.text) + ((cd.evidenceIds||[]).length ? `<br><font style="font-size:9px;" color="${DRAWIO.colors.accentInk}">${esc(evidenceTagsLine(cd.evidenceIds))}</font>` : '');
}
function drawioVertex(id, label, style, g, attrs){
  const extra = Object.entries(attrs||{}).map(([k,v])=>` ${k}="${xmlAttr(v)}"`).join('');
  return `<object id="${xmlAttr(id)}" label="${xmlAttr(label)}"${extra}><mxCell style="${xmlAttr(style)}" vertex="1" parent="1"><mxGeometry x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" as="geometry"/></mxCell></object>`;
}
function drawioEdge(id, style, source, target, attrs){
  const extra = Object.entries(attrs||{}).map(([k,v])=>` ${k}="${xmlAttr(v)}"`).join('');
  return `<object id="${xmlAttr(id)}" label=""${extra}><mxCell style="${xmlAttr(style)}" edge="1" parent="1" source="${xmlAttr(source)}" target="${xmlAttr(target)}"><mxGeometry relative="1" as="geometry"/></mxCell></object>`;
}

/* The mxfile XML draw.io edits. Every shape carries sc_type / sc_id
   attributes (visible in draw.io under Edit Data) so a re-import can match
   it back to the live record even after it has been moved or re-styled. */
function buildDrawioXML(c, events, conditions){
  const C = DRAWIO.colors, lay = drawioLayout(events, conditions);
  const cells = [];
  cells.push(drawioVertex('title', `<b>${esc(c.caseTitle||'Untitled Investigation')}</b> — ECFA+ Storyline`, `text;html=1;align=left;verticalAlign=middle;fontSize=14;fontColor=${C.ink};strokeColor=none;fillColor=none;`, {x:DRAWIO.marginX, y:DRAWIO.marginY, w:Math.max(400, lay.totalW-DRAWIO.marginX*2), h:DRAWIO.titleH}, {sc_type:'title'}));
  if(lay.bgConds.length){
    cells.push(drawioVertex('bg-label', 'BACKGROUND / ORGANISATIONAL CONDITIONS', `text;html=1;align=left;verticalAlign=bottom;fontSize=9;fontStyle=1;fontColor=${C.faint};strokeColor=none;fillColor=none;`, {x:DRAWIO.marginX, y:lay.bgPos[lay.bgConds[0].id].y-22, w:320, h:20}, {sc_type:'label'}));
  }
  const condStyle = cd => `ellipse;whiteSpace=wrap;html=1;align=center;verticalAlign=middle;fontSize=10;fontColor=${C.tealInk};fillColor=${C.tealSoft};strokeColor=${C.teal};strokeWidth=1.5;spacing=4;spacingLeft=14;spacingRight=14;${cd.status==='presumptive'?'dashed=1;':''}`;
  const evStyle = e => `rounded=1;arcSize=8;whiteSpace=wrap;html=1;align=left;verticalAlign=top;spacing=6;spacingTop=2;fontSize=11;fontColor=${C.ink};fillColor=${C.surface};strokeColor=${C.ink};strokeWidth=2;${e.status==='presumptive'?'dashed=1;':''}`;
  lay.bgConds.forEach(cd=>{ cells.push(drawioVertex('cond-'+cd.id, drawioCondLabel(cd), condStyle(cd), lay.bgPos[cd.id], {sc_type:'condition', sc_id:cd.id})); });
  lay.lanes.forEach(l=>{
    if(lay.lanes.length>1) cells.push(drawioVertex('lane-'+l, `TIMELINE ${l+1}${l===0?' (MAIN)':''}`, `text;html=1;align=left;verticalAlign=bottom;fontSize=9;fontStyle=1;fontColor=${C.faint};strokeColor=none;fillColor=none;`, {x:DRAWIO.marginX, y:lay.laneTop[l]-22, w:220, h:20}, {sc_type:'lane'}));
    lay.laneEvents[l].forEach((e,i)=>{
      cells.push(drawioVertex('ev-'+e.id, drawioEventLabel(e), evStyle(e), lay.evPos[e.id], {sc_type:'event', sc_id:e.id, sc_lane:String(l)}));
      lay.linked[e.id].forEach(cd=>{ cells.push(drawioVertex('cond-'+cd.id, drawioCondLabel(cd), condStyle(cd), lay.condPos[cd.id], {sc_type:'condition', sc_id:cd.id})); });
    });
  });
  const byId = {}; events.forEach(e=>{ byId[e.id]=e; });
  lay.lanes.forEach(l=>{
    lay.laneEvents[l].forEach((e,i)=>{
      const target = e.mergeTo && byId[e.mergeTo] ? byId[e.mergeTo] : null;
      if(target){
        cells.push(drawioEdge('merge-'+e.id, `edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;endArrow=block;endFill=1;strokeColor=${C.accent};strokeWidth=2;dashed=1;dashPattern=2 4;exitX=1;exitY=0.25;exitDx=0;exitDy=0;entryX=0;entryY=0.25;entryDx=0;entryDy=0;`, 'ev-'+e.id, 'ev-'+target.id, {sc_type:'merge'}));
      } else if(i < lay.laneEvents[l].length-1){
        const next = lay.laneEvents[l][i+1];
        cells.push(drawioEdge('seq-'+e.id, `edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;endFill=1;strokeColor=${C.ink};strokeWidth=2;exitX=1;exitY=0.25;exitDx=0;exitDy=0;entryX=0;entryY=0.25;entryDx=0;entryDy=0;`, 'ev-'+e.id, 'ev-'+next.id, {sc_type:'sequence'}));
      }
      lay.linked[e.id].forEach(cd=>{ cells.push(drawioEdge('cl-'+cd.id, `edgeStyle=none;html=1;endArrow=none;strokeColor=${C.teal};strokeWidth=1.5;dashed=1;`, 'cond-'+cd.id, 'ev-'+e.id, {sc_type:'condition-link'})); });
    });
  });
  const pageW = Math.max(1169, Math.ceil(lay.totalW/50)*50), pageH = Math.max(827, Math.ceil(lay.totalH/50)*50);
  return `<mxfile host="Storyline Casebook" modified="${nowISO()}" agent="Storyline Casebook" version="24.7.0" type="device"><diagram id="storyline" name="ECFA+ Storyline"><mxGraphModel dx="1200" dy="800" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="${pageW}" pageHeight="${pageH}" math="0" shadow="0"><root><mxCell id="0"/><mxCell id="1" parent="0"/>${cells.join('')}</root></mxGraphModel></diagram></mxfile>`;
}

/* A plain SVG picture of the same layout (rects, ellipses, wrapped tspans —
   no foreignObject, so it renders in any viewer) with the mxfile embedded
   in the root `content` attribute, which is what makes draw.io treat the
   file as editable. */
function buildDrawioSVG(c, events, conditions){
  const C = DRAWIO.colors, lay = drawioLayout(events, conditions);
  const xml = buildDrawioXML(c, events, conditions);
  const W = lay.totalW, H = lay.totalH;
  const t = (x, y, lines, opts)=>{
    const o = Object.assign({size:11, fill:C.ink, weight:400, anchor:'start', lh:14}, opts||{});
    return `<text x="${x}" y="${y}" font-family="Helvetica, Arial, sans-serif" font-size="${o.size}" font-weight="${o.weight}" fill="${o.fill}" text-anchor="${o.anchor}">${lines.map((ln,i)=>`<tspan x="${x}" dy="${i===0?0:o.lh}">${esc(ln)}</tspan>`).join('')}</text>`;
  };
  let s = '';
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  s += t(DRAWIO.marginX, DRAWIO.marginY+22, [`${c.caseTitle||'Untitled Investigation'} — ECFA+ Storyline`], {size:14, weight:700});
  const drawCond = (cd, g)=>{
    const dash = cd.status==='presumptive' ? ' stroke-dasharray="5,4"' : '';
    s += `<ellipse cx="${g.x+g.w/2}" cy="${g.y+g.h/2}" rx="${g.w/2}" ry="${g.h/2}" fill="${C.tealSoft}" stroke="${C.teal}" stroke-width="1.5"${dash}/>`;
    const lines = lay.condLines[cd.id]; const tags = evidenceTagsLine(cd.evidenceIds);
    const total = lines.length*13 + (tags?13:0);
    const y0 = g.y + g.h/2 - total/2 + 10;
    s += t(g.x+g.w/2, y0, lines, {size:10, fill:C.tealInk, anchor:'middle', lh:13});
    if(tags) s += t(g.x+g.w/2, y0 + lines.length*13, [tags], {size:8.5, fill:C.accentInk, anchor:'middle'});
  };
  if(lay.bgConds.length){
    s += t(DRAWIO.marginX, lay.bgPos[lay.bgConds[0].id].y-8, ['BACKGROUND / ORGANISATIONAL CONDITIONS'], {size:9, weight:700, fill:C.faint});
    lay.bgConds.forEach(cd=> drawCond(cd, lay.bgPos[cd.id]));
  }
  const byId = {}; events.forEach(e=>{ byId[e.id]=e; });
  // connectors first so shapes sit on top
  lay.lanes.forEach(l=>{
    lay.laneEvents[l].forEach((e,i)=>{
      const g = lay.evPos[e.id];
      const target = e.mergeTo && byId[e.mergeTo] ? byId[e.mergeTo] : null;
      if(target){
        const tg = lay.evPos[target.id];
        const x1 = g.x+g.w, y1 = g.y+g.h*0.25, x2 = tg.x, y2 = tg.y+tg.h*0.25, xm = x1 + (x2-x1)/2;
        s += `<path d="M ${x1} ${y1} L ${xm} ${y1} L ${xm} ${y2} L ${x2-8} ${y2}" fill="none" stroke="${C.accent}" stroke-width="2" stroke-dasharray="2,4"/><path d="M ${x2-9} ${y2-5} L ${x2} ${y2} L ${x2-9} ${y2+5} z" fill="${C.accent}"/>`;
      } else if(i < lay.laneEvents[l].length-1){
        const ng = lay.evPos[lay.laneEvents[l][i+1].id];
        const y1 = g.y+g.h*0.25;
        s += `<line x1="${g.x+g.w}" y1="${y1}" x2="${ng.x-8}" y2="${y1}" stroke="${C.ink}" stroke-width="2"/><path d="M ${ng.x-9} ${y1-5} L ${ng.x} ${y1} L ${ng.x-9} ${y1+5} z" fill="${C.ink}"/>`;
      }
      lay.linked[e.id].forEach(cd=>{ const cg = lay.condPos[cd.id]; s += `<line x1="${g.x+g.w/2}" y1="${g.y+g.h}" x2="${cg.x+cg.w/2}" y2="${cg.y}" stroke="${C.teal}" stroke-width="1.5" stroke-dasharray="5,4"/>`; });
    });
  });
  lay.lanes.forEach(l=>{
    if(lay.lanes.length>1) s += t(DRAWIO.marginX, lay.laneTop[l]-8, [`TIMELINE ${l+1}${l===0?' (MAIN)':''}`], {size:9, weight:700, fill:C.faint});
    lay.laneEvents[l].forEach(e=>{
      const g = lay.evPos[e.id];
      const dash = e.status==='presumptive' ? ' stroke-dasharray="6,4"' : '';
      s += `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="7" fill="${C.surface}" stroke="${C.ink}" stroke-width="2"${dash}/>`;
      s += t(g.x+8, g.y+16, [e.time||'—'], {size:10, weight:700, fill:C.accentInk});
      s += t(g.x+8, g.y+32, lay.evLines[e.id], {size:11});
      const tags = evidenceTagsLine(e.evidenceIds);
      if(tags) s += t(g.x+8, g.y+32+lay.evLines[e.id].length*14, [tags], {size:8.5, fill:C.accentInk});
      lay.linked[e.id].forEach(cd=> drawCond(cd, lay.condPos[cd.id]));
    });
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<!-- Editable draw.io diagram: open this file in draw.io (File > Open) to edit it, then import it back into Storyline Casebook. -->\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="${W}px" height="${H}px" viewBox="0 0 ${W} ${H}" content="${xmlAttr(xml)}">${s}</svg>`;
}

/* ---------- reading draw.io files back ---------------------------------- */
function inflateDrawioDiagram(text){
  const compact = String(text||'').replace(/\s+/g,'');
  if(!compact) return '';
  if(typeof pako === 'undefined') throw new Error('compressed');
  const bin = atob(compact);
  const bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const out = pako.inflateRaw(bytes);
  return decodeURIComponent(new TextDecoder('utf-8').decode(out));
}
function decodeHtmlEntities(s){ const d = new DOMParser().parseFromString('<!doctype html><body>'+String(s||''), 'text/html'); return d.body.textContent||''; }
/* Returns { models:[mxGraphModel elements], svgMarkup:string|null } from a
   .drawio / .xml / .svg / .html file's text, or throws a friendly Error. */
function parseDrawioFileText(text, fileName){
  const raw = String(text||'').replace(/^﻿/,'');
  const trimmed = raw.trim();
  if(!trimmed) throw new Error('That file is empty.');
  let svgMarkup = null, payload = trimmed;
  const parseXml = str => { const d = new DOMParser().parseFromString(str, 'text/xml'); if(d.getElementsByTagName('parsererror').length) throw new Error('That file could not be read as XML.'); return d; };
  const lower = trimmed.slice(0, 4000).toLowerCase();
  if(lower.includes('<svg')){
    const doc = parseXml(trimmed);
    const svgEl = doc.documentElement.nodeName.toLowerCase()==='svg' ? doc.documentElement : doc.getElementsByTagName('svg')[0];
    if(!svgEl) throw new Error('No <svg> element found.');
    const content = svgEl.getAttribute('content');
    if(!content) throw new Error('This SVG has no embedded diagram. In draw.io, export with "Include a copy of my diagram" ticked, or save as .drawio instead.');
    svgMarkup = trimmed; payload = content;
  } else if(lower.includes('data-mxgraph')){
    const doc = new DOMParser().parseFromString(trimmed, 'text/html');
    const el = doc.querySelector('[data-mxgraph]');
    let cfg = null; try{ cfg = JSON.parse(el.getAttribute('data-mxgraph')); }catch(e){}
    if(!cfg || !cfg.xml) throw new Error('No diagram found in that HTML file.');
    payload = cfg.xml;
  } else if(lower.includes('<html') || lower.includes('<body')){
    throw new Error('No draw.io diagram found in that HTML file.');
  } else if(/^\x89PNG/.test(raw) || /\.png$/i.test(fileName||'')){
    throw new Error('PNG files are not supported. Save from draw.io as .drawio or export as SVG with "Include a copy of my diagram".');
  }
  const doc = parseXml(payload.trim());
  const rootName = doc.documentElement.nodeName;
  let models = [];
  if(rootName==='mxfile'){
    Array.from(doc.documentElement.getElementsByTagName('diagram')).forEach(dg=>{
      let model = Array.from(dg.children||[]).find(n=>n.nodeName==='mxGraphModel');
      if(!model){
        let inner;
        try{ inner = inflateDrawioDiagram(dg.textContent); }
        catch(e){ if(e && e.message==='compressed') throw new Error('This diagram is stored compressed and the decompressor did not load. In draw.io turn off Extras > Compressed and save again, or export as SVG.'); throw new Error('This diagram is compressed in a way that could not be decoded.'); }
        if(inner){ const md = parseXml(inner); model = md.documentElement; }
      }
      if(model) models.push(model);
    });
  } else if(rootName==='mxGraphModel'){
    models = [doc.documentElement];
  } else {
    throw new Error('That does not look like a draw.io file (expected <mxfile> or <mxGraphModel>).');
  }
  if(!models.length) throw new Error('No diagram pages found in that file.');
  return { models, svgMarkup };
}

/* Flattens a mxGraphModel into plain vertex / edge records with absolute
   geometry (groups and containers unwrapped) and any sc_* attributes. */
function extractDrawioCells(model){
  const root = model.getElementsByTagName('root')[0]; if(!root) return { vertices:[], edges:[] };
  const raw = {};
  Array.from(root.children).forEach(node=>{
    let cell = node, attrs = {}, label = null;
    if(node.nodeName!=='mxCell'){
      cell = Array.from(node.children).find(n=>n.nodeName==='mxCell'); if(!cell) return;
      Array.from(node.attributes).forEach(a=>{ if(a.name!=='id' && a.name!=='label') attrs[a.name]=a.value; });
      label = node.getAttribute('label');
    } else {
      label = node.getAttribute('value');
    }
    const id = node.getAttribute('id') || cell.getAttribute('id'); if(!id) return;
    const geo = Array.from(cell.children).find(n=>n.nodeName==='mxGeometry');
    const g = geo ? { x:parseFloat(geo.getAttribute('x')||'0')||0, y:parseFloat(geo.getAttribute('y')||'0')||0, w:parseFloat(geo.getAttribute('width')||'0')||0, h:parseFloat(geo.getAttribute('height')||'0')||0 } : {x:0,y:0,w:0,h:0};
    raw[id] = { id, label:label||'', style:cell.getAttribute('style')||'', parent:cell.getAttribute('parent'), isVertex:cell.getAttribute('vertex')==='1', isEdge:cell.getAttribute('edge')==='1', source:cell.getAttribute('source'), target:cell.getAttribute('target'), g, attrs };
  });
  const absOf = (id, depth)=>{
    const r = raw[id]; if(!r || depth>20) return {x:0,y:0};
    if(!r.parent || r.parent==='1' || r.parent==='0' || !raw[r.parent]) return { x:r.g.x, y:r.g.y };
    const p = absOf(r.parent, depth+1); return { x:p.x + r.g.x, y:p.y + r.g.y };
  };
  const vertices = [], edges = [];
  Object.values(raw).forEach(r=>{
    if(r.isVertex){ const a = absOf(r.id, 0); vertices.push(Object.assign({}, r, { x:a.x, y:a.y, w:r.g.w, h:r.g.h, cx:a.x + r.g.w/2, cy:a.y + r.g.h/2 })); }
    else if(r.isEdge) edges.push(r);
  });
  return { vertices, edges };
}
function styleHas(style, key){ return new RegExp('(^|;)'+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(=|;|$)').test(style||''); }
function styleValue(style, key){ const m = new RegExp('(^|;)'+key+'=([^;]*)').exec(style||''); return m ? m[2] : null; }
function labelLines(label, style){
  let text = String(label||'');
  if(styleHas(style,'html=1') || /<[a-z][^>]*>/i.test(text)){
    text = text.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li|tr|h[1-6])>/gi,'\n');
    text = decodeHtmlEntities(text.replace(/<[^>]+>/g,''));
  }
  return text.split(/\r?\n/).map(s=>s.replace(/ /g,' ').trim()).filter(Boolean);
}
function looksLikeTime(s){ return s.length<=16 && /\d/.test(s) && !/[A-Za-z]{4,}/.test(s); }
const EV_LINE_RE = /^\[?\s*EV-\d{1,4}(\s*[,;·•|/]\s*\[?\s*EV-\d{1,4}\s*\]?)*\s*\]?$/i;
function splitNodeLabel(lines, wantTime){
  let time = '', evidence = [], textParts = [];
  lines.forEach((ln, i)=>{
    if(EV_LINE_RE.test(ln)){ (ln.match(/EV-\d{1,4}/gi)||[]).forEach(t=>evidence.push(t.toUpperCase())); return; }
    if(wantTime && i===0 && !time && looksLikeTime(ln) && lines.length>1){ time = ln==='—'?'':ln; return; }
    const trail = /^(.*?)\s*\[\s*((?:EV-\d{1,4}\s*[,;·•|/]?\s*)+)\]\s*$/i.exec(ln);
    if(trail){ (trail[2].match(/EV-\d{1,4}/gi)||[]).forEach(t=>evidence.push(t.toUpperCase())); textParts.push(trail[1]); return; }
    textParts.push(ln);
  });
  evidence = Array.from(new Set(evidence)).map(t=>{ const n=/EV-(\d+)/i.exec(t)[1]; return 'EV-'+String(parseInt(n,10)).padStart(3,'0'); });
  return { time, evidence, text: textParts.join(' ').replace(/\s+/g,' ').trim() };
}

/* Turns a parsed draw.io model into the app's own event / condition shape:
   events grouped into timelines by vertical position (row clustering) and
   ordered left-to-right; merges from event->event connectors that skip the
   in-lane successor; condition links from connectors, with a geometric
   fallback (nearest event above) for shapes drawn fresh in draw.io. */
function storylineFromDrawio(model){
  const { vertices, edges } = extractDrawioCells(model);
  const nodes = [];
  vertices.forEach(v=>{
    const st = v.attrs.sc_type || '';
    if(st==='title' || st==='lane' || st==='label') return;
    const isText = /^text(;|$)/.test(v.style) && !st;
    if(isText) return;
    const lines = labelLines(v.label, v.style);
    if(!lines.length) return;
    const isCond = st==='condition' || (!st && styleHas(v.style,'ellipse'));
    const dashed = styleHas(v.style,'dashed=1');
    if(isCond){ const p = splitNodeLabel(lines, false); if(!p.text) return; nodes.push({ kind:'condition', cellId:v.id, scId:v.attrs.sc_id||null, text:p.text, evidence:p.evidence, status:dashed?'presumptive':'proven', x:v.x, y:v.y, w:v.w, h:v.h, cx:v.cx, cy:v.cy }); }
    else { const p = splitNodeLabel(lines, true); if(!p.text) return; nodes.push({ kind:'event', cellId:v.id, scId:v.attrs.sc_id||null, time:p.time, text:p.text, evidence:p.evidence, status:dashed?'presumptive':'proven', x:v.x, y:v.y, w:v.w, h:v.h, cx:v.cx, cy:v.cy }); }
  });
  const byCell = {}; nodes.forEach(n=>{ byCell[n.cellId]=n; });
  const evs = nodes.filter(n=>n.kind==='event'), conds = nodes.filter(n=>n.kind==='condition');
  // lanes: cluster by vertical centre
  const sortedByY = evs.slice().sort((a,b)=>a.cy-b.cy);
  const medianH = evs.length ? evs.map(e=>e.h||60).sort((a,b)=>a-b)[Math.floor(evs.length/2)] : 60;
  const threshold = Math.max(40, medianH*0.6);
  let lane = -1, lastCy = null;
  sortedByY.forEach(e=>{ if(lastCy===null || e.cy - lastCy > threshold){ lane++; } e.lane = lane; lastCy = e.cy; });
  const laneLists = {};
  evs.forEach(e=>{ (laneLists[e.lane] = laneLists[e.lane]||[]).push(e); });
  Object.values(laneLists).forEach(list=>{ list.sort((a,b)=>a.x-b.x); list.forEach((e,i)=>{ e.order=i; e.nextCell = list[i+1] ? list[i+1].cellId : null; }); });
  // connectors
  evs.forEach(e=>{ e.mergeToCell = null; }); conds.forEach(cd=>{ cd.eventCell = null; });
  edges.forEach(ed=>{
    const a = byCell[ed.source], b = byCell[ed.target]; if(!a || !b) return;
    if(a.kind==='event' && b.kind==='event'){ if(b.cellId!==a.nextCell && !a.mergeToCell) a.mergeToCell = b.cellId; }
    else if(a.kind==='condition' && b.kind==='event'){ if(!a.eventCell) a.eventCell = b.cellId; }
    else if(a.kind==='event' && b.kind==='condition'){ if(!b.eventCell) b.eventCell = a.cellId; }
  });
  conds.forEach(cd=>{
    if(cd.eventCell || cd.scId) return; // exported conditions: connector (or its absence) is authoritative
    let best = null;
    evs.forEach(e=>{ if(e.y < cd.cy && cd.cx >= e.x - 20 && cd.cx <= e.x + e.w + 20){ const d = cd.cy - e.cy; if(!best || d < best.d) best = {e, d}; } });
    if(best) cd.eventCell = best.e.cellId;
  });
  return { events: evs, conditions: conds };
}

/* Diff the imported storyline against the live case and describe it. */
function planStorylineImport(c, imported){
  const curEvents = ro_list(c,'events'), curConds = ro_list(c,'conditions');
  const evIds = new Set(curEvents.map(e=>e.id)), condIds = new Set(curConds.map(cd=>cd.id));
  const knownEvidence = new Set(ro_list(c,'evidence').map(e=>e.id));
  const dropped = new Set();
  const cleanEvidence = ids => ids.filter(id=>{ if(knownEvidence.has(id)) return true; dropped.add(id); return false; });
  const usedEv = new Set(), usedCond = new Set();
  const events = imported.events.map(e=>{
    const existing = e.scId && evIds.has(e.scId) && !usedEv.has(e.scId) ? e.scId : null; if(existing) usedEv.add(existing);
    return { cellId:e.cellId, existingId:existing, time:e.time, text:e.text, status:e.status, evidenceIds:cleanEvidence(e.evidence), lane:e.lane, order:e.order, mergeToCell:e.mergeToCell };
  });
  const conditions = imported.conditions.map(cd=>{
    const existing = cd.scId && condIds.has(cd.scId) && !usedCond.has(cd.scId) ? cd.scId : null; if(existing) usedCond.add(existing);
    return { cellId:cd.cellId, existingId:existing, text:cd.text, status:cd.status, evidenceIds:cleanEvidence(cd.evidence), eventCell:cd.eventCell };
  });
  const removedEvents = curEvents.filter(e=>!usedEv.has(e.id));
  const removedConds = curConds.filter(cd=>!usedCond.has(cd.id));
  const factors = ro_list(c,'icamFactors');
  const orphanFactors = factors.filter(f=> (f.linkedType==='event' && removedEvents.some(e=>e.id===f.linkedId)) || (f.linkedType==='condition' && removedConds.some(cd=>cd.id===f.linkedId)));
  const eventByCell = {}; events.forEach(e=>{ eventByCell[e.cellId]=e; });
  const changedEvents = events.filter(e=>{ if(!e.existingId) return false; const cur = curEvents.find(x=>x.id===e.existingId); const mergeTarget = e.mergeToCell && eventByCell[e.mergeToCell] ? eventByCell[e.mergeToCell].existingId : null;
    return cur.time!==e.time || cur.text!==e.text || cur.status!==e.status || (cur.lane||0)!==e.lane || (cur.order||0)!==e.order || (cur.mergeTo||null)!==(mergeTarget||(e.mergeToCell?'__new__':null)) || JSON.stringify(cur.evidenceIds||[])!==JSON.stringify(e.evidenceIds); });
  const changedConds = conditions.filter(cd=>{ if(!cd.existingId) return false; const cur = curConds.find(x=>x.id===cd.existingId); const ev = cd.eventCell && eventByCell[cd.eventCell] ? eventByCell[cd.eventCell].existingId : null;
    return cur.text!==cd.text || cur.status!==cd.status || (cur.eventId||null)!==(ev||(cd.eventCell?'__new__':null)) || JSON.stringify(cur.evidenceIds||[])!==JSON.stringify(cd.evidenceIds); });
  return { events, conditions, newEvents:events.filter(e=>!e.existingId), newConds:conditions.filter(cd=>!cd.existingId), changedEvents, changedConds, removedEvents, removedConds, orphanFactors, droppedEvidence:Array.from(dropped) };
}
async function applyStorylineImport(c, plan){
  const evCol = caseCol(c.id,'events'), condCol = caseCol(c.id,'conditions');
  const idOfCell = {};
  // 1. create new events so links can resolve
  for(const e of plan.events){
    if(e.existingId){ idOfCell[e.cellId] = e.existingId; continue; }
    const ref = await evCol.add({ time:e.time, text:e.text, status:e.status, evidenceIds:e.evidenceIds, lane:e.lane, order:e.order, mergeTo:null });
    idOfCell[e.cellId] = ref.id;
  }
  // 2. update every event (order, lane, merge targets now resolvable)
  await Promise.all(plan.events.map(e=> evCol.doc(idOfCell[e.cellId]).update({ time:e.time, text:e.text, status:e.status, evidenceIds:e.evidenceIds, lane:e.lane, order:e.order, mergeTo: e.mergeToCell && idOfCell[e.mergeToCell] ? idOfCell[e.mergeToCell] : null })));
  // 3. conditions
  await Promise.all(plan.conditions.map(cd=>{
    const payload = { text:cd.text, status:cd.status, evidenceIds:cd.evidenceIds, eventId: cd.eventCell && idOfCell[cd.eventCell] ? idOfCell[cd.eventCell] : null };
    return cd.existingId ? condCol.doc(cd.existingId).update(payload) : condCol.add(payload);
  }));
  // 4. removals
  await Promise.all([ ...plan.removedEvents.map(e=> evCol.doc(e.id).delete().catch(()=>{})), ...plan.removedConds.map(cd=> condCol.doc(cd.id).delete().catch(()=>{})) ]);
  touchCase(c.id);
}

/* Keep the picture draw.io rendered (an exported SVG), stripped of scripts,
   event handlers and the embedded XML copy, so it can be shown inline. */
function sanitizeDiagramSVG(markup){
  const doc = new DOMParser().parseFromString(markup, 'image/svg+xml');
  if(doc.getElementsByTagName('parsererror').length) return null;
  const svg = doc.documentElement.nodeName.toLowerCase()==='svg' ? doc.documentElement : doc.getElementsByTagName('svg')[0];
  if(!svg) return null;
  Array.from(svg.querySelectorAll('script, iframe, object, embed, video, audio')).forEach(n=>n.remove());
  // draw.io wraps each HTML label in <switch><foreignObject/>+<image> (a
  // rasterised PNG fallback, ~30 KB each). Inline SVG renders the
  // foreignObject, so the fallbacks only cost storage — drop them.
  Array.from(svg.getElementsByTagName('switch')).forEach(sw=>{
    if(Array.from(sw.children).some(ch=>ch.nodeName.toLowerCase()==='foreignobject')) Array.from(sw.children).filter(ch=>ch.nodeName.toLowerCase()==='image').forEach(ch=>ch.remove());
  });
  Array.from(svg.getElementsByTagName('*')).concat([svg]).forEach(el=>{
    Array.from(el.attributes).forEach(a=>{
      const n = a.name.toLowerCase(), v = (a.value||'').trim().toLowerCase();
      if(n.startsWith('on') || ((n==='href'||n==='xlink:href'||n==='src') && !(v.startsWith('#')||v.startsWith('data:image/')||v.startsWith('https://')))) el.removeAttribute(a.name);
    });
  });
  svg.removeAttribute('content');
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('style','max-width:100%;height:auto;display:block;');
  return new XMLSerializer().serializeToString(svg);
}
