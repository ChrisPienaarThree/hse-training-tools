<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Storyline Casebook</title>
<style>
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#E9ECF1; --surface-3:#DEE2E9;
  --ink:#1B2430; --ink-soft:#525C6B; --ink-faint:#8891A0; --border:#D3D8E0;
  --accent:#A9631F; --accent-ink:#7A4A16; --accent-soft:#F1E1CB; --accent-line:#C77D2E;
  --teal:#2E6E77; --teal-ink:#1D4A51; --teal-soft:#DCEBEC;
  --good:#2F6B4F; --good-soft:#DCEEE3; --good-ink:#1E4A36;
  --warn:#9C7A1F; --warn-soft:#F2E7C7; --warn-ink:#6B5313;
  --bad:#A83E32; --bad-soft:#F6E1DD; --bad-ink:#7A2C22;
  --shadow:0 1px 2px rgba(27,36,48,.07),0 10px 28px rgba(27,36,48,.08);
  --radius:12px; --radius-sm:7px;
  --font-display:'IBM Plex Sans Condensed',Arial Narrow,sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161D; --surface:#1A2029; --surface-2:#212836; --surface-3:#2A3242;
    --ink:#E7EAEF; --ink-soft:#AAB2C0; --ink-faint:#6E7787; --border:#333D4E;
    --accent:#E0973E; --accent-ink:#F4C384; --accent-soft:#332613; --accent-line:#E0973E;
    --teal:#5FB8C2; --teal-ink:#A6E3E9; --teal-soft:#152E33;
    --good:#5FC090; --good-soft:#153826; --good-ink:#9FE3C1;
    --warn:#E0C158; --warn-soft:#372C10; --warn-ink:#F0D98C;
    --bad:#E1786A; --bad-soft:#3A1D18; --bad-ink:#F3B2A8;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --surface-2:#212836; --surface-3:#2A3242;
  --ink:#E7EAEF; --ink-soft:#AAB2C0; --ink-faint:#6E7787; --border:#333D4E;
  --accent:#E0973E; --accent-ink:#F4C384; --accent-soft:#332613; --accent-line:#E0973E;
  --teal:#5FB8C2; --teal-ink:#A6E3E9; --teal-soft:#152E33;
  --good:#5FC090; --good-soft:#153826; --good-ink:#9FE3C1;
  --warn:#E0C158; --warn-soft:#372C10; --warn-ink:#F0D98C;
  --bad:#E1786A; --bad-soft:#3A1D18; --bad-ink:#F3B2A8;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0 0 .4em;color:var(--ink);}
p{margin:0 0 .8em;}
.mono{font-family:var(--font-mono);}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-line);outline-offset:1px;}
textarea{resize:vertical;font-family:var(--font-body);}
a{color:var(--accent-ink);}
::selection{background:var(--accent-soft);}
fieldset{border:none;padding:0;margin:0;}

#app{max-width:1240px;margin:0 auto;padding:16px 22px 40px;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(155deg,var(--accent) 0%,var(--accent-line) 55%,var(--teal) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;flex:none;box-shadow:var(--shadow);}
.brand-text h1{font-size:19px;margin:0;letter-spacing:.01em;}
.brand-text span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;}
.conn-pill{font-family:var(--font-mono);font-size:10.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--ink-faint);}
.conn-pill.live{color:var(--good-ink);background:var(--good-soft);border-color:var(--good);}
.conn-pill.off{color:var(--bad-ink);background:var(--bad-soft);border-color:var(--bad);}

.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
.btn.ghost{background:transparent;box-shadow:none;}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ---- case list ---- */
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.list-head h2{font-size:24px;}
.list-head p{color:var(--ink-soft);font-size:13.5px;margin:0;}
.case-cards{display:flex;flex-direction:column;gap:10px;}
.case-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-columns:1.6fr auto auto auto auto auto;gap:16px;align-items:center;}
@media(max-width:900px){.case-card{grid-template-columns:1fr;}}
.case-card h4{font-size:15.5px;margin:0 0 3px;}
.case-card .meta{font-size:12px;color:var(--ink-faint);}
.status-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:99px;white-space:nowrap;}
.status-pill.open{background:var(--teal-soft);color:var(--teal-ink);}
.status-pill.investigating{background:var(--warn-soft);color:var(--warn-ink);}
.status-pill.review{background:var(--accent-soft);color:var(--accent-ink);}
.status-pill.closed{background:var(--good-soft);color:var(--good-ink);}
.sev-badge{font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;border:1px solid;}
.sev-1,.sev-2{color:var(--good-ink);background:var(--good-soft);border-color:var(--good);}
.sev-3{color:var(--warn-ink);background:var(--warn-soft);border-color:var(--warn);}
.sev-4,.sev-5{color:var(--bad-ink);background:var(--bad-soft);border-color:var(--bad);}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);}
.ref-strip{margin-top:30px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.ref-strip p{margin:0;font-size:12.5px;color:var(--ink-faint);max-width:60ch;}

/* filter bar (dashboard + case list) */
.filter-bar{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px;}
.filter-group{display:flex;flex-direction:column;gap:5px;min-width:180px;}
.filter-group.narrow{min-width:150px;}
.filter-group label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;}
.filter-group select{width:100%;padding:7px 9px;}
.range-slider{position:relative;height:16px;}
.range-track{position:absolute;left:2px;right:2px;top:6.5px;height:3px;border-radius:2px;background:var(--surface-3);}
.range-fill{position:absolute;top:6.5px;height:3px;border-radius:2px;background:var(--accent);}
.range-slider input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:16px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;}
.range-slider input[type=range]::-webkit-slider-runnable-track{-webkit-appearance:none;height:16px;background:transparent;}
.range-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:14px;height:14px;margin-top:1px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;}
.range-slider input[type=range]::-moz-range-track{height:3px;background:transparent;}
.range-slider input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;}
.range-slider input[type=range]:disabled::-webkit-slider-thumb{background:var(--ink-faint);cursor:not-allowed;}
.range-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);}
.case-table td, .case-table th{white-space:nowrap;}
.case-table td:first-child{white-space:normal;min-width:220px;}

/* ---- stage layout ---- */
.case-header-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.case-header-bar h2{font-size:21px;margin-bottom:3px;}
.case-header-bar .meta-line{font-size:12.5px;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stage-shell{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start;}
.stage-shell>*{min-width:0;}
@media(max-width:860px){.stage-shell{grid-template-columns:1fr;}}
.stepper{display:flex;flex-direction:column;gap:3px;position:sticky;top:20px;}
.stepper button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:9px 10px;color:var(--ink-soft);font-size:13px;}
.stepper button .n{font-family:var(--font-mono);font-size:11px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;}
.stepper button.active{background:var(--surface);border-color:var(--border);color:var(--ink);box-shadow:var(--shadow);}
.stepper button.active .n{background:var(--accent);color:#fff;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.panel-head h2{font-size:20px;}
.panel-head .sub{color:var(--ink-soft);font-size:13px;max-width:64ch;}
.stage-nav-btns{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}

.callout{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius-sm);padding:12px 14px;margin:14px 0;font-size:13px;color:var(--accent-ink);}
.callout.teal{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink);}
.callout strong{display:block;font-family:var(--font-display);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}

.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field .hint{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-top:3px;}
.field input,.field select,.field textarea{width:100%;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row.three{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:620px){.field-row,.field-row.three{grid-template-columns:1fr;}}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
.check-row input{width:auto;}

.readonly-block{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;margin-bottom:7px;}
.readonly-block h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 6px;}
.readonly-block p{margin:0 0 5px;font-size:13.5px;}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;}
.chip.proven{background:var(--good-soft);color:var(--good-ink);}
.chip.presumptive{background:var(--warn-soft);color:var(--warn-ink);}
.ev-tag{font-family:var(--font-mono);font-size:9.5px;background:var(--surface-3);color:var(--ink-soft);padding:1px 6px;border-radius:4px;white-space:nowrap;}

.entry-row{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--surface);}
.entry-row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.entry-row-head .idx{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
.row-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.iconbtn{background:transparent;border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;line-height:1;}
.iconbtn:hover{background:var(--surface-2);}

.add-form{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:14px;background:var(--surface-2);}
.add-form-title{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}
.ev-picker{max-height:130px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface);margin-bottom:10px;}
.ev-picker label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:400;color:var(--ink);margin-bottom:5px;}
.ev-picker input{width:auto;}

/* evidence register */
table.reg-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.reg-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:7px 8px;border-bottom:2px solid var(--border);}
table.reg-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
.ev-id{font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);}
.files-toggle{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:99px;padding:3px 9px 3px 7px;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.files-toggle:hover{background:var(--surface-2);}
.files-toggle .n{font-family:var(--font-mono);font-weight:700;color:var(--ink);}
tr.files-row td{background:var(--surface-2);padding:12px 14px;}
.attach-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.attach-item{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12.5px;}
.attach-ext{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--teal-soft);color:var(--teal-ink);border-radius:5px;padding:3px 6px;flex:none;}
.attach-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.attach-size{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);flex:none;}
.attach-upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.attach-hint{font-size:11px;color:var(--ink-faint);}

/* photographs & visual evidence */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.photo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;display:flex;flex-direction:column;}
.photo-thumb-wrap{aspect-ratio:4/3;overflow:hidden;background:var(--surface-3);cursor:zoom-in;}
.photo-thumb{width:100%;height:100%;object-fit:cover;display:block;}
.photo-meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;}
.photo-meta select{width:100%;font-size:11.5px;padding:5px 6px;}
.photo-caption{width:100%;font-size:12px;resize:vertical;min-height:38px;}
.photo-caption-ro{font-size:12.5px;margin:0;}
#lightbox{cursor:zoom-out;}
.lightbox-fig{margin:0;max-width:min(900px,92vw);background:var(--surface);border-radius:var(--radius-sm);padding:10px;box-shadow:var(--shadow);}
.lightbox-fig img{width:100%;max-height:78vh;object-fit:contain;border-radius:5px;display:block;}
.lightbox-fig figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
.report-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 16px;}
.report-photo{margin:0;}
.report-photo img{width:100%;border-radius:6px;border:1px solid var(--border);display:block;}
.report-photo figcaption{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
@media(max-width:520px){.report-photo-grid{grid-template-columns:1fr;}}

/* chart */
.chart-wrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;margin-bottom:16px;}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend .sw{width:16px;height:11px;border:2px solid var(--ink);border-radius:3px;display:inline-block;}
.legend .sw.dash{border-style:dashed;}
.legend .sw.cond{width:18px;height:11px;border:1.5px solid var(--teal);border-radius:8px;background:var(--teal-soft);}
.legend .sw.merge{width:18px;height:2px;background:var(--accent);border-radius:0;}
.ev-node{box-sizing:border-box;width:100%;min-height:100%;background:var(--surface);border:2px solid var(--ink);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;}
.ev-node.presumptive{border-style:dashed;}
.ev-node .ev-time{font-family:var(--font-mono);font-size:10px;color:var(--accent-ink);font-weight:600;}
.ev-node .ev-text{font-size:11px;line-height:1.2;color:var(--ink);}
.ev-node .ev-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;}
.cond-node{box-sizing:border-box;width:100%;min-height:100%;background:var(--teal-soft);border:1.75px solid var(--teal);border-radius:18px;padding:6px 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;font-size:10px;line-height:1.16;color:var(--teal-ink);}
.cond-node.presumptive{border-style:dashed;}
.cond-node .ev-tags{justify-content:center;}
.bg-conditions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.bg-cond-pill{font-size:12px;padding:6px 12px;border-radius:99px;background:var(--teal-soft);border:1.5px solid var(--teal);color:var(--teal-ink);}
.bg-cond-pill.presumptive{border-style:dashed;}
.empty{color:var(--ink-faint);font-size:13px;font-style:italic;padding:20px;text-align:center;}
/* draw.io interchange */
.diagram-strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal-soft);border:1px solid var(--teal);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;}
.diagram-meta{font-size:12px;color:var(--teal-ink);}
.chart-wrap.drawio-picture{background:#FFFFFF;padding:14px;}
.chart-wrap.drawio-picture svg{max-width:100%;height:auto;display:block;}
.import-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.import-grid{grid-template-columns:1fr;}}
.import-col{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);}
.import-col h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 8px;}
.import-stat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.import-list{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:220px;overflow-y:auto;}
.import-list li{padding:4px 0;border-top:1px solid var(--border);}
.chip.bad{background:var(--bad-soft);color:var(--bad-ink);}
.ev-tag.bad{background:var(--bad-soft);color:var(--bad-ink);}

/* fault tree (TapRooT-style) */
.ft-node{box-sizing:border-box;width:100%;min-height:100%;border-radius:7px;padding:7px 9px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:2px solid var(--ink);}
.ft-node .ft-kicker{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;}
.ft-node .ft-text{font-size:11px;line-height:1.25;color:var(--ink);}
.ft-node.ft-top{border-width:2.5px;background:var(--surface-2);}
.ft-node.ft-top .ft-text{font-weight:700;font-size:12px;}
.ft-node.ft-factor{border-color:var(--accent);}
.ft-node.ft-factor.general{border-style:dashed;}
.ft-node.ft-root{border-color:var(--teal);border-radius:10px;}
.ft-node.ft-root.placeholder{border-style:dashed;color:var(--ink-faint);}
.ft-node .ft-tag{font-size:9px;background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:2px 5px;align-self:flex-start;margin-top:auto;}

.icam-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.icam-grid{grid-template-columns:1fr;}}
.icam-col{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.icam-col-head{padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);}
.icam-col-head h5{margin:0;font-size:13px;}
.icam-col-head .q{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin-top:3px;}
.icam-col-body{padding:10px 12px;}
.icam-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;}
.icam-item .meta{font-size:10.5px;color:var(--ink-faint);margin-top:3px;font-family:var(--font-mono);}
.icam-item .link-tag{display:inline-block;margin-top:5px;font-size:10.5px;background:var(--accent-soft);color:var(--accent-ink);padding:2px 7px;border-radius:5px;}

table.actions-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.actions-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:7px 8px;border-bottom:2px solid var(--border);}
table.actions-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
.strength-flag{font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap;}
.strength-flag.weak{background:var(--bad-soft);color:var(--bad-ink);}
.strength-flag.strong{background:var(--good-soft);color:var(--good-ink);}
.hoc-pyramid{display:flex;flex-direction:column;gap:3px;margin:10px 0 4px;}
.hoc-pyramid div{padding:6px 10px;font-size:11px;border-radius:5px;color:#fff;font-weight:600;}

.actions-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--border);}
.actions-section-title:first-of-type{border-top:none;padding-top:0;}
.cause-action-block{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;background:var(--surface-2);}
.cause-action-head{display:flex;gap:9px;align-items:baseline;font-size:13.5px;font-weight:600;margin-bottom:8px;}
.cause-action-head .idx{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:5px;flex:none;}
.cause-action-block .actions-table{background:var(--surface);}
.cause-action-block .add-form{background:var(--surface);}

.report-doc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:26px 30px;font-size:13.5px;max-width:78ch;}
.report-doc h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);border-bottom:1px solid var(--border);padding-bottom:6px;margin:22px 0 10px;}
.report-doc h3:first-child{margin-top:0;}
.report-doc .ev-line{font-family:var(--font-mono);font-size:12px;margin-bottom:3px;}
.report-doc .cond-line{font-size:12.5px;color:var(--ink-soft);margin:0 0 8px 22px;}

.badge-status{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}
.badge-status.missing{background:var(--bad-soft);color:var(--bad-ink);}
.badge-status.partial,.badge-status.ineffective{background:var(--warn-soft);color:var(--warn-ink);}
.badge-status.effective{background:var(--good-soft);color:var(--good-ink);}

.inv-level-box{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin:14px 0;}
.inv-level-box .lvl-num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent-ink);}
.inv-level-box .lvl-text{font-size:13px;}
.inv-level-box .lvl-text strong{display:block;font-size:13.5px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,18,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.modal-box{background:var(--bg);border-radius:var(--radius);max-width:640px;width:100%;box-shadow:var(--shadow);}
.modal-inner{padding:24px;}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 10px 0;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);z-index:100;display:flex;align-items:center;gap:12px;}
.toast-undo{background:transparent;border:1px solid var(--bg);color:var(--bg);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
.toast-undo:hover{background:var(--bg);color:var(--ink);}
.case-card{position:relative;}
.case-del-confirm{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.case-del-confirm .btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink);}

/* ---- nav pills (topbar) ---- */
.nav-pills{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:3px;}
.nav-pills button{background:transparent;border:none;border-radius:99px;padding:6px 15px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.nav-pills button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

/* ---- dashboard ---- */
.dash-head{margin-bottom:20px;}
.dash-head h2{font-size:25px;}
.dash-head p{color:var(--ink-soft);font-size:13.5px;margin:0;max-width:78ch;}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:980px){.kpi-row{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;}
.kpi-tile .kpi-num{font-family:var(--font-display);font-size:29px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
.kpi-tile .kpi-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.045em;margin-top:7px;}
.kpi-tile.accent .kpi-num{color:var(--accent-ink);}
.kpi-tile.bad .kpi-num{color:var(--bad-ink);}
.kpi-tile.good .kpi-num{color:var(--good-ink);}
.kpi-tile.warn .kpi-num{color:var(--warn-ink);}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.dash-grid.thirds{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:940px){.dash-grid,.dash-grid.thirds{grid-template-columns:1fr;}}
.dash-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.dash-panel h3{font-size:14px;margin-bottom:2px;}
.dash-panel .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:14px;}

.bar-list{display:flex;flex-direction:column;gap:9px;}
.bar-row{display:grid;grid-template-columns:118px 1fr 28px;gap:10px;align-items:center;font-size:12px;}
.bar-row.wide{grid-template-columns:186px 1fr 28px;}
.bar-row .lbl{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .track{background:var(--surface-2);border-radius:5px;height:13px;overflow:hidden;}
.bar-row .fill{height:100%;border-radius:5px;background:var(--accent);min-width:2px;}
.bar-row .cnt{font-family:var(--font-mono);color:var(--ink-faint);text-align:right;font-size:11.5px;}

.risk-matrix{display:grid;grid-template-columns:22px repeat(5,1fr);gap:3px;font-size:11px;max-width:340px;}
.risk-matrix .rm-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:5px;font-family:var(--font-mono);font-weight:700;}
.risk-matrix .rm-axis{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:10.5px;font-family:var(--font-mono);}

.code-table{width:100%;border-collapse:collapse;font-size:12px;}
.code-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:6px 8px;border-bottom:2px solid var(--border);}
.code-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.code-cat-tag{font-size:9.5px;padding:2px 6px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.code-cat-tag.defences{background:var(--bad-soft);color:var(--bad-ink);}
.code-cat-tag.actions{background:var(--warn-soft);color:var(--warn-ink);}
.code-cat-tag.conditions{background:var(--teal-soft);color:var(--teal-ink);}
.code-cat-tag.organizational{background:var(--accent-soft);color:var(--accent-ink);}

.split-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:10px 0 12px;border:1px solid var(--border);}
.split-bar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}

.dash-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.dash-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:8px;border-bottom:2px solid var(--border);}
.dash-table td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}

/* evidence plan (ICAM PEEPO) and reference / training cases */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin:0 0 14px;flex-wrap:wrap;max-width:100%;}
.seg button{border:none;background:var(--surface);color:var(--ink-soft);padding:8px 14px;font-size:13px;font-weight:600;}
.seg button+button{border-left:1px solid var(--border);}
.seg button.on{background:var(--teal-ink);color:#fff;}
.seg .n{font-family:var(--font-mono);font-size:11px;opacity:.85;margin-left:4px;}
.pl-actions{gap:8px;flex-wrap:wrap;margin:4px 0 6px;}
.pl-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin:14px 0 8px;}
.pl-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}
.pl-chips button{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:99px;padding:4px 11px;font-size:12px;}
.pl-chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pl-h{font-size:15.5px;margin:20px 0 8px;}
.pl-cat{margin:0 0 16px;}
.pl-cat-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;}
.pl-cat-head h4{font-size:14px;margin:0;}
.pl-cat-head p{font-size:12px;color:var(--ink-faint);margin:0;}
.pl-letter{width:28px;height:28px;border-radius:7px;background:var(--teal-soft);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;flex:none;}
.pl-count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);font-weight:500;}
.pl-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.pl-table td{vertical-align:top;}
tr.pl-urgent td:first-child{box-shadow:inset 3px 0 0 var(--bad);}
.pl-tips{margin:10px 0;font-size:12.5px;color:var(--ink-soft);}
.pl-tips summary{cursor:pointer;font-weight:600;}
.ref-strip.ref-cases{flex-direction:column;align-items:stretch;}
.ref-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;}
.ref-card strong{display:block;font-size:13.5px;}
.ref-card span{font-size:12px;color:var(--ink-faint);}
@media print{
  .topbar,.stepper,.stage-nav-btns,.no-print{display:none !important;}
  .stage-shell{grid-template-columns:1fr;}
  body{background:#fff;}
}

<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
    async del(k) { try { const d = await db(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async keys(prefix) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res((q.result || []).filter(k => typeof k === 'string' && (!prefix || k.startsWith(prefix)))); q.onerror = () => res([]); }); } catch (e) { return []; } }
  };

  /* ---------- files ---------- */
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function pickWithInput(accept) {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.style.display = 'none';
      i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
      document.body.appendChild(i); i.click();
    });
  }
  async function permission(handle, ask) {
    if (!handle || !handle.queryPermission) return 'denied';
    try {
      let s = await handle.queryPermission({ mode: 'readwrite' });
      if (s !== 'granted' && ask) s = await handle.requestPermission({ mode: 'readwrite' });
      return s;
    } catch (e) { return 'denied'; }
  }
  /* opts: {tool, ext, label, mime} e.g. {tool:'tripod', ext:'.tripod.json', label:'Tripod Beta case'} */
  function FileLink(opts) {
    const types = [{ description: opts.label, accept: { [opts.mime || 'application/json']: [opts.ext.slice(opts.ext.lastIndexOf('.'))] } }];
    const key = id => 'handle:' + opts.tool + ':' + id;
    return {
      supported: hasFSA,
      /* Ask where to save; returns {handle, name} or null when cancelled. */
      async saveAs(id, suggested, text) {
        if (!hasFSA) { download(suggested, text, opts.mime || 'application/json'); return { handle: null, name: suggested, downloaded: true }; }
        let h;
        try { h = await window.showSaveFilePicker({ suggestedName: suggested, types, id: 'iikit-cases' }); }
        catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
        await this.write(h, text);
        await KitStore.set(key(id), h);
        return { handle: h, name: h.name };
      },
      async write(h, text) { const w = await h.createWritable(); await w.write(text); await w.close(); },
      /* Open a file; returns {handle|null, name, text} or null. */
      async open() {
        if (hasFSA) {
          let hs;
          try { hs = await window.showOpenFilePicker({ types, multiple: false, id: 'iikit-cases' }); }
          catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
          const f = await hs[0].getFile();
          return { handle: hs[0], name: f.name, text: await f.text(), modified: f.lastModified };
        }
        const f = await pickWithInput(opts.ext + ',.json,application/json');
        return f ? { handle: null, name: f.name, text: await f.text(), modified: f.lastModified } : null;
      },
      async link(id, h) { if (h) await KitStore.set(key(id), h); },
      async unlink(id) { await KitStore.del(key(id)); },
      async handleFor(id) { return await KitStore.get(key(id)); },
      permission,
      download: (name, text) => download(name, text, opts.mime || 'application/json')
    };
  }

  /* ---------- registry of investigations on this computer ---------- */
  const RK = 'iikit.registry';
  const KitRegistry = {
    list() { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } },
    upsert(entry) {
      try {
        const L = this.list().filter(x => !(x.tool === entry.tool && x.id === entry.id));
        L.push(Object.assign({ seenAt: new Date().toISOString() }, entry));
        localStorage.setItem(RK, JSON.stringify(L.slice(-500)));
      } catch (e) {}
    },
    remove(tool, id) { try { localStorage.setItem(RK, JSON.stringify(this.list().filter(x => !(x.tool === tool && x.id === id)))); } catch (e) {} }
  };
  /* action summary helper: items [{status, due}] with open statuses */
  function actionStats(items, isOpen, dueOf) {
    const today = new Date().toISOString().slice(0, 10);
    let open = 0, overdue = 0; const dues = [];

<script>/* Storyline Casebook (offline) — local runtime.
   Stands in for the claude.ai artifact runtime: window.claude.use('db' | 'downloads' | 'permissions').
   The db is an in-memory, Firestore-like document store (path -> data) persisted to IndexedDB
   (KIT.KitStore key "casebook:workspace") and, when linked, to a workspace file on the USB stick.
   Needs KIT (kit.js) loaded first. */
(function () {
  'use strict';
  const WS_KEY = 'casebook:workspace';
  const docs = new Map();          // full path -> plain object
  const listeners = new Set();     // {kind:'doc'|'query', path, q, next, prevIds}
  let changeHooks = [];
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const isPlain = v => v && typeof v === 'object' && !Array.isArray(v);
  const autoId = () => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; for (let i = 0; i < 20; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
  const err = (code, message) => { const e = new Error(message); e.code = code; return e; };
  const segs = p => String(p).split('/').filter(Boolean);
  const parentOf = p => segs(p).slice(0, -1).join('/');

  /* ---------- load ---------- */
  const ready = (async () => {
    try {
      const ws = await KIT.KitStore.get(WS_KEY);
      if (ws && ws.docs) Object.keys(ws.docs).forEach(k => docs.set(k, ws.docs[k]));
    } catch (e) {}
  })();

  /* ---------- notify ---------- */
  let flushQueued = false;
  function notifyAll(changedPaths) {
    changeHooks.forEach(fn => { try { fn(changedPaths); } catch (e) {} });
    if (flushQueued) return; flushQueued = true;
    setTimeout(() => { flushQueued = false; listeners.forEach(deliver); }, 0);
  }
  function snapDoc(path) {
    const d = docs.get(path), data = d === undefined ? undefined : clone(d);
    return { id: segs(path).pop(), ref: makeDoc(path), exists: d !== undefined, data: () => data === undefined ? undefined : clone(data), metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function runQuery(colPath, q) {
    let out = [];
    docs.forEach((v, k) => { if (parentOf(k) === colPath) out.push(k); });
    (q.where || []).forEach(([f, op, val]) => {
      const t = { '==': (a, b) => a === b, '!=': (a, b) => a !== b, '<': (a, b) => a < b, '<=': (a, b) => a <= b, '>': (a, b) => a > b, '>=': (a, b) => a >= b,
        in: (a, b) => (b || []).includes(a), 'not-in': (a, b) => !(b || []).includes(a), 'array-contains': (a, b) => Array.isArray(a) && a.includes(b) }[op];
      out = out.filter(k => t && t((docs.get(k) || {})[f], val));
    });
    if (q.orderBy) {
      const { field, dir } = q.orderBy, s = dir === 'desc' ? -1 : 1;
      out.sort((a, b) => { const x = (docs.get(a) || {})[field], y = (docs.get(b) || {})[field]; if (x === undefined && y === undefined) return a < b ? -1 : 1; if (x === undefined) return 1; if (y === undefined) return -1; return (x < y ? -1 : x > y ? 1 : 0) * s; });
    } else out.sort();
    if (q.limit) out = out.slice(0, q.limit);
    return out;
  }
  function snapQuery(colPath, q, prevIds) {
    const paths = runQuery(colPath, q), list = paths.map(snapDoc);
    const ids = paths.map(p => segs(p).pop());
    const changes = [];
    if (prevIds) {
      prevIds.forEach((id, i) => { if (!ids.includes(id)) changes.push({ type: 'removed', doc: { id, exists: true, data: () => ({}) }, oldIndex: i, newIndex: -1 }); });
      list.forEach((d, i) => { const o = prevIds.indexOf(d.id); changes.push({ type: o < 0 ? 'added' : 'modified', doc: d, oldIndex: o, newIndex: i }); });
    } else list.forEach((d, i) => changes.push({ type: 'added', doc: d, oldIndex: -1, newIndex: i }));
    return { snap: { docs: list, size: list.length, empty: !list.length, docChanges: () => changes, forEach: fn => list.forEach(fn), metadata: { fromCache: false, hasPendingWrites: false } }, ids };
  }
  function deliver(l) {
    try {
      if (l.kind === 'doc') l.next(snapDoc(l.path));
      else { const r = snapQuery(l.path, l.q, l.prevIds); l.prevIds = r.ids; l.next(r.snap); }
    } catch (e) { setTimeout(() => { throw e; }); }
  }

  /* ---------- refs ---------- */
  function merge(target, src) {
    Object.keys(src).forEach(k => {
      const v = src[k];
      if (isPlain(v) && v.__delete__ === true) { delete target[k]; return; }
      if (isPlain(v) && isPlain(target[k])) merge(target[k], v); else target[k] = clone(v);

  }

    path = segs(path).join('/');
    if (segs(path).length % 2) throw new TypeError('Document path needs an even number of segments: ' + path);

      id: segs(path).pop(), path,
      async get() { await ready; return snapDoc(path); },
      async set(data) { await ready; if (!isPlain(data)) throw err('invalid_argument', 'Document body must be an object'); docs.set(path, clone(data)); notifyAll([path]); },
      async update(data) { await ready; if (!docs.has(path)) throw err('invalid_argument', 'No document to update at ' + path); docs.set(path, merge(clone(docs.get(path)), data)); notifyAll([path]); },
      async delete() { await ready; if (docs.delete(path)) notifyAll([path]); },
      onSnapshot(next, error) { const l = { kind: 'doc', path, next }; listeners.add(l); ready.then(() => setTimeout(() => { if (listeners.has(l)) deliver(l); }, 0)); return () => listeners.delete(l); },
      collection(name) { return makeCol(path + '/' + name); },
      async acquire() { return { acquired: true, version: 1, holder: 'local' }; }
    };
  }
  function makeQuery(path, q) {
    return {
      where(f, op, v) { return makeQuery(path, Object.assign({}, q, { where: (q.where || []).concat([[f, op, v]]) })); },
      orderBy(field, dir) { return makeQuery(path, Object.assign({}, q, { orderBy: { field, dir: dir || 'asc' } })); },
      limit(n) { return makeQuery(path, Object.assign({}, q, { limit: n })); },
      async get() { await ready; return snapQuery(path, q, null).snap; },
      onSnapshot(next, error) { const l = { kind: 'query', path, q, next, prevIds: null }; listeners.add(l); ready.then(() => setTimeout(() => { if (listeners.has(l)) deliver(l); }, 0)); return () => listeners.delete(l); }
    };
  }
  function makeCol(path) {
    path = segs(path).join('/');
    if (!(segs(path).length % 2)) throw new TypeError('Collection path needs an odd number of segments: ' + path);
    const q = makeQuery(path, {});
    return Object.assign(q, {
      path,
      doc(id) { return makeDoc(path + '/' + (id || autoId())); },
      async add(data) { const d = makeDoc(path + '/' + autoId()); await d.set(data); return d; }
    });
  }
  const DB = Object.freeze({ doc: makeDoc, collection: makeCol });

  /* ---------- workspace helpers (used by the file bar) ---------- */
  const Workspace = {
    ready,
    toJSON() { const o = {}; docs.forEach((v, k) => { o[k] = v; }); return { format: 'storyline-casebook-workspace', version: 1, savedAt: new Date().toISOString(), app: 'Storyline Casebook (offline)', docs: o }; },
    async persist() { return KIT.KitStore.set(WS_KEY, { savedAt: new Date().toISOString(), docs: this.toJSON().docs }); },
    async replace(ws) { await KIT.KitStore.set(WS_KEY, { savedAt: new Date().toISOString(), docs: (ws && ws.docs) || {} }); },
    cases() {
      const out = [];
      docs.forEach((v, k) => { const s = segs(k); if (s.length === 2 && s[0] === 'cases') out.push(Object.assign({ id: s[1] }, v)); });
      return out;
    },
    sub(caseId, name) { const p = 'cases/' + caseId + '/' + name, out = []; docs.forEach((v, k) => { if (parentOf(k) === p) out.push(Object.assign({ id: segs(k).pop() }, v)); }); return out; },
    onChange(fn) { changeHooks.push(fn); },
    size() { return docs.size; }
  };
  window.CBO_WORKSPACE = Workspace;

  const downloads = Object.freeze({
    async save(r) {
      if (!r || !r.filename || r.data == null) throw err('bad_request', 'filename and data are required');
      KIT.download(r.filename, r.data, 'application/octet-stream');
      return { status: 'saved' };
    }
  });
  const permissions = Object.freeze({ async state() { return 'granted'; }, async request(names) { const o = {}; (names || ['db']).forEach(n => o[n] = 'granted'); return o; }, async manage() {} });

  window.claude = Object.freeze({
    use: async name => {
      if (name === 'db') { await ready; return DB; }
      if (name === 'downloads') return downloads;
      if (name === 'permissions') return permissions;
      return null;
    }
  });
})();
</script>

const CBP = (function(){
  const CATS = [
    {k:'people', l:'People', d:'Everyone involved, witnesses, supervisors and responders: interviews, statements, fitness for work, competence, hours worked.'},
    {k:'environment', l:'Environment', d:'The scene and its conditions: positions, distances and measurements, weather, water, lighting, terrain, housekeeping.'},
    {k:'equipment', l:'Equipment', d:'Plant, vehicles, tools, PPE, safety and rescue equipment, materials, and the data they record (logs, telemetry, CCTV, phones).'},
    {k:'procedures', l:'Procedures', d:'What was written and what was done: procedures, work instructions, permits, risk assessments, plans and checklists.'},
    {k:'organisation', l:'Organisation', d:'The systems behind the task: planning, contractor management, training, resourcing, communication, change, earlier incidents and audits.'}
  ];
  const CAT_KEYS = CATS.map(c=>c.k), CAT_NAME = Object.fromEntries(CATS.map(c=>[c.k, c.l]));
  const ICAM_DEFAULT = { people:'actions', environment:'conditions', equipment:'defences', procedures:'defences', organisation:'organizational' };
  const PRIORITY = ['Urgent','High','Normal'];
  const METHODS = ['Preserve','Collect','Photograph','Measure','Interview','Request copy','Download','Test / analyse','Observe'];
  const ITEM_STATUS = ['To collect','Collected','Not available','Not needed'];
  const VIEWS = ['Overview','Mid-range','Close-up','Detail with scale','Elevated / aerial'];
  const KINDS = ['Assumption','Conclusion','Open question'];
  const TEST_STATUS = ['Untested','Supported','Refuted','Inconclusive'];
  const PHOTO_TIPS = [
    'Photograph before anything is moved; if something must be moved for safety, photograph it first and record who moved it.',
    'Work from the outside in: overview from all sides, then mid-range, then close-ups of each item.',
    'Put a scale (ruler or tape) and a photo ID card in every close-up; take a second close-up without them.',
    'Keep the date and time setting correct on the camera or phone; note the time of the first photo.',
    'Log every photo: number, subject, camera position and direction. Never delete or edit originals; work on copies.',
    'Mark camera positions on the scene sketch, with a north arrow.'
  ];

  const uidp = p => (p||'') + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
  const str = (v, max) => String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0, max||600);
  const pick = (v, list, dflt) => { const s = str(v,60).toLowerCase(); return list.find(x=>x.toLowerCase()===s) || list.find(x=>s && x.toLowerCase().startsWith(s.split(/[\s/]/)[0])) || dflt; };
  function catKey(v){
    const s = str(v,60).toLowerCase();
    const k = CATS.find(c=> s===c.k || s===c.l.toLowerCase() || (s && (s.startsWith(c.k) || c.k.startsWith(s))));
    if(k) return k.k;
    if(/organi[sz]/.test(s)) return 'organisation';
    if(/^(position|scene|place|site|weather)/.test(s)) return 'environment';
    if(/^(parts?|electronic|data|plant|tool|ppe|vehicle)/.test(s)) return 'equipment';
    if(/^(paper|document|record|procedure|permit|risk)/.test(s)) return 'procedures';
    if(/(witness|interview|person|staff)/.test(s)) return 'people';
    return 'environment';
  }
  function icamKey(v, cat){
    const s = str(v,60).toLowerCase();
    if(/defen/.test(s)) return 'defences';
    if(/action|individual|team/.test(s)) return 'actions';
    if(/condition|task|environment/.test(s)) return 'conditions';
    if(/organi[sz]/.test(s)) return 'organizational';
    return ICAM_DEFAULT[cat] || 'conditions';
  }
  const CAT_ORDER = Object.fromEntries(CAT_KEYS.map((k,i)=>[k,i]));

  function blank(){ return { narrative:'', useChart:true, notes:'', source:'', generatedAt:'', items:[], photos:[], tests:[] }; }
  function mkItem(o){ const cat = catKey(o.cat); return { id:uidp('pi'), cat, item:str(o.item,400), source:str(o.source,300), purpose:str(o.purpose,400), icam:icamKey(o.icam, cat), priority:pick(o.priority, PRIORITY, 'Normal'), method:pick(o.method, METHODS, 'Collect'), owner:str(o.owner,80), due:str(o.due,10), status:pick(o.status, ITEM_STATUS, 'To collect'), ref:str(o.ref,60), notes:str(o.notes,400) }; }
  function mkPhoto(o){ return { id:uidp('pp'), subject:str(o.subject,300), position:str(o.position,300), view:pick(o.view, VIEWS, 'Overview'), purpose:str(o.purpose,400), taken:!!o.taken, ref:str(o.ref,60), notes:str(o.notes,300) }; }
  function mkTest(o){ return { id:uidp('pt'), statement:str(o.statement,500), kind:pick(o.kind, KINDS, 'Assumption'), evidence:str(o.evidence,500), status:pick(o.status, TEST_STATUS, 'Untested'), node:str(o.node,90) }; }
  const keepId = (made, x) => (x && typeof x.id==='string' && x.id) ? Object.assign(made, {id:x.id}) : made;
  function sortItems(items){ return items.map((x,i)=>[x,i]).sort((a,b)=> (CAT_ORDER[a[0].cat]-CAT_ORDER[b[0].cat]) || (a[1]-b[1])).map(p=>p[0]); }
  function normalise(e){
    const src = (e && typeof e==='object') ? e : {};
    const b = Object.assign(blank(), src);
    b.items = sortItems((Array.isArray(src.items)?src.items:[]).filter(x=>x && x.item).map(x=>keepId(mkItem(x), x)));
    b.photos = (Array.isArray(src.photos)?src.photos:[]).filter(x=>x && x.subject).map(x=>keepId(mkPhoto(x), x));
    b.tests = (Array.isArray(src.tests)?src.tests:[]).filter(x=>x && x.statement).map(x=>keepId(mkTest(x), x));
    b.narrative = String(src.narrative||'').slice(0, 20000);
    b.notes = str(src.notes, 1500); b.source = str(src.source, 40); b.generatedAt = str(src.generatedAt, 40);
    b.useChart = src.useChart !== false;
    delete b.id; delete b._docId;
    return b;
  }
  function hasContent(p){ return !!(p && (p.items.length || p.photos.length || p.tests.length)); }
  function stats(p){ return { items:p.items.length, got:p.items.filter(x=>x.status==='Collected').length, urgentOpen:p.items.filter(x=>x.priority==='Urgent' && x.status==='To collect').length,
    photos:p.photos.length, taken:p.photos.filter(x=>x.taken).length, tests:p.tests.length, tested:p.tests.filter(x=>x.status!=='Untested').length }; }
  /* the register type a checklist item becomes when it is logged as evidence */
  function evidenceType(it){
    if(it.method==='Interview') return 'Witness Statement';
    if(it.method==='Photograph') return 'Photograph / Video';
    if(it.method==='Download') return 'Technical / Data Record';
    if(it.method==='Request copy' || it.cat==='procedures' || it.cat==='organisation') return 'Documentary';
    if(['Preserve','Collect','Measure','Test / analyse'].indexOf(it.method)>=0) return 'Physical Evidence';
    return 'Other';
  }

  /* ---------- what Claude reads ------------------------------------------- */
  /* ctx: {events, conditions, evidence} of the case; refs look like event:<id> / condition:<id> */
  function chartLines(ctx){
    const ev = (ctx.events||[]).slice(0,60).map(e=>`- [event:${e.id}] ${e.status==='presumptive'?'(presumptive) ':''}${str(e.time,20)?str(e.time,20)+' — ':''}${str(e.text,200)}`);
    const cd = (ctx.conditions||[]).slice(0,60).map(c=>`- [condition:${c.id}] ${c.status==='presumptive'?'(presumptive) ':''}${str(c.text,200)}`);
    return ev.concat(cd);
  }
  function prompt(c, plan, ctx){
    const useChart = plan.useChart !== false;
    const chart = useChart ? chartLines(ctx||{}) : [];
    const logged = useChart ? (ctx && ctx.evidence || []).slice(0,60).map(e=>`- ${str(e.id,12)}: ${str(e.description,160)}`) : [];
    return [
      'You are an experienced workplace incident investigator who uses ICAM (Incident Cause Analysis Method). Write the evidence collection plan for the investigation below, organised by the ICAM PEEPO evidence categories.',
      '',
      'INCIDENT',
      `Title: ${str(c.caseTitle,200)}`, `Date and time: ${str(c.dateOccurred,20)} ${str(c.timeOccurred,20)}`,
      `Facility and location: ${str(c.facility,160)}${c.location?', '+str(c.location,160):''}`, `Incident type: ${str(c.incidentType,60)}; actual severity ${c.actualSeverity||1} of 5, potential severity ${c.potentialSeverity||1} of 5`,
      c.initialDescription ? `Initial report: ${str(c.initialDescription,2500)}` : '',
      c.refinedDescription ? `Refined description: ${str(c.refinedDescription,2500)}` : '',
      c.personsInvolved ? `Persons involved: ${str(c.personsInvolved,600)}` : '',
      '',
      "INVESTIGATOR'S ACCOUNT (may include assumptions and early conclusions; treat them as things to test, not facts)",
      String(plan.narrative||'').slice(0, 12000),
      chart.length ? '\nECFA+ STORYLINE SO FAR (reference in brackets)\n' + chart.join('\n') : '',
      logged.length ? '\nEVIDENCE ALREADY LOGGED (do not repeat)\n' + logged.join('\n') : '',
      '',
      'WHAT TO PRODUCE',
      '1. items: the evidence to collect, specific to THIS incident (name the actual equipment, documents, people roles and places mentioned). Group by PEEPO category: people (interviews of those involved, witnesses, supervisors and responders; fitness, competence, hours worked), environment (the scene: positions, distances, measurements, weather, water, lighting, terrain), equipment (plant, vehicles, tools, PPE, safety and rescue equipment, and recorded data such as logs, telemetry, CCTV and phones), procedures (procedures, permits, risk assessments, plans and checklists: what was written and what was done), organisation (contractor management, planning, training system, resourcing, communication, change, earlier incidents and audits). For each item give the ICAM element it informs: "defences" (absent or failed defences), "actions" (individual or team actions), "conditions" (task and environmental conditions) or "organisational" (organisational factors). Mark perishable evidence priority "Urgent" (scene conditions, witness memory, CCTV that overwrites, weather, anything that will be repaired, cleaned or moved). Say where to find each item and why it matters (which question or assumption it tests). 15 to 40 items.',
      '2. photos: a photography schedule in shooting order: overview shots from all sides first, then mid-range, then close-ups and details with a scale. Name the subject, the camera position and what the photo must show. 10 to 30 photos.',
      '3. tests: every assumption, conclusion or uncertain point in the account, and every presumptive storyline element, as a statement to test, with the evidence that would confirm or refute it. Use kind "Assumption", "Conclusion" or "Open question". For a storyline element put its reference (for example "event:abc") in "node". Up to 20.',
      '4. notes: 2 to 4 sentences of practical advice on preserving the scene and the order of collection for this incident.',
      'Do not invent facts that are not in the information above; where something is unknown, say what to find out.',
      '',
      'Reply with only this JSON object:',
      '{"items":[{"cat":"people|environment|equipment|procedures|organisation","item":"...","source":"where or from whom","purpose":"why / what it tests","icam":"defences|actions|conditions|organisational","priority":"Urgent|High|Normal","method":"Preserve|Collect|Photograph|Measure|Interview|Request copy|Download|Test / analyse|Observe"}],',
      ' "photos":[{"subject":"...","position":"camera position / direction","view":"Overview|Mid-range|Close-up|Detail with scale|Elevated / aerial","purpose":"what it must show"}],',
      ' "tests":[{"statement":"...","kind":"Assumption|Conclusion|Open question","evidence":"evidence that would confirm or refute it","node":"storyline reference or empty"}],',
      ' "notes":"..."}'
    ].filter(x=>x!=='').join('\n');
  }
  function parseText(t){
    let s = String(t||'').trim();
    const f = s.match(/```(?:json)?\s*([\s\S]*?)```/); if(f) s = f[1].trim();
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if(a<0 || b<=a) throw new Error('No JSON object found in the answer.');
    return JSON.parse(s.slice(a, b+1));
  }
  function fromAnswer(o, nodeRefs){
    if(!o || typeof o!=='object' || Array.isArray(o)) throw new Error('The answer is not a plan object.');
    const refs = new Set(nodeRefs||[]);
    const items = sortItems((Array.isArray(o.items)?o.items:[]).filter(x=>x && x.item).slice(0,80).map(mkItem));
    const photos = (Array.isArray(o.photos)?o.photos:[]).filter(x=>x && x.subject).slice(0,60).map(mkPhoto);
    const tests = (Array.isArray(o.tests)?o.tests:[]).filter(x=>x && x.statement).slice(0,40).map(x=>{ const t = mkTest(x); if(!refs.has(t.node)) t.node=''; return t; });
    if(!items.length && !photos.length && !tests.length) throw new Error('The answer holds no checklist items, photos or tests.');
    return { items, photos, tests, notes:str(o.notes,1200) };
  }

  /* ---------- offline starter plan ------------------------------------------ */
  /* rows: [cat, item, source, purpose, priority, method, icam?] */
  const BASE = {
    items: [
      ['people','List of everyone involved, witnesses and first responders, with contact details and shift','Supervisor; access records','Nobody is missed for interview','Urgent','Collect','actions'],
      ['people','Interview the injured or involved person(s) individually, as soon as they are fit','Involved persons','First-hand account of the sequence, and why their actions made sense to them at the time','Urgent','Interview','actions'],
      ['people','Interview witnesses separately, before they compare accounts','Witnesses','Independent accounts of what happened','Urgent','Interview','actions'],
      ['people','Interview the supervisor: how the task was planned, instructed and supervised','Supervisor on duty','Tests planning, instructions and supervision','High','Interview','organizational'],
      ['people','Training, competence and appointment records of the people involved','Training department; HR','Were the people trained and competent for this task?','High','Request copy','organizational'],
      ['people','Shift roster and hours worked by the people involved (last 7 days)','Time and attendance; HR','Tests fatigue as a human factor','Normal','Request copy','conditions'],
      ['people','First-aid, medical and emergency response records','Clinic; first aider; emergency team','Confirms injury, time line and response','High','Request copy','defences'],
      ['environment','Scene as found: barricade and keep it undisturbed until the investigation lead releases it','Incident scene','Positions and conditions change quickly once work resumes','Urgent','Preserve','conditions'],
      ['environment','Measured sketch of the scene: positions of people, equipment, materials and distances, with a north arrow','Incident scene','Fixes the layout for the storyline','Urgent','Measure','conditions'],
      ['environment','Conditions at the time: lighting, weather, noise, housekeeping, floor or ground surface','Incident scene; shift log','Tests whether workplace conditions contributed','Urgent','Observe','conditions'],
      ['equipment','Equipment, tools and materials involved: quarantine, tag and record make, model and serial or asset numbers','Incident scene; workshop','Physical evidence of condition and failure','Urgent','Preserve','defences'],
      ['equipment','PPE worn by the people involved: retain it and record its condition','Involved persons; clinic','Tests whether PPE was worn, suitable and in good condition','High','Collect','defences'],
      ['equipment','CCTV footage covering the area and the time: secure a copy before it is overwritten','Security; control room','Independent record of the sequence','Urgent','Download','actions'],
      ['equipment','Access control, radio and phone records around the time of the incident','Security; IT; control room','Fixes the time line and communications','High','Download','actions'],
      ['procedures','Risk assessment / JSA / HIRA for the task','SHE office; work pack','Was the hazard identified and controlled?','High','Request copy','defences'],
      ['procedures','Work permit, authorisation and isolation records for the task','Permit office; control room','Tests whether the permit and isolation defences were in place','High','Request copy','defences'],
      ['procedures','Procedure or work instruction in force at the time (with version and date)','Document control','Was there a procedure, and was it followed and adequate?','High','Request copy','defences'],
      ['organisation','Inspection and maintenance history of the equipment involved','Maintenance system; engineering','Tests equipment condition and maintenance management','High','Request copy','organizational'],
      ['organisation','Previous incidents, near misses and audit findings for this task or area','SHE incident database','Shows whether the problem was known before','Normal','Request copy','organizational'],
      ['organisation','How the task was planned and resourced, and any recent changes to people, plant or procedures','Planning; management of change register','Tests planning, resourcing and management of change','Normal','Request copy','organizational']
    ],
    photos: [
      ['Overview of the scene from the first side (e.g. north)','At the edge of the barricaded area, facing the point of the event','Overview','The whole scene and its surroundings as found'],
      ['Overview of the scene from the opposite side','Opposite the first overview','Overview','The scene from the other direction'],
      ['Overview from the remaining two sides','Left and right of the first overview','Overview','Complete coverage; nothing hidden behind equipment'],
      ['Access route to the point of the event','Along the route the people took','Mid-range','What the people saw on approach; obstructions, signs'],
      ['Point of contact, injury or failure','1 to 3 m from the point','Mid-range','Relative positions of people, equipment and materials'],
      ['Point of contact, injury or failure, with scale','Close up, square to the surface','Detail with scale','Marks, damage, residues; with a scale and photo ID card'],
      ['Equipment involved and its ID / rating plate','Close up','Close-up','Make, model, serial or asset number, ratings'],
      ['Controls, guards, isolation points and their state','At each control or isolation point','Close-up','Positions of switches, valves, locks and tags; guards fitted or not'],
      ['Signs, barricades and warnings in the area','From where a worker would see them','Mid-range','Whether warnings were present and visible'],
      ['Housekeeping, floor or ground surface','At working height and close to the surface','Mid-range','Slip/trip hazards, spills, obstructions'],
      ['Lighting and visibility','From the worker\'s position, without flash, then with','Mid-range','Light levels and glare at the time'],
      ['PPE involved','Laid out on a neutral background','Detail with scale','Type and condition of the PPE'],
      ['Anything moved or changed before the investigation team arrived','Where it is now, and where it was','Mid-range','Record the change and who made it']
    ]
  };
  const PACKS = [
    { re:/\b(vehicle|truck|ldv|bakkie|car|bus|forklift|loader|haul|tipper|dump truck|trailer|roll ?over|collision|reversing|driver)\b/i,
      items:[['equipment','Vehicle involved: quarantine; record tyres, brakes, steering, lights, seat belt and warning devices','Vehicle','Tests vehicle condition as a failed defence or condition','Urgent','Preserve','defences'],
        ['equipment','Vehicle tracking / telemetry / dash camera data (speed, braking, location)','Fleet management; tracking provider','Fixes speed and manoeuvres before the event','Urgent','Download','actions'],
        ['people','Driver licence, medical fitness, permit to operate and pre-use inspection checklist','HR; fleet office','Tests driver competence and fitness','High','Request copy','organizational'],
        ['environment','Tyre marks, gouges, final positions and road or haul-road condition, with measurements','Road / haul road','Reconstructs the path and speed','Urgent','Measure','conditions']],
      photos:[['Final position of the vehicle(s)','All four sides and elevated if possible','Overview','Rest positions relative to road edges and objects'],['Tyre marks and road surface','Along the path of travel','Detail with scale','Length and direction of marks; surface condition'],['Driver\'s view from the cab','Driver\'s seat, at eye height','Mid-range','Visibility and blind spots']] },
    { re:/\b(conveyor|pulley|conveyor belt|belt conveyor|machine guard|guarding|nip ?point|rotating|machinery|machine|lathe|press|crusher|mill|pump|gearbox)\b/i,
      items:[['equipment','Machine guards and safety devices: fitted, removed or bypassed; condition of interlocks and pull-wires','Machine','Tests the guarding defence','Urgent','Observe','defences'],
        ['procedures','Isolation / lockout records: lock register, isolation certificate, test-for-dead','Control room; permit office','Tests whether energy was isolated and verified','Urgent','Request copy','defences'],
        ['equipment','PLC, SCADA or alarm logs for start/stop and trip events around the time','Control system; engineering','Fixes when the machine moved','Urgent','Download','actions']],
      photos:[['Guard positions and openings','At the nip point / danger zone','Close-up','Gaps, missing or opened guards'],['Isolation points, locks and tags','At each isolator','Close-up','Lock and tag placement and identity']] },
    { re:/\b(isolat|lock ?out|loto|energ|electric|shock|arc|cable|switchgear|substation|live)\b/i,
      items:[['procedures','Electrical isolation certificate, switching programme and test-for-dead record','Electrical control room','Tests the isolation defence','Urgent','Request copy','defences'],
        ['equipment','Test instruments used: retain and check calibration','Electrician','Tests whether the test-for-dead was valid','High','Collect','defences']],
      photos:[['Switchgear / isolator position and labelling','Front of the panel','Close-up','Switch positions, labels and locks']] },
    { re:/\b(height|fall|fell|ladder|scaffold|roof|platform|harness|lanyard|edge|elevated|cherry ?picker|mewp)\b/i,
      items:[['equipment','Fall-protection equipment: harness, lanyard, anchor point, ladder or scaffold; retain and tag','Scene; equipment store','Tests the fall-protection defence','Urgent','Preserve','defences'],
        ['procedures','Scaffold tag / inspection register, fall-protection plan and ladder inspection records','Scaffold supervisor; SHE office','Tests inspection and planning','High','Request copy','defences'],
        ['environment','Height of fall, landing surface and distances, measured','Scene','Severity and mechanism of the fall','Urgent','Measure','conditions']],
      photos:[['Working position and edge from above','From the working platform','Mid-range','Edge protection and anchor points'],['Landing area','From the working position looking down, and at ground level','Overview','Height and landing surface']] },
    { re:/\b(drown\w*|boat|swim\w*|flood\w*|spillway|overflow\w*|river|life ?jackets?|ring buoys?|on water|near water)\b/i,
      items:[['environment','Survey of the water body: depths, water levels, flow and the positions of people, craft and banks, with distances','Survey team; design drawings','Distances, depth and flow cannot be estimated later','Urgent','Measure','conditions'],
        ['environment','High-water and debris marks, and the flow at outlets or spillways at the time','Banks; walls; telemetry','Fixes the peak level and current; disappears as the water drops','Urgent','Measure','conditions'],
        ['equipment','Boat or craft, lines and any life jackets, ring buoys or throw lines: quarantine and record condition and where they were kept','Scene; stores','Tests the flotation and rescue defences','Urgent','Preserve','defences'],
        ['procedures','Site rule or standard for work on or near water, and the emergency plan for water rescue','SHE office; emergency coordinator','Was work on water controlled, and was rescue planned?','High','Request copy','defences'],
        ['people','Swimming ability and water-safety, rescue and first-aid training of the people involved','Training records; interviews','Tests competence for work on water','High','Request copy','organizational'],
        ['people','Post-mortem or medical findings on the cause of death or injury','Police; mortuary; clinic','Confirms drowning and any other factors','High','Request copy','conditions']],
      photos:[['The whole water body from the highest point available','Elevated point or drone','Elevated / aerial','Positions of banks, outlets, craft and people'],['Distance from the last position in the water to the nearest bank','From the bank, with a person or pole for scale','Mid-range','The distance that had to be covered'],['Where life-saving equipment is (or is not) kept','At each access point to the water','Mid-range','Availability of rescue equipment']] },
    { re:/\b(chemical|spill|leak|gas|fume|vapour|vapor|acid|caustic|toxic|h2s|ammonia|chlorine|hazchem|exposure)\b/i,
      items:[['equipment','Samples of the substance involved, in suitable sealed containers, labelled','Scene; laboratory','Identifies the substance and concentration','Urgent','Collect','conditions'],
        ['procedures','Safety data sheet (SDS) and the chemical register entry','SHE office','Hazards and required controls','High','Request copy','defences'],
        ['equipment','Gas detector readings and logs (fixed and portable) around the time','Control room; gas detector','Measures the exposure','Urgent','Download','defences']],
      photos:[['Source of the release and extent of the spill','Overview and close-up','Detail with scale','Size, flow direction and the leak point']] },
    { re:/\b(fire|explosion|burn(s|t|ed)?|ignit\w*|flammable|hot work|welding|gas cutting|flare)\b/i,
      items:[['procedures','Hot work permit, gas test records and fire watch log','Permit office','Tests the hot-work defences','Urgent','Request copy','defences'],
        ['environment','Burn patterns and the probable point of origin; do not clean up','Scene','Identifies the ignition source','Urgent','Preserve','conditions']],
      photos:[['Burn patterns from all sides','Around the fire area','Overview','Spread and point of origin'],['Possible ignition sources','Close up','Detail with scale','Condition of each possible source']] },
    { re:/\b(crane|lifting|rigging|sling|shackle|suspended load|dropped load|load fell|hoist|chain block)\b/i,
      items:[['equipment','Lifting gear (slings, shackles, hooks): retain and tag, record SWL markings','Scene','Tests rigging condition and selection','Urgent','Preserve','defences'],
        ['procedures','Lift plan, crane load chart, and lifting gear inspection register','Lifting supervisor','Tests lift planning and inspection','High','Request copy','defences'],
        ['people','Crane operator and rigger competence records','Training department','Tests competence for the lift','High','Request copy','organizational'],
        ['equipment','Crane load-moment indicator / data logger records','Crane','Load and radius at the time','Urgent','Download','actions']],
      photos:[['Crane set-up and outriggers','Around the crane','Overview','Set-up, ground conditions and radius'],['Rigging and SWL markings','Close up','Detail with scale','Condition and ratings of each item']] },
    { re:/\b(hand|finger|cut|laceration|knife|grinder|tool|pinch|crush)\b/i,
      items:[['equipment','The hand tool or power tool involved: condition, guards, and whether it was the right tool','Scene; tool store','Tests tool selection and condition','High','Collect','conditions']],
      photos:[['Tool involved','On a neutral background','Detail with scale','Condition, guards and markings']] },
    { re:/\b(slip\w*|tripp\w*|trip hazard|stair\w*|walkway|wet floor|oily|floor|uneven)\b/i,
      items:[['environment','Floor or walkway condition: contamination, wear, level differences; measure them','Scene','Tests the walking surface as a condition','Urgent','Measure','conditions']],
      photos:[['Walking surface at the point of the slip or trip','Low angle and close up','Detail with scale','Contamination, defects and level differences']] },
    { re:/\b(contractor|sub-?contractor|vendor)\b/i,
      items:[['organisation','Contract, scope of work, appointment, induction records and contractor safety file','Contractor management office','Was the work within the contract scope, and was the contractor managed?','High','Request copy','organizational']] },
    { re:/\b(night|fatigue|tired|overtime|long shift|sleep)\b/i,
      items:[['people','Hours of work and rest for the 14 days before the event','Time and attendance','Tests fatigue as a human factor','High','Request copy','conditions']] },
    { re:/\b(alcohol|drug|substance|intoxicat|breathalys)\b/i,
      items:[['people','Alcohol and drug test results taken after the event (with time of test)','Clinic; security','Tests impairment as a human factor','Urgent','Request copy','conditions']] },

  const CRC = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

    ],

      PH('Spillway crest and the drop on the downstream side','Beside the spillway, and from downstream','Mid-range','Height of the wall the workers feared going over'),
