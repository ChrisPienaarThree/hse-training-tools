<title>Storyline Casebook</title>
<style>
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#E9ECF1; --surface-3:#DEE2E9;
  --ink:#1B2430; --ink-soft:#525C6B; --ink-faint:#8891A0; --border:#D3D8E0;
  --accent:#A9631F; --accent-ink:#7A4A16; --accent-soft:#F1E1CB; --accent-line:#C77D2E;
  --teal:#2E6E77; --teal-ink:#1D4A51; --teal-soft:#DCEBEC;
  --good:#2F6B4F; --good-soft:#DCEEE3; --good-ink:#1E4A36;
  --warn:#9C7A1F; --warn-soft:#F2E7C7; --warn-ink:#6B5313;
  --bad:#A83E32; --bad-soft:#F6E1DD; --bad-ink:#7A2C22;
  --shadow:0 1px 2px rgba(27,36,48,.07),0 10px 28px rgba(27,36,48,.08);
  --radius:12px; --radius-sm:7px;
  --font-display:'IBM Plex Sans Condensed',Arial Narrow,sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161D; --surface:#1A2029; --surface-2:#212836; --surface-3:#2A3242;
    --ink:#E7EAEF; --ink-soft:#AAB2C0; --ink-faint:#6E7787; --border:#333D4E;
    --accent:#E0973E; --accent-ink:#F4C384; --accent-soft:#332613; --accent-line:#E0973E;
    --teal:#5FB8C2; --teal-ink:#A6E3E9; --teal-soft:#152E33;
    --good:#5FC090; --good-soft:#153826; --good-ink:#9FE3C1;
    --warn:#E0C158; --warn-soft:#372C10; --warn-ink:#F0D98C;
    --bad:#E1786A; --bad-soft:#3A1D18; --bad-ink:#F3B2A8;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --surface-2:#212836; --surface-3:#2A3242;
  --ink:#E7EAEF; --ink-soft:#AAB2C0; --ink-faint:#6E7787; --border:#333D4E;
  --accent:#E0973E; --accent-ink:#F4C384; --accent-soft:#332613; --accent-line:#E0973E;
  --teal:#5FB8C2; --teal-ink:#A6E3E9; --teal-soft:#152E33;
  --good:#5FC090; --good-soft:#153826; --good-ink:#9FE3C1;
  --warn:#E0C158; --warn-soft:#372C10; --warn-ink:#F0D98C;
  --bad:#E1786A; --bad-soft:#3A1D18; --bad-ink:#F3B2A8;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0 0 .4em;color:var(--ink);}
p{margin:0 0 .8em;}
.mono{font-family:var(--font-mono);}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-line);outline-offset:1px;}
textarea{resize:vertical;font-family:var(--font-body);}
a{color:var(--accent-ink);}
::selection{background:var(--accent-soft);}
fieldset{border:none;padding:0;margin:0;}

#app{max-width:1240px;margin:0 auto;padding:16px 22px 40px;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(155deg,var(--accent) 0%,var(--accent-line) 55%,var(--teal) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;flex:none;box-shadow:var(--shadow);}
.brand-text h1{font-size:19px;margin:0;letter-spacing:.01em;}
.brand-text span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;}
.conn-pill{font-family:var(--font-mono);font-size:10.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--ink-faint);}
.conn-pill.live{color:var(--good-ink);background:var(--good-soft);border-color:var(--good);}
.conn-pill.off{color:var(--bad-ink);background:var(--bad-soft);border-color:var(--bad);}

.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
.btn.ghost{background:transparent;box-shadow:none;}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ---- case list ---- */
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.list-head h2{font-size:24px;}
.list-head p{color:var(--ink-soft);font-size:13.5px;margin:0;}
.case-cards{display:flex;flex-direction:column;gap:10px;}
.case-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-columns:1.6fr auto auto auto auto auto;gap:16px;align-items:center;}
@media(max-width:900px){.case-card{grid-template-columns:1fr;}}
.case-card h4{font-size:15.5px;margin:0 0 3px;}
.case-card .meta{font-size:12px;color:var(--ink-faint);}
.status-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:99px;white-space:nowrap;}
.status-pill.open{background:var(--teal-soft);color:var(--teal-ink);}
.status-pill.investigating{background:var(--warn-soft);color:var(--warn-ink);}
.status-pill.review{background:var(--accent-soft);color:var(--accent-ink);}
.status-pill.closed{background:var(--good-soft);color:var(--good-ink);}
.sev-badge{font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;border:1px solid;}
.sev-1,.sev-2{color:var(--good-ink);background:var(--good-soft);border-color:var(--good);}
.sev-3{color:var(--warn-ink);background:var(--warn-soft);border-color:var(--warn);}
.sev-4,.sev-5{color:var(--bad-ink);background:var(--bad-soft);border-color:var(--bad);}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);}
.ref-strip{margin-top:30px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.ref-strip p{margin:0;font-size:12.5px;color:var(--ink-faint);max-width:60ch;}

/* filter bar (dashboard + case list) */
.filter-bar{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px;}
.filter-group{display:flex;flex-direction:column;gap:5px;min-width:180px;}
.filter-group.narrow{min-width:150px;}
.filter-group label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;}
.filter-group select{width:100%;padding:7px 9px;}
.range-slider{position:relative;height:16px;}
.range-track{position:absolute;left:2px;right:2px;top:6.5px;height:3px;border-radius:2px;background:var(--surface-3);}
.range-fill{position:absolute;top:6.5px;height:3px;border-radius:2px;background:var(--accent);}
.range-slider input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:16px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;}
.range-slider input[type=range]::-webkit-slider-runnable-track{-webkit-appearance:none;height:16px;background:transparent;}
.range-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:14px;height:14px;margin-top:1px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;}
.range-slider input[type=range]::-moz-range-track{height:3px;background:transparent;}
.range-slider input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;}
.range-slider input[type=range]:disabled::-webkit-slider-thumb{background:var(--ink-faint);cursor:not-allowed;}
.range-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);}
.case-table td, .case-table th{white-space:nowrap;}
.case-table td:first-child{white-space:normal;min-width:220px;}

/* ---- stage layout ---- */
.case-header-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.case-header-bar h2{font-size:21px;margin-bottom:3px;}
.case-header-bar .meta-line{font-size:12.5px;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stage-shell{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start;}
@media(max-width:860px){.stage-shell{grid-template-columns:1fr;}}
.stepper{display:flex;flex-direction:column;gap:3px;position:sticky;top:20px;}
.stepper button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:9px 10px;color:var(--ink-soft);font-size:13px;}
.stepper button .n{font-family:var(--font-mono);font-size:11px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;}
.stepper button.active{background:var(--surface);border-color:var(--border);color:var(--ink);box-shadow:var(--shadow);}
.stepper button.active .n{background:var(--accent);color:#fff;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.panel-head h2{font-size:20px;}
.panel-head .sub{color:var(--ink-soft);font-size:13px;max-width:64ch;}
.stage-nav-btns{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}

.callout{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius-sm);padding:12px 14px;margin:14px 0;font-size:13px;color:var(--accent-ink);}
.callout.teal{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink);}
.callout strong{display:block;font-family:var(--font-display);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}

.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field .hint{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-top:3px;}
.field input,.field select,.field textarea{width:100%;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row.three{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:620px){.field-row,.field-row.three{grid-template-columns:1fr;}}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
.check-row input{width:auto;}

.readonly-block{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;margin-bottom:7px;}
.readonly-block h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 6px;}
.readonly-block p{margin:0 0 5px;font-size:13.5px;}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;}
.chip.proven{background:var(--good-soft);color:var(--good-ink);}
.chip.presumptive{background:var(--warn-soft);color:var(--warn-ink);}
.ev-tag{font-family:var(--font-mono);font-size:9.5px;background:var(--surface-3);color:var(--ink-soft);padding:1px 6px;border-radius:4px;white-space:nowrap;}

.entry-row{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--surface);}
.entry-row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.entry-row-head .idx{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
.row-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.iconbtn{background:transparent;border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;line-height:1;}
.iconbtn:hover{background:var(--surface-2);}

.add-form{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:14px;background:var(--surface-2);}
.add-form-title{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}
.ev-picker{max-height:130px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface);margin-bottom:10px;}
.ev-picker label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:400;color:var(--ink);margin-bottom:5px;}
.ev-picker input{width:auto;}

/* evidence register */
table.reg-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.reg-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:7px 8px;border-bottom:2px solid var(--border);}
table.reg-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
.ev-id{font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);}
.files-toggle{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:99px;padding:3px 9px 3px 7px;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.files-toggle:hover{background:var(--surface-2);}
.files-toggle .n{font-family:var(--font-mono);font-weight:700;color:var(--ink);}
tr.files-row td{background:var(--surface-2);padding:12px 14px;}
.attach-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.attach-item{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12.5px;}
.attach-ext{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--teal-soft);color:var(--teal-ink);border-radius:5px;padding:3px 6px;flex:none;}
.attach-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.attach-size{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);flex:none;}
.attach-upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.attach-hint{font-size:11px;color:var(--ink-faint);}

/* photographs & visual evidence */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.photo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;display:flex;flex-direction:column;}
.photo-thumb-wrap{aspect-ratio:4/3;overflow:hidden;background:var(--surface-3);cursor:zoom-in;}
.photo-thumb{width:100%;height:100%;object-fit:cover;display:block;}
.photo-meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;}
.photo-meta select{width:100%;font-size:11.5px;padding:5px 6px;}
.photo-caption{width:100%;font-size:12px;resize:vertical;min-height:38px;}
.photo-caption-ro{font-size:12.5px;margin:0;}
#lightbox{cursor:zoom-out;}
.lightbox-fig{margin:0;max-width:min(900px,92vw);background:var(--surface);border-radius:var(--radius-sm);padding:10px;box-shadow:var(--shadow);}
.lightbox-fig img{width:100%;max-height:78vh;object-fit:contain;border-radius:5px;display:block;}
.lightbox-fig figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
.report-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 16px;}
.report-photo{margin:0;}
.report-photo img{width:100%;border-radius:6px;border:1px solid var(--border);display:block;}
.report-photo figcaption{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
@media(max-width:520px){.report-photo-grid{grid-template-columns:1fr;}}

/* chart */
.chart-wrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;margin-bottom:16px;}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend .sw{width:16px;height:11px;border:2px solid var(--ink);border-radius:3px;display:inline-block;}
.legend .sw.dash{border-style:dashed;}
.legend .sw.cond{width:18px;height:11px;border:1.5px solid var(--teal);border-radius:8px;background:var(--teal-soft);}
.legend .sw.merge{width:18px;height:2px;background:var(--accent);border-radius:0;}
.ev-node{box-sizing:border-box;width:100%;min-height:100%;background:var(--surface);border:2px solid var(--ink);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;}
.ev-node.presumptive{border-style:dashed;}
.ev-node .ev-time{font-family:var(--font-mono);font-size:10px;color:var(--accent-ink);font-weight:600;}
.ev-node .ev-text{font-size:11px;line-height:1.2;color:var(--ink);}
.ev-node .ev-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;}
.cond-node{box-sizing:border-box;width:100%;min-height:100%;background:var(--teal-soft);border:1.75px solid var(--teal);border-radius:18px;padding:6px 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;font-size:10px;line-height:1.16;color:var(--teal-ink);}
.cond-node.presumptive{border-style:dashed;}
.cond-node .ev-tags{justify-content:center;}
.bg-conditions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.bg-cond-pill{font-size:12px;padding:6px 12px;border-radius:99px;background:var(--teal-soft);border:1.5px solid var(--teal);color:var(--teal-ink);}
.bg-cond-pill.presumptive{border-style:dashed;}
.empty{color:var(--ink-faint);font-size:13px;font-style:italic;padding:20px;text-align:center;}
/* draw.io interchange */
.diagram-strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal-soft);border:1px solid var(--teal);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;}
.diagram-meta{font-size:12px;color:var(--teal-ink);}
.chart-wrap.drawio-picture{background:#FFFFFF;padding:14px;}
.chart-wrap.drawio-picture svg{max-width:100%;height:auto;display:block;}
.import-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.import-grid{grid-template-columns:1fr;}}
.import-col{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);}
.import-col h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 8px;}
.import-stat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.import-list{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:220px;overflow-y:auto;}
.import-list li{padding:4px 0;border-top:1px solid var(--border);}
.chip.bad{background:var(--bad-soft);color:var(--bad-ink);}
.ev-tag.bad{background:var(--bad-soft);color:var(--bad-ink);}

/* fault tree (TapRooT-style) */
.ft-node{box-sizing:border-box;width:100%;min-height:100%;border-radius:7px;padding:7px 9px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:2px solid var(--ink);}
.ft-node .ft-kicker{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;}
.ft-node .ft-text{font-size:11px;line-height:1.25;color:var(--ink);}
.ft-node.ft-top{border-width:2.5px;background:var(--surface-2);}
.ft-node.ft-top .ft-text{font-weight:700;font-size:12px;}
.ft-node.ft-factor{border-color:var(--accent);}
.ft-node.ft-factor.general{border-style:dashed;}
.ft-node.ft-root{border-color:var(--teal);border-radius:10px;}
.ft-node.ft-root.placeholder{border-style:dashed;color:var(--ink-faint);}

function activeCase(){ return state.screen==='sample' ? SAMPLE : state.openCase; }

function isTyping(){ const ae=document.activeElement; return ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'); }
function safeRerender(){ if(!isTyping()) renderStagePanel(); }

function showToast(msg, undoFn){
  let el=document.getElementById('toast'); if(el) el.remove();
  el=document.createElement('div'); el.id='toast'; el.className='toast';
  const span=document.createElement('span'); span.textContent=msg; el.appendChild(span);
  if(undoFn){
    const btn=document.createElement('button'); btn.type='button'; btn.className='toast-undo'; btn.textContent='Undo';
    btn.onclick=async()=>{ el.remove(); await undoFn(); };
    el.appendChild(btn);
  }
  document.body.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, undoFn?7000:3200);
}
function toast(msg){ showToast(msg); }
function toastUndo(msg, undoFn){ showToast(msg, undoFn); }

/* ---------- capability init ---------------------------------------------*/
function describeDbError(e){ if(!e) return 'unknown error'; return (e.code||'error')+(e.message?(' \u2014 '+e.message):''); }
function listenErr(e){ state.connStatus='off'; state.connError=e; render(); }
(async function init(){
  try{ state.dbHandle = await window.claude.use('db'); }catch(e){ state.dbHandle=null; }
  try{ state.downloadsHandle = await window.claude.use('downloads'); }catch(e){ state.downloadsHandle=null; }
  if(state.dbHandle){
    state.connStatus = 'live';
  } else {
    state.connStatus = 'off';
    if(!HAS_CLAUDE_RUNTIME){
      state.connError = {code:'no_runtime', message:'this page was opened outside claude.ai (for example as a local file or from a plain web server), so there is no shared case store here. Open it from its claude.ai link instead.'};
    } else {
      let st = 'unknown';
      try{ const perms = await window.claude.use('permissions'); if(perms) st = await perms.state('db'); }catch(e){}
      state.dbPermState = st;
      const why = st==='denied' ? 'access to the shared case store was declined for this page load'
                : st==='prompt' ? 'access to the shared case store has not been granted yet'
                : st==='unavailable' ? 'the shared case store is not available in this view (the link may be a copy without the data capability, or sharing does not allow it)'
                : 'the shared-data capability did not load (state: '+st+')';
      state.connError = {code:'not_granted', message:why};
    }
  }
  render();
  if(state.dbHandle) subscribeCaseList();
})();
async function requestDbAccess(){
  try{
    const perms = await window.claude.use('permissions');
    if(!perms){ toast('Permissions are not available in this view.'); return; }
    const res = await perms.request(['db']);
    if(res && res.db==='granted'){ toast('Access granted \u2014 reloading\u2026'); setTimeout(()=>location.reload(), 600); }
    else if(res && res.db==='denied'){ toast('Access was declined. Reload the page to be asked again.'); }
    else { toast('The shared case store is not available here ('+(res&&res.db?res.db:'unknown')+').'); }
  }catch(e){ toast('Could not request access: '+describeDbError(e)); }
}
function connErrorHTML(){
  if(!state.connError) return '';
  const canAsk = state.connError.code==='not_granted' && ['prompt','denied','unknown'].includes(state.dbPermState);
  return `<div class="mono" style="margin-top:6px;font-size:11.5px;">Error: ${esc(describeDbError(state.connError))}</div>`+
    (canAsk ? `<div style="margin-top:8px;"><button class="btn small primary" type="button" onclick="requestDbAccess()">Grant access to shared data</button> <button class="btn small ghost" type="button" onclick="location.reload()">Reload page</button></div>` : '');
}

/* =========================================================================
   DB HELPERS
   ========================================================================= */
function caseDoc(id){ return state.dbHandle.doc('cases/'+id); }
function caseCol(id, name){ return state.dbHandle.collection('cases/'+id+'/'+name); }
function touchCase(id){ if(state.dbHandle) caseDoc(id).update({updatedAt:nowISO()}).catch(()=>{}); }

function subscribeCaseList(){
  const unsub = state.dbHandle.collection('cases').orderBy('updatedAt','desc').limit(200).onSnapshot(
    snap => {
      state.cases = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      if(state.screen==='caselist') render();
      if(state.screen==='dashboard') loadDashboardData();
    },
    listenErr
  );
  state.unsubList = unsub;
}
function unsubscribeCase(){ state.unsub.forEach(u=>{ try{u();}catch(e){} }); state.unsub=[]; }
function goHome(screen){ unsubscribeCase(); state.openCase=null; state.screen=screen||'caselist'; render(); if(state.screen==='dashboard' && state.dbHandle) loadDashboardData(); }
function openCase(id){
  unsubscribeCase();
  state.evidence=[]; state.events=[]; state.conditions=[]; state.icamFactors=[]; state.correctiveActions=[]; state.contributingFactors=[]; state.rootCauses=[]; state.keyLearnings=[]; state.photos=[]; state.investigationTeam=[]; state.involvedPersons=[]; state.evidenceFiles=[]; state.diagrams=[]; state.chartView='drawio'; state.openCase=null; state.expandedFiles=new Set();
  state.screen='case'; state.stage='initial'; render();
  let sawCaseOnce=false;
  state.unsub.push(caseDoc(id).onSnapshot(d=>{
    if(!d.exists){ if(sawCaseOnce && state.screen==='case' && state.stage){ toast('This case was deleted.'); closeCase(); } else { state.openCase=null; safeRerender(); } return; }
    sawCaseOnce=true; state.openCase = Object.assign({id:d.id}, d.data()); safeRerender(); if(state.stage==='initial'||state.screen!=='case') render();
  }, listenErr));
  state.unsub.push(caseCol(id,'evidence').onSnapshot(s=>{ state.evidence = s.docs.map(d=>{ const data=d.data(); return Object.assign({}, data, {_docId:d.id, id:data.id||d.id}); }); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'events').onSnapshot(s=>{ state.events = s.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(a.order||0)-(b.order||0)); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'conditions').onSnapshot(s=>{ state.conditions = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'icamFactors').onSnapshot(s=>{ state.icamFactors = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'correctiveActions').onSnapshot(s=>{ state.correctiveActions = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'contributingFactors').onSnapshot(s=>{ state.contributingFactors = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'rootCauses').onSnapshot(s=>{ state.rootCauses = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'keyLearnings').onSnapshot(s=>{ state.keyLearnings = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'photos').onSnapshot(s=>{ state.photos = s.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(a.order||0)-(b.order||0)); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'investigationTeam').onSnapshot(s=>{ state.investigationTeam = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'involvedPersons').onSnapshot(s=>{ state.involvedPersons = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'evidenceFiles').onSnapshot(s=>{ state.evidenceFiles = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
  state.unsub.push(caseCol(id,'diagrams').onSnapshot(s=>{ state.diagrams = s.docs.map(d=>Object.assign({id:d.id}, d.data())); safeRerender(); }, listenErr));
}
function closeCase(){ goHome(state.cameFrom||'caselist'); }

async function createCase(){
  if(!state.dbHandle){ toast('No data connection available — cannot create a case in this preview.'); return; }
  const ref = await state.dbHandle.collection('cases').add(newCaseDefaults());
  openCase(ref.id);
}

/* ---------- case package import ------------------------------------------
   Creates a new case from a JSON case package: { format:'storyline-casebook-
   case', case:{header fields}, evidence:[], events:[], conditions:[], ... }.
   Records keep their ids as document ids so event/condition/ICAM/root-cause
   links survive; evidence keeps its EV-tag in the id field like Stage 2. */
const CASE_HEADER_FIELDS = ['caseTitle','facility','location','incidentType','dateOccurred','timeOccurred','reportedBy','reportedAt','personsInvolved','initialDescription','refinedDescription','actualSeverity','potentialSeverity','immediateActionsTaken','sceneSecured','accessLogStarted','notificationsRequired','status','rootCause'];
async function importCasePackage(file, btn){
  if(!state.dbHandle){ toast('No data connection — open the Casebook from its claude.ai link to import a case.'); return; }
  let pkg; try{ pkg = JSON.parse(await file.text()); }catch(e){ toast('That file is not valid JSON.'); return; }
  if(!pkg || pkg.format!=='storyline-casebook-case' || !pkg.case || typeof pkg.case!=='object'){ toast('That file is not a Storyline Casebook case package.'); return; }
  const label = btn ? btn.innerHTML : ''; if(btn){ btn.disabled = true; btn.textContent = 'Importing…'; }
  let caseId = null;
  try{
    const header = newCaseDefaults();
    CASE_HEADER_FIELDS.forEach(k=>{ if(pkg.case[k]!==undefined) header[k] = pkg.case[k]; });
    header.actualSeverity = Math.min(5, Math.max(1, parseInt(header.actualSeverity,10)||1));
    header.potentialSeverity = Math.min(5, Math.max(1, parseInt(header.potentialSeverity,10)||1));
    if(!CASE_STATUSES.some(s=>s.v===header.status)) header.status = 'open';
    if(pkg.source) header.importedFrom = String(pkg.source).slice(0,200);
    header.createdAt = nowISO(); header.updatedAt = nowISO();
    const ref = await state.dbHandle.collection('cases').add(header); caseId = ref.id;
    const list = n => Array.isArray(pkg[n]) ? pkg[n].filter(r=>r && typeof r==='object') : [];
    const strip = r => { const o = Object.assign({}, r); delete o._docId; delete o.id; return o; };
    const docId = r => (typeof r.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(r.id)) ? r.id : null;
    const writes = [];
    list('evidence').forEach(e=>{ const o = strip(e); if(e.id) o.id = String(e.id); writes.push(()=>caseCol(caseId,'evidence').add(o)); });
    list('events').forEach((e,i)=>{ const o = strip(e); o.lane = o.lane||0; o.order = typeof o.order==='number' ? o.order : i; o.mergeTo = o.mergeTo||null; o.evidenceIds = o.evidenceIds||[]; const id = docId(e); writes.push(()=> id ? caseCol(caseId,'events').doc(id).set(o) : caseCol(caseId,'events').add(o)); });
    ['conditions','icamFactors','contributingFactors','rootCauses','keyLearnings','correctiveActions'].forEach(n=> list(n).forEach(r=>{ const o = strip(r); const id = docId(r); writes.push(()=> id ? caseCol(caseId,n).doc(id).set(o) : caseCol(caseId,n).add(o)); }));
    ['investigationTeam','involvedPersons'].forEach(n=> list(n).forEach(r=> writes.push(()=>caseCol(caseId,n).add(strip(r)))));
    list('photos').forEach((p,i)=>{ if(typeof p.dataUrl!=='string' || !/^data:image\//.test(p.dataUrl) || p.dataUrl.length>240000) return; const o = strip(p); o.order = typeof o.order==='number' ? o.order : i+1; o.uploadedAt = o.uploadedAt || nowISO(); writes.push(()=>caseCol(caseId,'photos').add(o)); });
    list('evidenceFiles').forEach(f=>{ if(typeof f.dataUrl==='string' && f.dataUrl.length<=240000) writes.push(()=>caseCol(caseId,'evidenceFiles').add(strip(f))); });
    for(let i=0;i<writes.length;i+=8){ await Promise.all(writes.slice(i,i+8).map(w=>w())); if(btn) btn.textContent = `Importing… ${Math.min(writes.length,i+8)}/${writes.length}`; }
    touchCase(caseId);
    toast('Case imported: '+(header.caseTitle||'Untitled Investigation'));
    state.cameFrom='caselist'; openCase(caseId);
  }catch(e){
    toast('Import stopped part-way ('+describeDbError(e)+').'+(caseId?' The partly imported case is in the list; delete it in Admin Mode and try again.':''));
  }finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = label; } }
}

/* ---------- generic delete-with-undo (evidence, events, conditions, ICAM
   factors, contributing factors, root causes, key learnings, actions) ----- */
async function deleteItemWithUndo(caseId, collName, docId, list, label){
  const item = (list||[]).find(x=>x.id===docId);
  const data = item ? Object.assign({}, item) : null;
  if(data) delete data.id;
  await caseCol(caseId, collName).doc(docId).delete().catch(()=>{});
  touchCase(caseId);
  if(data){
    toastUndo(`${label} removed.`, async ()=>{
      await caseCol(caseId, collName).doc(docId).set(data).catch(()=>{});
      touchCase(caseId);
    });
  } else {
    toast(`${label} removed.`);
  }
}

/* ---------- whole-case delete (admin), with undo ------------------------- */
function collSnapshotOnce(ref){
  return new Promise(resolve=>{
    let unsubFn=null, resolved=false;
    unsubFn = ref.onSnapshot(s=>{
      if(resolved) return; resolved=true;
      resolve(s.docs.map(d=>({id:d.id, data:d.data()})));
      Promise.resolve().then(()=>{ if(unsubFn) unsubFn(); });
    });
  });
}
function docSnapshotOnce(ref){
  return new Promise(resolve=>{
    let unsubFn=null, resolved=false;
    unsubFn = ref.onSnapshot(d=>{
      if(resolved) return; resolved=true;
      resolve(d.exists ? d.data() : null);
      Promise.resolve().then(()=>{ if(unsubFn) unsubFn(); });
    });
  });
}
const CASE_SUBCOLLECTIONS = ['evidence','events','conditions','icamFactors','contributingFactors','rootCauses','keyLearnings','correctiveActions','photos','investigationTeam','involvedPersons','evidenceFiles','diagrams'];
async function fetchCaseFull(id){
  const [caseData, ...subResults] = await Promise.all([
    docSnapshotOnce(caseDoc(id)),
    ...CASE_SUBCOLLECTIONS.map(name=>collSnapshotOnce(caseCol(id,name)))
  ]);
  const subData = {}; CASE_SUBCOLLECTIONS.forEach((name,i)=>{ subData[name]=subResults[i]; });
  return { caseData, subData };
}
async function deleteCase(id){
  if(!state.dbHandle) return;
  try{
    const { caseData, subData } = await fetchCaseFull(id);
    if(!caseData){ toast('Case already removed.'); state.confirmDeleteCase=null; render(); return; }
    await Promise.all(CASE_SUBCOLLECTIONS.flatMap(name => subData[name].map(item => caseCol(id,name).doc(item.id).delete().catch(()=>{}))));
    await caseDoc(id).delete().catch(()=>{});
    if(state.openCase && state.openCase.id===id) closeCase();
    state.confirmDeleteCase = null;
    render();
    toastUndo(`Case "${caseData.caseTitle||'Untitled Investigation'}" deleted.`, async ()=>{
      await caseDoc(id).set(caseData).catch(()=>{});
      await Promise.all(CASE_SUBCOLLECTIONS.flatMap(name => subData[name].map(item => caseCol(id,name).doc(item.id).set(item.data).catch(()=>{}))));
      toast('Case restored.');
    });
  }catch(e){
    toast('Could not delete this case — please try again.');
    state.confirmDeleteCase = null; render();
  }
}

function dateBounds(){
  const days = state.cases.map(c=>c.dateOccurred).filter(Boolean).map(d=>Math.floor(new Date(d+'T00:00:00Z').getTime()/86400000)).filter(n=>!isNaN(n));
  if(!days.length) return null;
  return { min:Math.min(...days), max:Math.max(...days) };
}
function distinctFacilities(){ return Array.from(new Set(state.cases.map(c=>c.facility).filter(Boolean))).sort(); }
function passesFilters(c){
  const f = state.filters;
  const bounds = dateBounds();
  if(bounds && (f.dateFrom!=null || f.dateTo!=null) && c.dateOccurred){
    const day = Math.floor(new Date(c.dateOccurred+'T00:00:00Z').getTime()/86400000);
    if(f.dateFrom!=null && day < f.dateFrom) return false;
    if(f.dateTo!=null && day > f.dateTo) return false;
  }
  const sevLevel = Math.max(c.actualSeverity||1, c.potentialSeverity||1);
  if(sevLevel < f.sevMin || sevLevel > f.sevMax) return false;
  if(f.facility && c.facility !== f.facility) return false;
  if(f.status && c.status !== f.status) return false;
  return true;
}
function filteredCases(){ return state.cases.filter(passesFilters); }
function filtersActiveCount(){
  const f = state.filters;
  return [f.dateFrom!=null || f.dateTo!=null, f.sevMin>1 || f.sevMax<5, !!f.facility, !!f.status].filter(Boolean).length;
}
function onFiltersChanged(){
  if(state.screen==='caselist') render();
  else if(state.screen==='dashboard') loadDashboardData();
}
/* Two overlapping <input type=range> made to behave like one dual-handle
   slider: JS keeps the lower handle from passing the upper one, paints the
   highlighted span between them, and reports the live (lo,hi) pair. */
function wireDualRange(minId, maxId, fillId, minLabelId, maxLabelId, onChange, fmt){
  const minEl=document.getElementById(minId), maxEl=document.getElementById(maxId), fillEl=document.getElementById(fillId);
  if(!minEl||!maxEl) return;
  const minLabel=document.getElementById(minLabelId), maxLabel=document.getElementById(maxLabelId);
  const update = (fire)=>{
    let lo=parseFloat(minEl.value), hi=parseFloat(maxEl.value);
    if(lo>hi){ lo=hi; minEl.value=String(lo); }
    const lower=parseFloat(minEl.min), upper=parseFloat(minEl.max), range=(upper-lower)||1;
    const loPct=100*(lo-lower)/range, hiPct=100*(hi-lower)/range;
    if(fillEl){ fillEl.style.left=loPct+'%'; fillEl.style.width=Math.max(0,hiPct-loPct)+'%'; }
    if(minLabel) minLabel.textContent = fmt(lo);
    if(maxLabel) maxLabel.textContent = fmt(hi);
    if(fire) onChange(lo,hi);
  };
  minEl.oninput = ()=> update(true);
  maxEl.oninput = ()=> update(true);
  update(false);
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
const DASH_SUBCOLLECTIONS = ['evidence','events','icamFactors','contributingFactors','rootCauses','correctiveActions'];

async function loadDashboardData(){
  if(!state.dbHandle){ state.dashboard=null; if(state.screen==='dashboard') render(); return; }
  state.dashboardLoading = true;
  if(state.screen==='dashboard') render();
  const cases = filteredCases();
  try{
    const results = await Promise.all(cases.map(async c=>{
      const subs={};
      await Promise.all(DASH_SUBCOLLECTIONS.map(async name=>{ subs[name] = await collSnapshotOnce(caseCol(c.id, name)); }));
      return { case:c, subs };
    }));
    state.dashboard = computeDashboardAggregates(results);
  }catch(e){ state.dashboard = null; }
  state.dashboardLoading = false;
  if(state.screen==='dashboard') render();
}

function computeDashboardAggregates(results){
  const d = {
    totalCases: results.length,
    byStatus:{open:0,investigating:0,review:0,closed:0},
    byIncidentType:{}, byFacility:{}, byYear:{},
    sevMatrix: Array.from({length:5},()=>Array(5).fill(0)), // [potential-1][actual-1]
    levelCounts:{1:0,2:0,3:0,4:0},
    icamCategoryCounts:{defences:0,actions:0,conditions:0,organizational:0},
    icamCodeCounts:{},
    totalEvidence:0, totalEvents:0, totalRootCauses:0, totalContributingFactors:0,
    actionsTotal:0,
    actionsByTimeframe:{immediate:0,intermediate:0,longterm:0},
    actionsByHoc:{elimination:0,substitution:0,engineering:0,administrative:0,ppe:0},
    actionsWeak:0, actionsStrong:0,
    fatalityCount:0, highPotentialCount:0,
    cases: []
  };
  results.forEach(({case:c, subs})=>{
    const status = (d.byStatus[c.status]!=null) ? c.status : 'open';
    d.byStatus[status] = (d.byStatus[status]||0)+1;
    const it = c.incidentType || 'Unspecified'; d.byIncidentType[it]=(d.byIncidentType[it]||0)+1;
    const fac = c.facility || 'Unspecified'; d.byFacility[fac]=(d.byFacility[fac]||0)+1;
    const yr = (c.dateOccurred||'').slice(0,4) || 'Unknown'; d.byYear[yr]=(d.byYear[yr]||0)+1;
    const a = Math.min(5,Math.max(1,c.actualSeverity||1)), p = Math.min(5,Math.max(1,c.potentialSeverity||1));
    d.sevMatrix[p-1][a-1]++;
    d.levelCounts[investigationLevel(c)]++;
    if(a===5) d.fatalityCount++;
    if(p===5 && a<5) d.highPotentialCount++;
    d.totalEvidence += subs.evidence.length;
    d.totalEvents += subs.events.length;
    d.totalRootCauses += subs.rootCauses.length;
    d.totalContributingFactors += subs.contributingFactors.length;
    subs.icamFactors.forEach(({data:f})=>{
      if(d.icamCategoryCounts[f.category]!=null) d.icamCategoryCounts[f.category]++;
      if(f.code){
        if(!d.icamCodeCounts[f.code]) d.icamCodeCounts[f.code] = { count:0, cases:new Set(), label:f.codeLabel||icamCodeLabel(f.category,f.code)||f.code, category:f.category };
        d.icamCodeCounts[f.code].count++;
        d.icamCodeCounts[f.code].cases.add(c.id);
      }
    });
    subs.correctiveActions.forEach(({data:act})=>{
      d.actionsTotal++;
      if(d.actionsByTimeframe[act.timeframe]!=null) d.actionsByTimeframe[act.timeframe]++;
      if(d.actionsByHoc[act.hocLevel]!=null) d.actionsByHoc[act.hocLevel]++;
      if(assessStrength(act.action)==='weak') d.actionsWeak++; else d.actionsStrong++;
    });
    d.cases.push(c);
  });
  d.cases.sort((x,y)=> new Date(y.updatedAt||0) - new Date(x.updatedAt||0));
  return d;
}

function wireInitial(){
  if(isReadOnly()) return;
  const c = activeCase();
  const save = (field, value, rerender)=>{
    c[field] = value; // optimistic local update so the UI (e.g. investigation level) reflects it instantly
    if(rerender) renderStagePanel();
    debounce(field, ()=>{ caseDoc(c.id).update({[field]:value}).then(()=>touchCase(c.id)).catch(()=>{}); }, 500);
  };
  const bindText = (id, field)=>{ const el=document.getElementById(id); if(!el) return; el.oninput=()=> save(field, el.value, false); };
  ['caseTitle','facility','location','dateOccurred','timeOccurred','reportedBy','personsInvolved','initialDescription','immediateActionsTaken','notificationsRequired'].forEach(f=> bindText('f-'+f, f));
  const sel = (id, field, isNum, rerender)=>{ const el=document.getElementById(id); if(!el) return; el.onchange=()=> save(field, isNum?parseInt(el.value,10):el.value, rerender); };
  sel('f-incidentType','incidentType',false,false); sel('f-actualSeverity','actualSeverity',true,true); sel('f-potentialSeverity','potentialSeverity',true,true); sel('f-status','status',false,false);
  const chk = (id, field)=>{ const el=document.getElementById(id); if(!el) return; el.onchange=()=> save(field, el.checked, false); };
  chk('f-sceneSecured','sceneSecured'); chk('f-accessLogStarted','accessLogStarted');
  wirePersonRoster(c, 'investigationTeam');
  wirePersonRoster(c, 'involvedPersons');
}

function wirePersonRoster(c, key){
  const roleSel = document.getElementById(key+'-role');
  const customWrap = document.getElementById(key+'-customrole-wrap');
  if(roleSel && customWrap){
    const sync = ()=>{ customWrap.hidden = roleSel.value !== 'Other'; };
    roleSel.onchange = sync; sync();
  }
  const addBtn = document.querySelector(`[data-add-person="${key}"]`);
  if(addBtn) addBtn.onclick = async ()=>{
    const nameEl = document.getElementById(key+'-name');

    if(!name){ toast('Enter a name first.'); return; }
    const role = document.getElementById(key+'-role').value;
    const customRole = role==='Other' ? document.getElementById(key+'-customrole').value.trim() : '';
    const item = { name, role, customRole, organization: document.getElementById(key+'-org').value.trim(), contact: document.getElementById(key+'-contact').value.trim(), notes: document.getElementById(key+'-notes').value.trim() };
    try{ await caseCol(c.id, key).add(item); touchCase(c.id); }catch(e){ toast('Could not save.'); }
  };
  document.querySelectorAll(`[data-del-person^="${key}:"]`).forEach(b=>{
    b.onclick = ()=>{ const id = b.dataset.delPerson.slice(key.length+1); deleteItemWithUndo(c.id, key, id, state[key], key==='investigationTeam'?'Team member':'Person'); };
  });
}

function compressImageFile(file, maxDim, targetChars){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.naturalWidth||img.width, h = img.naturalHeight||img.height;
        const scale = Math.min(1, maxDim/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const draw = ()=>{ canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h); };
        draw();
        let quality = 0.82, dataUrl = canvas.toDataURL('image/jpeg', quality), attempts = 0;
        while(dataUrl.length > targetChars && attempts < 12){
          attempts++;
          if(quality > 0.4){ quality -= 0.12; }
          else { w = Math.round(w*0.82); h = Math.round(h*0.82); draw(); quality = 0.6; }
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve({ dataUrl, width:w, height:h });
      };
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
