<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Tripod Beta Investigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: investigation workbench. Slim brand bar, stage tabs, full-bleed tree canvas between a palette rail and an inspector.
   Tripod symbol colours (red Event, striped Agent, green Object, grey/blue/yellow causation) are fixed method colours, the same in both themes. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #142132; --muted: #5a6779; --line: #d3dae2;
  --accent: #1d4ea3; --accent-ink: #ffffff; --accent-soft: #e3ebf8;
  --err: #b42318; --err-soft: #fdecea; --warn: #9a5b00; --warn-soft: #fff3dc; --tip: #276a8a; --tip-soft: #e4f1f7; --ok: #20734a; --ok-soft: #e3f4ea;
  --canvas: #f9fafb; --grid: #dfe5ec; --edge: #3c4654; --brand: #0f2a4d;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #161f2a; --surface-2: #1c2633; --ink: #e3e9f0; --muted: #96a3b4; --line: #2b3746;
  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;
  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;
  --canvas: #111922; --grid: #222e3c; --edge: #b6c2d1; --brand: #0a1d36; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #161f2a; --surface-2: #1c2633; --ink: #e3e9f0; --muted: #96a3b4; --line: #2b3746;
  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;
  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;
  --canvas: #111922; --grid: #222e3c; --edge: #b6c2d1; --brand: #0a1d36; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); margin: 0; }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .09em; font-size: .8rem; color: var(--muted); font-weight: 600; }

#app { min-height: 100%; display: flex; flex-direction: column; }
.top { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .co { font-family: var(--f-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .82rem; color: #9fc0ff; white-space: nowrap; }
.brand .app { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; white-space: nowrap; }
.top .case-name { flex: 1 1 200px; min-width: 0; font-size: .92rem; color: #d6e2f5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .pill { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.22); }
.top .pill.off { color: #ffd38f; } .top .pill.live { color: #8fe3b4; }
.top .btn.ghost { color: #fff; border-color: rgba(255,255,255,.3); }
.top .btn.ghost:hover { background: rgba(255,255,255,.1); }

.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 10px 12px 9px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: .72rem; font-weight: 600; font-family: var(--f-mono); }
.count.err { background: var(--err); color: #fff; } .count.warn { background: var(--warn); color: #fff; } .count.ok { background: var(--ok); color: #fff; }

main { flex: 1; min-height: 0; }
.page { max-width: 1180px; margin: 0 auto; padding-block: 22px 60px; padding-inline: 16px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.page-head > div { min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: .9rem; line-height: 1.3; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); border-color: var(--err); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 8px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.panel > h2, .panel > h3 { margin-bottom: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--ok); } .pill.off { color: var(--warn); }
.st-Draft { color: var(--muted); } .st-In-review { color: var(--warn); } .st-Final { color: var(--ok); }

.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 16px; font-size: .9rem; border-bottom: 1px solid var(--line); }
.banner.warn { background: var(--warn-soft); color: var(--ink); }
.banner.info { background: var(--tip-soft); }
.banner.err { background: var(--err-soft); }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > span, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], input[type=search], input:not([type]), select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 6px 8px; min-width: 0; }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[readonly], textarea[readonly], select:disabled { background: var(--surface-2); color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: .9rem; }

/* case list */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.case-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.case-card h3 { font-size: 1.15rem; overflow-wrap: anywhere; }
.case-card .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.case-card .row { margin-top: auto; padding-top: 6px; }
.case-card.example { border-style: dashed; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 26px; text-align: center; color: var(--muted); }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--err-soft); padding: 6px 8px; border-radius: 5px; font-size: .85rem; }

/* tree workbench */
.bench { display: grid; grid-template-columns: 188px minmax(0, 1fr) 330px; height: calc(100vh - 96px); min-height: 520px; }
.palette { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.pal-group { display: flex; flex-direction: column; gap: 5px; }
.pal-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--surface); cursor: grab; text-align: left; font-size: .84rem; }
.pal-item:hover { border-color: var(--accent); }
.pal-item svg { flex: 0 0 auto; }
.stage-card { border-left: 3px solid var(--accent); padding: 2px 0 2px 8px; font-size: .8rem; color: var(--muted); }

.canvas-wrap { position: relative; min-width: 0; background: var(--canvas); overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; }
#cv.panning { cursor: grabbing; }
.toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.toolbar .grp { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.toolbar .grp .btn { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.toolbar .grp .btn:last-child { border-right: 0; }
.zoomlbl { font-family: var(--f-mono); font-size: .78rem; padding: 6px 8px; color: var(--muted); min-width: 52px; text-align: center; }
.hint { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: .78rem; color: var(--muted); pointer-events: none; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.edge.probable { stroke-dasharray: 2 4; stroke-linecap: round; stroke-width: 2; }
.edge.note { stroke-dasharray: 5 4; stroke-width: 1; opacity: .7; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge-sel { stroke: var(--accent) !important; stroke-width: 3; }
.node { cursor: move; }
.node .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 3; display: none; }
.node.sel .sel-ring { display: block; }
.node .port { fill: var(--surface); stroke: var(--accent); stroke-width: 2; cursor: crosshair; opacity: 0; transition: opacity .12s; }
.node:hover .port, .node.sel .port { opacity: 1; }
.node.hl .sel-ring { display: block; stroke: var(--warn); }
.ghost-link { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: none; pointer-events: none; }
.band { fill: none; stroke: var(--accent); stroke-dasharray: 4 3; fill-opacity: .06; }
.lane-label { font: 600 11px var(--f-display); letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }

.inspector { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.inspector h3 { display: flex; align-items: center; gap: 8px; }
.sym { flex: 0 0 auto; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link-row { display: flex; gap: 6px; align-items: center; font-size: .84rem; padding: 3px 6px; background: var(--surface-2); border-radius: 4px; }
.link-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-row .dir { flex: 0 0 auto; font-family: var(--f-mono); color: var(--muted); font-size: .75rem; }
.xbtn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 1rem; line-height: 1; }
.xbtn:hover { color: var(--err); }
.coach { background: var(--tip-soft); border-radius: 6px; padding: 10px 12px; font-size: .86rem; display: flex; flex-direction: column; gap: 6px; }
.coach ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.coach .ref { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }

/* issues */
.issues { display: flex; flex-direction: column; gap: 6px; }
.issue { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); }
.issue .sev { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; padding-top: 2px; }
.issue.error .sev { color: var(--err); } .issue.warning .sev { color: var(--warn); } .issue.tip .sev { color: var(--tip); }
.issue.error { border-left: 4px solid var(--err); } .issue.warning { border-left: 4px solid var(--warn); } .issue.tip { border-left: 4px solid var(--tip); }
.issue .ref { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.allclear { background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 10px 12px; font-weight: 500; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tbl th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td textarea { min-height: 54px; }
.tbl td select { min-width: 104px; }
.tbl td input[type=date] { min-width: 136px; }
.tbl td input { min-width: 120px; }
.smart { display: flex; gap: 2px; }
.smart label { display: inline-flex; flex-direction: column; align-items: center; font-family: var(--f-mono); font-size: .72rem; gap: 1px; cursor: pointer; }
.tgt { font-size: .8rem; }

/* BRF chart */
.chart-row { display: grid; grid-template-columns: 210px minmax(0, 1fr) 34px; gap: 10px; align-items: center; padding: 3px 0; font-size: .88rem; }
.chart-row .bar { height: 16px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.chart-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chart-row .code { font-family: var(--f-mono); font-weight: 500; display: inline-block; width: 28px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.stat b { display: block; font-family: var(--f-display); font-size: 1.8rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

/* report preview */
.rpt-frame { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 8px; padding: 0; overflow: hidden; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.sym-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sym-row:last-child { border-bottom: 0; }
dl.gl { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; }
dl.gl dt { font-weight: 600; } dl.gl dd { margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: .9rem; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.modal-bg { position: fixed; inset: 0; background: rgba(10,18,30,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 1100px) { .bench { grid-template-columns: 170px minmax(0, 1fr) 290px; } }
@media (max-width: 860px) {
  .bench { grid-template-columns: 1fr; height: auto; }
  .palette { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px 16px; }
  .pal-group { flex-direction: row; } .pal-group .eyebrow, .stage-card { display: none; }
  .pal-item { white-space: nowrap; }
  .canvas-wrap { height: 62vh; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px; }
  .chart-row { grid-template-columns: 120px minmax(0, 1fr) 28px; }
  .issue { grid-template-columns: minmax(0, 1fr) auto; } .issue .sev { grid-column: 1 / -1; }
  .top { padding: 8px 16px; } .brand .co { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .top, .tabs, .banner, .no-print { display: none !important; } }
</style>

<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
    async del(k) { try { const d = await db(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async keys(prefix) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res((q.result || []).filter(k => typeof k === 'string' && (!prefix || k.startsWith(prefix)))); q.onerror = () => res([]); }); } catch (e) { return []; } }
  };

  /* ---------- files ---------- */
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function pickWithInput(accept) {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.style.display = 'none';

    if (!handle || !handle.queryPermission) return 'denied';

      let s = await handle.queryPermission({ mode: 'readwrite' });

  }

  function FileLink(opts) {

    const key = id => 'handle:' + opts.tool + ':' + id;

      supported: hasFSA,
      /* Ask where to save; returns {handle, name} or null when cancelled. */
      async saveAs(id, suggested, text) {

      async open() {

          let hs;
          try { hs = await window.showOpenFilePicker({ types, multiple: false, id: 'iikit-cases' }); }

      async unlink(id) { await KitStore.del(key(id)); },
      async handleFor(id) { return await KitStore.get(key(id)); },

  }

  /* ---------- registry of investigations on this computer ---------- */
  const RK = 'iikit.registry';
  const KitRegistry = {
    list() { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } },
    upsert(entry) {
      try {
        const L = this.list().filter(x => !(x.tool === entry.tool && x.id === entry.id));
        L.push(Object.assign({ seenAt: new Date().toISOString() }, entry));

      } catch (e) {}
    },
    remove(tool, id) { try { localStorage.setItem(RK, JSON.stringify(this.list().filter(x => !(x.tool === tool && x.id === id)))); } catch (e) {} }
  };

  function actionStats(items, isOpen, dueOf) {

<script>/* Tripod Beta Investigator — method content.

      ['ea2', 'b4'], ['b4', 'ea3'], ['o3', 'ea3'],
      ['ea3', 'eo4'], ['o4', 'b5'], ['b5', 'eo4'],
      ['a5', 'b7'], ['b7', 'b6'], ['b6', 'e5'], ['eo4', 'e5'],
      ['ic1', 'b1'], ['ic2', 'b2'], ['ic3', 'b3'], ['ic4', 'b4'], ['ic5', 'b5'], ['ic6', 'b6'], ['ic7', 'b7'],
      ['pc1', 'ic1'], ['pc1', 'ic2'], ['pc2', 'ic2'], ['pc3', 'ic3'], ['pc4', 'ic3'], ['pc5', 'ic4'], ['pc6', 'ic5'], ['pc7', 'ic6'], ['pc8', 'ic6'], ['pc9', 'ic7'],
      ['uc1', 'pc1'], ['uc2', 'pc2'], ['uc3', 'pc3'], ['uc4', 'pc3'], ['uc5', 'pc4'], ['uc5', 'pc5'], ['uc6', 'pc6'], ['uc7', 'pc6'], ['uc8', 'pc7'], ['uc9', 'pc8'], ['uc10', 'pc9'],
      ['n1', 'o4']
    ].map((e, i) => ({ id: 'x' + (i + 1), from: e[0], to: e[1] })),
    actions: [
      ['b1', 'Logistics planners to check delivery urgency with the requester before dispatch and combine non-urgent loads with scheduled truck runs.', 'Logistics Superintendent', 30, 'High'],
      ['b2', 'Add a documented driver fitness and rest check to the journey management pre-departure briefing; Journey Manager to stop any driver who fails it.', 'Journey Management owner', 30, 'High'],
      ['b3', 'Brief every driver before departure on fatigue: when drowsy, pull off and take a 20-minute nap. Record the briefing on the Journey Management Plan.', 'Transport Manager', 14, 'High'],
      ['b4', 'Add recovery from running off the road (slow down, steer back gently) to the practical module of the advanced driving course.', 'Training Manager', 90, 'Medium'],
      ['b7', 'Require the planned route to be written on the Journey Management Plan and any deviation to be reported to base before it is taken.', 'Journey Management owner', 30, 'High'],
      ['b5', 'Make seat-belt use a stated condition of driving company vehicles and check it at gate exits for three months.', 'Transport Manager', 14, 'High'],
      ['b6', 'Rehearse overdue-vehicle search mobilisation against the 45-minute target at random times, quarterly.', 'Emergency Response Coordinator', 90, 'Medium'],
      ['uc1', 'Agree delivery priority definitions with customers and hold a monthly delivery planning meeting.', 'Logistics Superintendent', 60, 'Medium'],
      ['uc2', 'Revise the Journey Management Procedure to include driver fitness, rest and alertness criteria.', 'HSE Manager', 60, 'High'],
      ['uc3', 'Introduce duty-hour and minimum-rest rules for drivers and monitor them through the roster.', 'Transport Manager', 90, 'High'],
      ['uc4', 'Review driver numbers against trip demand and recruit or reschedule to remove the shortfall.', 'Operations Manager', 120, 'Medium'],
      ['uc5', 'Require an advanced driving course (alertness, fatigue and vehicle recovery skills) for all drivers.', 'Training Manager', 180, 'Medium'],
      ['uc7', 'Correct the induction material on seat belts and brief all induction trainers on the company rule.', 'HSE Manager', 30, 'High'],
      ['uc6', 'Run a line-manager-led driving culture programme with recognition for compliant driving and visible follow-up of risk-taking.', 'Operations Manager', 120, 'Medium'],
      ['uc9', 'Audit compliance with emergency duty and on-call procedures monthly and report results to the management team.', 'Operations Manager', 60, 'Medium'],
      ['uc8', 'Remove outdoor duties from control-room operators while on emergency watch, or add a relief operator.', 'Operations Manager', 60, 'Medium'],

    ].map((a, i) => ({ id: 'act' + (i + 1), target: a[0], text: a[1], owner: a[2], due: '+' + a[3], priority: a[4], status: 'Open', smart: { S: true, M: true, A: true, R: true, T: true }, agreed: true, closeNote: '' })),
    log: []
  };

  return { TYPES, PALETTE, BRF, ERRORS, OBJECT_KINDS, STAGES, TIPS, SMART, GLOSSARY, EXAMPLE };
})();
if (typeof module !== 'undefined') module.exports = TBC;
