="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600" text-anchor="start">Magnetic Operating-Point Board</text><text x="95" y="40" font-size="6" fill="#5B6B7C" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;" text-anchor="start">Centrifugal pump H–Q chart · place the pump curve, the system curve and the POR/AOR bar, then mark the operating point</text><text x="795" y="30" font-size="6" fill="#5B6B7C" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;" text-anchor="end">Mechanical engineering training · Istec Training</text><text x="795" y="40" font-size="5" fill="#5B6B7C" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;" text-anchor="end">[Illustrative pump and system data, for training only]</text><rect x="519" y="86" width="272" height="118" rx="2" fill="#F4F7FA" stroke="#AEB9C6" stroke-width="0.4"/><text x="523" y="94" font-size="5" fill="#172231" style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700" text-anchor="start">PUMP NAMEPLATE</text><text x="523" y="101" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">Loop-bench pump, 4 kW, 4-pole</text><text x="523" y="106.4" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">Rated speed 1480 rpm · full impeller Ø174 mm</text><text x="523" y="111.8" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">Shut-off head 32 m · BEP 24 m³/h at 21.4 m · η 72 %</text><text x="523" y="117.2" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">Motor 4 kW · runout 47.4 m³/h</text><text x="523" y="128" font-size="4.2" fill="#172231" style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700" text-anchor="start">AFFINITY LAWS</text><text x="523" y="133.4" font-size="4" fill="#172231" style="font-family:'IBM Plex Mono',Menlo,monospace;font-weight:400" text-anchor="start">Q ∝ N · D      H ∝ (N · D)²      P ∝ (N · D)³</text><text x="523" y="144.2" font-size="4.2" fill="#172231" style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700" text-anchor="start">SYSTEM CURVE</text><text x="523" y="149.6" font-size="4" fill="#172231" style="font-family:'IBM Plex Mono',Menlo,monospace;font-weight:400" text-anchor="start">H = H_static + K · Q²   (K in m per (m³/h)²)</text><text x="523" y="155" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">Baseline: H_static 10 m, K = 0.020 (pipe 0.015 + strainer 0.005)</text><text x="523" y="165.8" font-size="4.2" fill="#172231" style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700" text-anchor="start">PIECES</text><text x="523" y="171.2" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">P1–P4 speed curves · P5–P7 trimmed impellers · P8 two pumps in parallel</text><text x="523" y="176.60000000000002" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">S1–S5 system parabolas (slide up/down to the static head)</text><text x="523" y="182" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">W1–W8 POR/AOR bars (lay on the Q axis) · BEP dots · OP markers</text><text x="523" y="192.8" font-size="4.2" fill="#172231" style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700" text-anchor="start">REGISTRATION</text><text x="523" y="198.2" font-size="4" fill="#172231" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-weight:400" text-anchor="start">Align the Q = 0 end and the white "Q 10 / 20 / 30" ticks to the grid.</text><text x="95" y="564" font-size="4.6" fill="#5B6B7C" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;" text-anchor="start">Static head: the bottom-left end of a system piece sits on the H = static head line at Q = 0.   POR = 70–120 % of Q_BEP (ANSI/HI 9.6.3) · AOR = 50–130 % (illustrative) · both scale with speed and diameter.</text><text x="95" y="572" font-size="4.6" fill="#5B6B7C" style="font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;" text-anchor="start">Print at 100 % on A1 (841 × 594 mm). Mount on a steel sheet or a magnetic whiteboard. Pieces are on the matching A1/A3 sheets: laminate, cut on the black outline, magnetic tape on the back.</text>
</svg>
