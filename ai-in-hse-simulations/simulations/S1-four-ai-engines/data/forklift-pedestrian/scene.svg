<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, sans-serif">
  <rect width="400" height="300" fill="#dfe4ea"/>
  <!-- yard slab -->
  <rect y="120" width="400" height="180" fill="#c7ced6"/>
  <!-- marked walkway (yellow), running along the right -->
  <rect x="300" y="120" width="46" height="180" fill="#f2d64b" opacity="0.55"/>
  <line x1="300" y1="120" x2="300" y2="300" stroke="#c9a814" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="346" y1="120" x2="346" y2="300" stroke="#c9a814" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- segregation barrier with a 4 m gap -->
  <g stroke="#8a94a0" stroke-width="7">
    <line x1="60" y1="205" x2="150" y2="205"/>
    <line x1="230" y1="205" x2="292" y2="205"/>
  </g>
  <text x="158" y="200" font-size="11" fill="#b23b3b">gap (trailer strike, unrepaired)</text>
  <!-- bay 6 opening -->
  <rect x="20" y="60" width="120" height="90" fill="#aeb8c2"/>
  <text x="30" y="52" font-size="12" fill="#5b6b7c">Bay 6</text>
  <!-- forklift, reversing out (arrow points back/right) -->
  <g>
    <rect x="96" y="150" width="70" height="40" rx="4" fill="#e08b2f"/>
    <rect x="150" y="140" width="10" height="52" fill="#5b6b7c"/>            <!-- mast -->
    <line x1="150" y1="150" x2="176" y2="150" stroke="#5b6b7c" stroke-width="4"/>
    <line x1="150" y1="182" x2="176" y2="182" stroke="#5b6b7c" stroke-width="4"/>
    <circle cx="112" cy="192" r="10" fill="#2b3a4a"/><circle cx="150" cy="192" r="10" fill="#2b3a4a"/>
    <circle cx="120" cy="168" r="7" fill="#33424f"/>                          <!-- operator head -->
  </g>
  <path d="M92 170 l-22 0 m0 0 l8 -6 m-8 6 l8 6" stroke="#b23b3b" stroke-width="3" fill="none"/>
  <!-- pedestrian crossing the lane, off the walkway, on phone -->
  <g fill="#2b3a4a">
    <circle cx="250" cy="150" r="9"/>
    <rect x="245" y="159" width="11" height="30" rx="3"/>
    <line x1="246" y1="189" x2="240" y2="220" stroke="#2b3a4a" stroke-width="6" stroke-linecap="round"/>
    <line x1="254" y1="189" x2="260" y2="220" stroke="#2b3a4a" stroke-width="6" stroke-linecap="round"/>
    <line x1="252" y1="164" x2="266" y2="158" stroke="#2b3a4a" stroke-width="5" stroke-linecap="round"/>
    <rect x="264" y="152" width="7" height="10" rx="1" fill="#4a90d9"/>       <!-- phone -->
  </g>
  <text x="12" y="20" font-size="12" fill="#5b6b7c">Despatch yard · 14:05 · fixed camera (synthetic illustration)</text>
</svg>
