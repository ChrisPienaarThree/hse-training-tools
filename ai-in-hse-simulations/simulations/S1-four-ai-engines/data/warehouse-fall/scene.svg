<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, sans-serif">
  <rect width="400" height="300" fill="#e9edf2"/>
  <!-- floor -->
  <rect y="240" width="400" height="60" fill="#cfd6de"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#9aa7b4" stroke-width="2"/>
  <!-- high-bay racking -->
  <g stroke="#5b6b7c" stroke-width="6" fill="none">
    <line x1="120" y1="30" x2="120" y2="240"/>
    <line x1="300" y1="30" x2="300" y2="240"/>
    <line x1="110" y1="60" x2="310" y2="60"/>
    <line x1="110" y1="120" x2="310" y2="120"/>
    <line x1="110" y1="180" x2="310" y2="180"/>
  </g>
  <g fill="#b98a4b">
    <rect x="130" y="34" width="40" height="22"/><rect x="180" y="34" width="34" height="22"/>
    <rect x="245" y="94" width="40" height="22"/><rect x="130" y="154" width="46" height="22"/>
  </g>
  <!-- leaning ladder -->
  <g stroke="#8a6d3b" stroke-width="5">
    <line x1="150" y1="238" x2="210" y2="70"/>
    <line x1="168" y1="238" x2="228" y2="70"/>
    <line x1="159" y1="205" x2="177" y2="205"/><line x1="168" y1="170" x2="186" y2="170"/>
    <line x1="177" y1="135" x2="195" y2="135"/><line x1="186" y1="100" x2="204" y2="100"/>
  </g>
  <!-- worker on ladder, over-reaching, no harness -->
  <g fill="#2b3a4a">
    <circle cx="214" cy="86" r="9"/>
    <rect x="209" y="95" width="11" height="26" rx="3"/>
    <line x1="220" y1="100" x2="250" y2="92" stroke="#2b3a4a" stroke-width="6" stroke-linecap="round"/>
    <line x1="212" y1="120" x2="205" y2="150" stroke="#2b3a4a" stroke-width="6" stroke-linecap="round"/>
    <line x1="218" y1="120" x2="224" y2="150" stroke="#2b3a4a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- dropped carton mid-air -->
  <rect x="228" y="150" width="20" height="16" fill="#b98a4b" transform="rotate(18 238 158)"/>
  <!-- second worker in drop zone -->
  <g fill="#3a4a5b">
    <circle cx="272" cy="150" r="9"/>
    <rect x="267" y="159" width="11" height="30" rx="3"/>
    <line x1="268" y1="189" x2="262" y2="220" stroke="#3a4a5b" stroke-width="6" stroke-linecap="round"/>
    <line x1="276" y1="189" x2="282" y2="220" stroke="#3a4a5b" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- shrink-wrap debris at ladder foot -->
  <g fill="#a9b6c2">
    <ellipse cx="158" cy="243" rx="16" ry="4"/><ellipse cx="150" cy="248" rx="10" ry="3"/>
  </g>
  <text x="12" y="22" font-size="12" fill="#5b6b7c">DC-3 · Aisle 14 · 07:20 · fixed camera (synthetic illustration)</text>
</svg>
